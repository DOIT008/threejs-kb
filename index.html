<script type="text/markdown" data-id="api-curves" data-title="API 19 · 曲线与事件系统" data-group="API 速查手册">
# API 19 · 曲线与事件系统

## 一、Curve（曲线基类）

用于生成路径、管道、运动轨迹。

| 属性/方法 | 说明 |
|---|---|
| `getPoint(t, optionalTarget)` | 取 t 处点（t ∈ [0,1]） |
| `getPointAt(u, optionalTarget)` | 按弧长取点（匀速） |
| `getTangent(t, optionalTarget)` | 取切线 |
| `getTangentAt(u, optionalTarget)` | 按弧长取切线 |
| `getPoints(divisions)` | 取一系列点（默认 12 段） |
| `getSpacedPoints(divisions)` | 等距取点 |
| `getLength()` / `getLengths(divisions)` | 长度 |
| `updateArcLengths()` | 更新弧长表 |
| `getUtoTmapping(u, distance)` | u → t 映射 |
| `computeFrenetFrames(segments, closed)` | 计算 Frenet 标架（管道用） |
| `clone()` / `toJSON()` / `fromJSON()` | 克隆/序列化 |

## 二、曲线子类

### 3D 曲线

```js
new THREE.LineCurve3(v1, v2)                    // 直线
new THREE.QuadraticBezierCurve3(v0, v1, v2)     // 二次贝塞尔
new THREE.CubicBezierCurve3(v0, v1, v2, v3)     // 三次贝塞尔
new THREE.CatmullRomCurve3(points, closed, curveType, tension) // 样条曲线（最常用）
```

| CatmullRomCurve3 参数 | 默认值 | 说明 |
|---|---|---|
| `points` | — | `Vector3[]` 控制点 |
| `closed` | `false` | 是否闭合 |
| `curveType` | `'centripetal'` | `'centripetal'` / `'chordal'` / `'catmullrom'` |
| `tension` | `0.5` | 张力（curveType='catmullrom' 时有效） |

```js
const curve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 0, 0),
  new THREE.Vector3(5, 3, 0),
  new THREE.Vector3(10, 0, 5)
]);

// 沿曲线放物体
const pt = curve.getPointAt(t);
mesh.position.copy(pt);
mesh.lookAt(curve.getPointAt(t + 0.01)); // 朝向切线方向
```

### 2D 曲线

`LineCurve`、`QuadraticBezierCurve`、`CubicBezierCurve`、`CatmullRomCurve3`（2D 点也行）、`EllipseCurve`、`ArcCurve`

### CurvePath（组合路径）

```js
const path = new THREE.CurvePath();
path.add(curve1);
path.add(curve2);
```

| 方法 | 说明 |
|---|---|
| `add(curve)` | 添加曲线 |
| `getLength()` / `getPoint(t)` / `getSpacedPoints(divisions)` | 同 Curve |
| `closePath()` | 闭合 |

### Shape（2D 形状）

```js
const shape = new THREE.Shape();
shape.moveTo(x, y);
shape.lineTo(x, y);
shape.quadraticCurveTo(cx, cy, x, y);
shape.bezierCurveTo(...);
shape.absarc(x, y, radius, start, end, clockwise);
shape.holes.push(holePath); // 挖洞
```

配合 `ShapeGeometry`（2D）和 `ExtrudeGeometry`（3D 挤出）使用。

**Path 方法**：`moveTo`、`lineTo`、`quadraticCurveTo`、`bezierCurveTo`、`splineThru`、`absarc`、`absellipse`、`arc`、`ellipse`、`closePath`

## 三、EventDispatcher（事件派发器）

很多 Three.js 对象（Object3D、Material、Loader、Controls、Mixer）都继承它。

| 方法 | 说明 |
|---|---|
| `addEventListener(type, listener)` | 注册监听 |
| `hasEventListener(type, listener)` | 是否已注册 |
| `removeEventListener(type, listener)` | 移除监听 |
| `dispatchEvent(event)` | 派发事件 |

事件对象：`{ type, target, ... }`

```js
const onClick = e => console.log('点击了', e.object);
mesh.addEventListener('click', onClick);
mesh.removeEventListener('click', onClick);
```

::: plain 大白话时间
Three.js 的事件系统和 DOM 事件几乎一样——`addEventListener` 注册，`dispatchEvent` 触发。区别是它不依赖 DOM，纯 JavaScript 对象也能用。
:::

## 四、Clock（已废弃，仅作了解）

```js
const clock = new THREE.Clock();
clock.getDelta();       // 距上次调用的时间
clock.getElapsedTime(); // 总时间
clock.start() / stop() / reset();
```

::: warning 注意
`Clock` 自 r183 起废弃，r186/r187 仍可用但有警告。新代码请用 `Timer`（见动画章节）。
:::

## 五、核心 API 速查总表

| 你想做的事 | 用的 API |
|---|---|
| 创建场景 | `new THREE.Scene()` |
| 创建相机 | `new THREE.PerspectiveCamera(...)` |
| 创建渲染器 | `new THREE.WebGLRenderer(...)` |
| 渲染一帧 | `renderer.render(scene, camera)` |
| 动画循环 | `renderer.setAnimationLoop(fn)` |
| 创建立方体 | `new THREE.Mesh(new THREE.BoxGeometry(), material)` |
| 放进场景 | `scene.add(obj)` |
| 改位置/旋转/缩放 | `obj.position/rotation/scale.set(...)` |
| 看向目标 | `obj.lookAt(x,y,z)` |
| 加灯光 | `scene.add(new THREE.DirectionalLight(...))` |
| 开阴影 | `renderer.shadowMap.enabled = true` + `castShadow/receiveShadow` |
| 加载纹理 | `new THREE.TextureLoader().load(url)` |
| 加载模型 | `new THREE.GLTFLoader().load(url, cb)` |
| 鼠标拾取 | `raycaster.setFromCamera()` + `intersectObjects()` |
| 相机控制 | `new OrbitControls(camera, domElement)` |
| 播放动画 | `AnimationMixer.clipAction().play()` + `mixer.update(dt)` |
| 后期处理 | `EffectComposer` + Pass 链 |
| 释放资源 | `geometry.dispose()` / `material.dispose()` / `texture.dispose()` |
| 查性能 | `renderer.info` |
| 查版本 | `THREE.REVISION` |

## 六、内存管理清单

| 资源 | 释放方法 |
|---|---|
| 几何体 | `geometry.dispose()` |
| 材质 | `material.dispose()` |
| 纹理 | `texture.dispose()` |
| 渲染目标 | `renderTarget.dispose()` |
| 控制器 | `controls.dispose()` |
| 渲染器 | `renderer.dispose()` / `forceContextLoss()` |
| 动画混合器 | `mixer.uncacheRoot(root)` |
| 阴影 | `light.shadow.dispose()` |

::: warning 铁律
从场景 `remove()` 物体**不会**释放显存。切换场景/页面时，必须递归遍历并 `dispose()` 所有几何体、材质、纹理，否则显存会一直涨。
:::
</script>

<script type="text/markdown" data-id="cases-start" data-title="案例 00 · 怎么用这些例子" data-group="实战案例集">
# 案例集使用说明

::: plain 这一册是干嘛的
前面 38 章讲的是「零件怎么用」，这一册直接给你**一整个一整个能跑的小作品**。每个案例都是**一个完整的 HTML 文件**——把代码复制走、存成 `.html`、用浏览器打开，就能看到会动的 3D 画面。不用装软件、不用构建工具。
:::

## 三步跑起来

1. 复制案例里的**全部**代码
2. 新建文本文件粘进去，保存成 `demo.html`（后缀必须是 `.html`）
3. 双击打开，或者直接拖进浏览器窗口

::: warning 打开是黑的怎么办
少数浏览器不允许本地文件直接加载 3D 模块。这时在该文件夹空白处按住 **Shift + 右键 → 在此处打开终端**，运行 `python -m http.server 8000`，再访问 `http://localhost:8000/demo.html` 即可。这也正是本知识库自身的打开方式。
:::

## 所有案例共用的「骨架」

代码看着长，其实套路固定。记住这四样，自己写也快：

| 部件 | 作用 | 大白话 |
|---|---|---|
| `scene` 场景 | 装所有东西的盒子 | 摄影棚 |
| `camera` 相机 | 决定从哪儿看 | 摄影机的镜头 |
| `renderer` 渲染器 | 把画面画到屏幕 | 摄影师按快门 |
| `setAnimationLoop` | 每帧画一次 | 连续播放形成动画 |

::: tip 关于版本
全部基于当前最新版 **r187**，CDN 链接写死在 `importmap` 里，联网即可运行。想换版本，改链接里的 `0.187.0` 就行。动画计时统一用浏览器自带的 `performance.now()`，零依赖、最省心。
:::

## 案例清单

| 案例 | 主题 | 你会练到 |
|---|---|---|
| 01 | 呼吸星球 | 缩放动画、颜色循环、灯光 |
| 02 | 拖拽甜甜圈 | 几何体、鼠标控制器 |
| 03 | 星空穿越 | 粒子系统、顶点数据更新 |
| 04 | 弹跳球 | 物理弹跳、真实阴影 |
| 05 | 波浪海面 | 顶点动画、法线重算 |
| 06 | 迷你太阳系 | 父子层级、公转自转 |
| 07 | 键盘小车 | 键盘事件、相机跟随 |
| 08 | 点击爆炸 | 射线拾取、粒子爆散 |
| 09 | 霓虹城市 | 后期处理泛光、实例化 |
| 10 | 万花筒 | InstancedMesh、矩阵变换 |
| 11 | 烟花秀 | 粒子生命周期、拖尾 |
| 12 | 水晶球 | PBR 折射、环境反射 |

::: plain 建议的学习顺序
零基础就**从上往下**敲一遍，每敲完一个改两个数字看变化（比如把速度 `2` 改成 `0.5`）。已经会的可以直接跳到感兴趣的那个，把代码拆开研究。别光看——**改参数**才是学得最快的方式。
:::
</script>

<script type="text/markdown" data-id="case-01" data-title="案例 01 · 会呼吸的变色星球" data-group="实战案例集">
# 案例 01：会呼吸的变色星球

::: plain 效果长啥样
漆黑的太空里悬浮着一颗球，它像心跳一样**一胀一缩**，颜色还在**不停地渐变**（绿→蓝→紫→红…），底下有网格当地平线。这就是最经典的「Hello World 升级版」。
:::

## 完整代码

保存为 `demo.html` 打开：

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>会呼吸的变色星球</title>
<style>body { margin: 0; overflow: hidden; }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
  }
}
<\/script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

// 1. 场景：黑色太空
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1020);

// 2. 相机：从正面看
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
camera.position.z = 6;

// 3. 渲染器
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// 4. 主角：一颗球（先不给颜色，颜色交给动画循环改）
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(1.5, 48, 32),
  new THREE.MeshStandardMaterial({ roughness: 0.3, metalness: 0.35 })
);
scene.add(ball);

// 5. 灯光：环境光打底 + 一盏主灯打出明暗
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const key = new THREE.DirectionalLight(0xffffff, 2.5);
key.position.set(4, 6, 5);
scene.add(key);

// 6. 地面网格：给眼睛一个「空间感」参照
const grid = new THREE.GridHelper(24, 24, 0x42b883, 0x223344);
grid.position.y = -2.2;
scene.add(grid);

// 7. 动画：每帧更新
renderer.setAnimationLoop(() => {
  const t = performance.now() / 1000;          // 从页面打开到现在的秒数
  ball.scale.setScalar(1 + Math.sin(t * 2) * 0.12);      // 正弦波 → 一胀一缩
  ball.material.color.setHSL((t * 0.12) % 1, 0.65, 0.55); // 色相循环 → 变色
  ball.rotation.y += 0.008;                               // 顺便自转
  renderer.render(scene, camera);
});

// 8. 窗口变化时自适应
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
<\/script>
</body>
</html>
```

## 关键点拆解

::: plain 三行动画在干嘛
- `Math.sin(t * 2)`：正弦波在 -1 到 1 之间来回摆，乘 `0.12` 缩小幅度，再加 `1` 让它永远接近 1 —— 于是球就在 0.88~1.12 倍之间**呼吸**。`2` 越大喘得越快。
- `setHSL((t * 0.12) % 1, ...)`：HSL 色相是 0~1 的圆环，`% 1` 让它转一圈又回到头，颜色就**循环渐变**。`0.12` 是变色速度。
- `setAnimationLoop`：Three.js 推荐的动画入口，浏览器每帧自动调一次（约 60 次/秒）。
:::

::: tip 自己改着玩
- 把 `0.12` 改成 `0.3` → 呼吸幅度变大，球快撑爆了
- 把 `t * 2` 改成 `t * 8` → 心跳加速
- 把 `SphereGeometry` 换成 `IcosahedronGeometry(1.5, 1)` → 变成低多边形风格
:::
</script>

<script type="text/markdown" data-id="case-02" data-title="案例 02 · 鼠标拖拽的甜甜圈" data-group="实战案例集">
# 案例 02：鼠标拖拽的甜甜圈

::: plain 效果长啥样
一个金属质感的「甜甜圈」（其实是环面纽结，比普通甜甜圈更酷），**按住鼠标拖动就能360度看它，滚轮能拉近拉远**。你不动它时，它自己还会慢慢转。
:::

## 完整代码

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鼠标拖拽的甜甜圈</title>
<style>body { margin: 0; overflow: hidden; }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
  }
}
<\/script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101018);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// 主角：环面纽结 —— 甜甜圈的豪华升级版
// 参数：半径 1.4、管粗 0.45、横向 180 段、纵向 32 段（段数越多越光滑）
const knot = new THREE.Mesh(
  new THREE.TorusKnotGeometry(1.4, 0.45, 180, 32),
  new THREE.MeshStandardMaterial({ color: 0x42b883, roughness: 0.25, metalness: 0.6 })
);
scene.add(knot);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 5, 5);
scene.add(light);
// 补一盏冷色背光，让金属边缘更立体
const rim = new THREE.DirectionalLight(0x4488ff, 1.5);
rim.position.set(-5, -2, -4);
scene.add(rim);

// 控制器：鼠标拖动旋转、滚轮缩放、右键平移
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;    // 惯性：松手后慢慢停下，手感更顺滑
controls.autoRotate = true;       // 没人操作时自己转
controls.autoRotateSpeed = 1.5;   // 自转速度

renderer.setAnimationLoop(() => {
  controls.update();              // 阻尼和自动旋转都必须每帧调用
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
<\/script>
</body>
</html>
```

## 关键点拆解

::: plain OrbitControls 是啥
它就是**现成的鼠标控制器**，帮你把「拖动 → 相机绕着物体转」这一堆数学全包了。你只要 new 一个、每帧 `update()` 一下，剩下的鼠标滚轮、右键平移它都处理好了。
:::

::: warning 最容易踩的坑
设了 `enableDamping = true` 却**忘了在动画里调 `controls.update()`**——结果就是画面卡住不动、拖了没反应。记住：只要开了阻尼或自动旋转，`update()` 就是必写项。
:::

::: tip 常用开关
| 属性 | 效果 |
|---|---|
| `enablePan = false` | 禁用右键平移，防止物体被拖出画面 |
| `minDistance / maxDistance` | 限制滚轮缩放范围，比如 `3` 到 `12` |
| `maxPolarAngle = Math.PI / 2` | 不让相机转到地平线以下 |
| `autoRotateSpeed = 5` | 自转加快 |
:::

::: plain 换个几何体试试
把 `TorusKnotGeometry(...)` 换成下面任意一行，甜甜圈立刻变身：

- `new THREE.TorusGeometry(2, 0.6, 32, 100)` → 普通甜甜圈
- `new THREE.IcosahedronGeometry(2, 0)` → 20 面体（硬核棱角）
- `new THREE.KnotGeometry` 不存在，别写错——是 `TorusKnotGeometry`
:::
</script>

<script type="text/markdown" data-id="case-03" data-title="案例 03 · 星空穿越" data-group="实战案例集">
# 案例 03：星空穿越

::: plain 效果长啥样
眼前是**几千颗彩色星星**组成的浩瀚宇宙，镜头不停往前飞，星星从身边呼啸而过冲向屏幕两侧，配上雾效有强烈的**纵深感**——像坐飞船穿越星际。
:::

## 完整代码

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>星空穿越</title>
<style>body { margin: 0; overflow: hidden; }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
  }
}
<\/script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000005);
scene.fog = new THREE.FogExp2(0x000005, 0.015);   // 远处的星星淡出 → 深度感

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 200);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// 造 3000 颗星星：每颗就是一个「点」
const count = 3000;
const positions = new Float32Array(count * 3);   // 每颗星 3 个数：x,y,z
const colors = new Float32Array(count * 3);      // 每颗星 3 个数：r,g,b
for (let i = 0; i < count; i++) {
  positions[i * 3]     = (Math.random() - 0.5) * 120;  // x 随机铺开
  positions[i * 3 + 1] = (Math.random() - 0.5) * 80;   // y 随机铺开
  positions[i * 3 + 2] = (Math.random() - 0.5) * 160;  // z 前后拉开
  const c = new THREE.Color().setHSL(Math.random(), 0.7, 0.7); // 随机彩色
  colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));

const stars = new THREE.Points(geo, new THREE.PointsMaterial({
  size: 0.4,
  vertexColors: true,   // 用上面 setAttribute('color') 的颜色
  transparent: true,
  opacity: 0.9
}));
scene.add(stars);

renderer.setAnimationLoop(() => {
  const pos = geo.attributes.position.array;
  // 让每颗星星朝镜头方向（+z）飞过来
  for (let i = 0; i < count; i++) {
    pos[i * 3 + 2] += 0.35;              // z 每帧加一点 = 向镜头靠近
    if (pos[i * 3 + 2] > 80) pos[i * 3 + 2] -= 160; // 飞过头就传送回远处
  }
  geo.attributes.position.needsUpdate = true;  // 关键！通知显卡数据变了
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
<\/script>
</body>
</html>
```

## 关键点拆解

::: plain 为什么用 Points 不用 3000 个 Mesh
如果建 3000 个小球队，显卡得画 3000 次，卡到飞起。而 `Points` 把 3000 个点**打包成一次绘制**，性能天差地别。这就是「粒子系统」的核心思想。
:::

::: plain position 数组怎么读懂
`positions` 是个扁平数组，第 0、1、2 三个数是第 1 颗星的 x/y/z，第 3、4、5 是第 2 颗的……所以第 `i` 颗星的 z 坐标是 `positions[i * 3 + 2]`。这是 Three.js 里最基础的「缓冲区」写法。
:::

::: warning 忘了 needsUpdate = 白的忙
改完 `position` 数组后**必须**写 `geo.attributes.position.needsUpdate = true`。否则你改的是内存里的数据，显卡不知道，画面纹丝不动。这是新手做粒子动画最常踩的坑。
:::

::: tip 改着玩
- `pos[i*3+2] += 0.35` 改大 → 飞得更快（比如 `1.2` 就是跃迁引擎）
- `size: 0.4` 改大 → 星星变大，像雪花
- 把 `+= 0.35` 换成 `+= (camera.position.z - pos[i*3+2]) * 0.01` → 星星越近飞越快，更真实
:::
</script>

<script type="text/markdown" data-id="case-04" data-title="案例 04 · 弹跳球与真实阴影" data-group="实战案例集">
# 案例 04：弹跳球与真实阴影

::: plain 效果长啥样
一颗红球从空中落下，**啪、啪、啪**越弹越低最后停下来，地上有一团**跟着球移动、随高度变化大小**的真实阴影。这是入门物理模拟的教科书案例。
:::

## 完整代码

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>弹跳球与真实阴影</title>
<style>body { margin: 0; overflow: hidden; }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
  }
}
<\/script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 4, 10);
camera.lookAt(0, 1, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;            // ① 总开关：打开阴影
renderer.shadowMap.type = THREE.PCFShadowMap; // r187 中 PCFSoftShadowMap 已移除，用这个
document.body.appendChild(renderer.domElement);

// 主角：球
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(0.8, 48, 32),
  new THREE.MeshStandardMaterial({ color: 0xff6b6b, roughness: 0.4 })
);
ball.castShadow = true;                       // ② 球要「投下」阴影
scene.add(ball);

// 地板：接住阴影
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(30, 30),
  new THREE.MeshStandardMaterial({ color: 0x2a2a40, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;              // 平面默认竖着，转 90° 躺平
floor.receiveShadow = true;                   // ③ 地板要「接收」阴影
scene.add(floor);

const grid = new THREE.GridHelper(30, 30, 0x444466, 0x333355);
grid.position.y = 0.01;                       // 抬高一点，避免和地板重叠闪烁
scene.add(grid);

// 灯：负责投影
const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(5, 10, 5);
light.castShadow = true;                      // ④ 灯要「能投影」
light.shadow.mapSize.set(2048, 2048);         // 阴影贴图分辨率，越高越清晰
// 框住阴影相机范围，超出这个盒子的地方不投影
light.shadow.camera.left = -10;
light.shadow.camera.right = 10;
light.shadow.camera.top = 10;
light.shadow.camera.bottom = -10;
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.4));

// 极简物理：高度、速度、重力、弹性
let h = 6;        // 球心当前高度
let v = 0;        // 当前速度
const G = -18;    // 重力加速度（负号 = 向下）
const BOUNCE = 0.82; // 弹性：撞地后保留 82% 的速度，越弹越低

let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05); // 时间差转秒；限幅防止卡顿后「穿模」
  last = now;

  v += G * dt;          // 速度 += 加速度 × 时间
  h += v * dt;          // 高度 += 速度 × 时间
  if (h < 0.8) {        // 球心低于半径 = 碰地了
    h = 0.8;            // 按回地面，别陷进去
    v = -v * BOUNCE;    // 速度反向并衰减 → 弹起来
  }
  ball.position.y = h;
  ball.rotation.x += dt * 2;
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
<\/script>
</body>
</html>
```

## 关键点拆解

::: plain 阴影的四把钥匙
想看到阴影，必须**同时**满足四个条件，少一个都是白忙：
1. 渲染器 `renderer.shadowMap.enabled = true`（总开关）
2. 投影物 `ball.castShadow = true`（谁投影）
3. 接收物 `floor.receiveShadow = true`（谁接影）
4. 灯 `light.castShadow = true`（谁产生影）
:::

::: warning r187 注意
老教程常写的 `THREE.PCFSoftShadowMap` 在 r187 **已经被移除**，写了会报错。用 `THREE.PCFShadowMap` 即可，想要更软的阴影可以调大 `shadow.mapSize` 或加 `shadow.radius`。
:::

::: plain 物理就三行公式
`v += G*dt` → `h += v*dt` → 碰地反弹 `v = -v * 弹性`。这就是中学物理的匀加速运动，只不过拆成每一帧算一小步。`dt` 是「这一帧过了多久」，用它而不是写死数值，才能让不同帧率的电脑看到**一样快**的动画。
:::

::: tip 改着玩
- `BOUNCE` 改成 `0.95` → 像超级弹球，弹很久才停
- `BOUNCE` 改成 `0.3` → 像橡皮泥，啪一下就趴下
- `G` 改成 `-3` → 月球重力，慢动作飘落
:::
</script>

<script type="text/markdown" data-id="case-05" data-title="案例 05 · 会起伏的波浪海面" data-group="实战案例集">
# 案例 05：会起伏的波浪海面

::: plain 效果长啥样
整片海面像真的一样**此起彼伏**，波浪一层推着一层，光照随着浪的起伏明暗变化，远处渐渐融进雾里。核心是逐帧修改网格的顶点——这就是「顶点动画」。
:::

## 完整代码

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>波浪海面</title>
<style>body { margin: 0; overflow: hidden; }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
  }
}
<\/script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a1a2a);
scene.fog = new THREE.Fog(0x0a1a2a, 12, 45);   // 远处融进背景

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 5, 14);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// 海面：一个被切成 80×80 小格的平面（格子越多波浪越细腻，但越吃性能）
const geo = new THREE.PlaneGeometry(60, 60, 80, 80);
geo.rotateX(-Math.PI / 2);   // 平面默认竖着，转成水平
const sea = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
  color: 0x2266aa, roughness: 0.35, metalness: 0.3,
  side: THREE.DoubleSide, flatShading: true  // flatShading 让浪有棱角感
}));
scene.add(sea);

scene.add(new THREE.HemisphereLight(0x88ccff, 0x001122, 1.5));
const sun = new THREE.DirectionalLight(0xffeedd, 2);
sun.position.set(10, 15, 5);
scene.add(sun);

const pos = geo.attributes.position;   // 顶点位置缓冲区

renderer.setAnimationLoop(() => {
  const t = performance.now() / 1000;
  // 遍历每一个顶点，用三组正弦波叠加算出它的高度
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const y = Math.sin(x * 0.5 + t * 2) * 0.4        // 沿 x 方向的浪
            + Math.sin(z * 0.8 + t * 1.3) * 0.3      // 沿 z 方向的浪
            + Math.sin((x + z) * 0.3 + t) * 0.5;     // 斜着的浪
    pos.setY(i, y);                                   // 更新这个顶点的高度
  }
  pos.needsUpdate = true;         // 通知显卡：顶点变了
  geo.computeVertexNormals();     // 重算法线 → 光照才能跟着浪变化
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
<\/script>
</body>
</html>
```

## 关键点拆解

::: plain 海面其实是「渔网」
`PlaneGeometry(60, 60, 80, 80)` 不是一张平滑的纸，而是被切成 80×80 格子的**渔网**，有 6561 个交点（顶点）。波浪动画就是**每帧把每个交点抬高或压低**，网就跟着起伏了。格子越密越细腻，但顶点太多会卡。
:::

::: plain 三组正弦波叠加
只用一组正弦波，浪会像规则的正弦曲线很假。这里叠加了三组**频率、方向、速度都不同**的波，加在一起就成了看似随机的自然海浪。这个技巧叫「波的叠加」，做水面、布料、旗帜都用它。
:::

::: warning 为什么必须重算法线
光照靠「法线」判断朝哪个方向受光。顶点被你抬高后，法线还是旧的，光照就贴图一样不跟着变——浪看着「平」。所以要 `computeVertexNormals()` 重新算一遍。**但**每帧重算全部法线比较费性能，大场景会改用着色器在 GPU 上算（见进阶篇）。
:::

::: tip 改着玩
- `flatShading: true` 改成 `false` → 海面变光滑，像丝绸
- 去掉 `+ Math.sin(z * 0.8...)` 那一行 → 只剩单向浪，像传送带
- 把 `roughness` 改成 `0.1`、`metalness` 改成 `0.8` → 变成镜面海水
:::
</script>

<script type="text/markdown" data-id="case-06" data-title="案例 06 · 迷你太阳系" data-group="实战案例集">
# 案例 06：迷你太阳系

::: plain 效果长啥样
中间一颗发光太阳，四颗不同颜色的行星各自沿着**看不见的轨道公转**，同时**自己还在自转**。鼠标可拖动视角。这一例的核心是 Three.js 里超重要的「父子层级」。
:::

## 完整代码

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>迷你太阳系</title>
<style>body { margin: 0; overflow: hidden; }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
  }
}
<\/script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05050a);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 18, 28);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// 太阳：用 Basic 材质（自己发光，不受光照影响）
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(2.5, 48, 32),
  new THREE.MeshBasicMaterial({ color: 0xffcc33 })
);
scene.add(sun);
// 点光源放在太阳中心，让行星有明暗面。第二参是强度，第三参是照射距离(0=无限)，第四是衰减
scene.add(new THREE.PointLight(0xffdd88, 300, 0, 2));

// 行星配置：半径、轨道距离、颜色、公转速度
const planets = [
  { r: 0.4, d: 4.5,  c: 0xaaaaaa, s: 1.6 },  // 水星：小、快
  { r: 0.7, d: 6.5,  c: 0xff8844, s: 1.1 },  // 金星
  { r: 0.8, d: 9,    c: 0x4488ff, s: 0.8 },  // 地球
  { r: 0.5, d: 12,   c: 0xcc7744, s: 0.6 }   // 火星：远、慢
];
const orbiters = [];

planets.forEach(p => {
  // 画一圈细细的轨道线（圆环躺平）
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(p.d - 0.02, p.d + 0.02, 128),
    new THREE.MeshBasicMaterial({ color: 0x444466, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  scene.add(ring);

  // 关键：造一个空的 Group 当「转轴」，放在太阳中心
  const pivot = new THREE.Group();
  scene.add(pivot);

  const planet = new THREE.Mesh(
    new THREE.SphereGeometry(p.r, 32, 16),
    new THREE.MeshStandardMaterial({ color: p.c, roughness: 0.8 })
  );
  planet.position.x = p.d;  // 行星挂在转轴「边上」
  pivot.add(planet);        // 加到转轴里，而不是直接加到 scene

  orbiters.push({ pivot, planet, speed: p.s });
});

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  orbiters.forEach(o => {
    o.pivot.rotation.y += dt * o.speed;   // 转「转轴」→ 行星绕太阳公转
    o.planet.rotation.y += dt * 3;        // 转「行星自己」→ 自转
  });
  sun.rotation.y += dt * 0.3;
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
<\/script>
</body>
</html>
```

## 关键点拆解

::: plain 转轴（pivot）是啥， why 不用三角函数
想让行星绕圈，新手常想到用 `x = cos(角度)×半径`、`z = sin(角度)×半径` 硬算。更聪明的办法是**造一个看不见的 Group 当转轴**：把行星放在转轴边上（离中心 `p.d`），然后**只转这个转轴**，行星就被带着画圆了——这就是父子层级，父级转动，子级跟着走。
:::

::: plain 公转和自转怎么分开
转**转轴**（`pivot.rotation.y`）→ 公转；转**行星自己**（`planet.rotation.y`）→ 自转。两个动作互不干扰，因为它们是不同的对象。这就是层级结构的威力：把「运动」分配到合适的层级上。
:::

::: tip 升级成真太阳系
- 给地球加个「月球」：把月球 `moon` 加到 `planet`（地球）里，而不是 pivot 里——月球就会一边绕地球转、一边跟着地球公转。层层嵌套，理论上有几层都行。
- 加土星环：`new THREE.RingGeometry(1.2, 2, 64)` 加到行星上，转个角度。
- 行星轨道做成椭圆：`planet.position.x = p.d; planet.position.z = p.d * 0.6;` 并给 pivot 加缩放。
:::
</script>

<script type="text/markdown" data-id="case-07" data-title="案例 07 · 键盘控制的小车" data-group="实战案例集">
# 案例 07：键盘控制的小车

::: plain 效果长啥样
一辆红白配色、带四个轮子的小车停在草地上。**按 W / ↑ 前进，S / ↓ 后退，A / ←、D / → 转向**，镜头会平滑地跟在车后面。一个小小的 third-person 驾驶游戏就这样成了。
:::

## 完整代码

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>键盘控制的小车</title>
<style>body { margin: 0; overflow: hidden; }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
  }
}
<\/script>
</head>
<body>
<div style="position:fixed;top:12px;left:12px;color:#fff;font:15px sans-serif;background:#0009;padding:8px 12px;border-radius:6px;pointer-events:none">
  W / ↑ 前进 · S / ↓ 后退 · A / ←、D / → 转向
</div>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 25, 70);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 9, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// 草地 + 网格路标
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x55aa55, roughness: 1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(200, 200, 0x336633, 0x66cc66);
grid.position.y = 0.02;
scene.add(grid);

// 小车 = 一个 Group，里面塞车身、车顶、四个轮子
const car = new THREE.Group();
const body = new THREE.Mesh(
  new THREE.BoxGeometry(2, 0.8, 3.5),
  new THREE.MeshStandardMaterial({ color: 0xff4444, roughness: 0.4 })
);
body.position.y = 0.9; body.castShadow = true;
car.add(body);

const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(1.6, 0.7, 1.8),
  new THREE.MeshStandardMaterial({ color: 0xdddddd })
);
cabin.position.set(0, 1.6, -0.3); cabin.castShadow = true;
car.add(cabin);

const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.3, 20);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
[[-1.1, 1.15], [1.1, 1.15], [-1.1, -1.15], [1.1, -1.15]].forEach(([x, z]) => {
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.position.set(x, 0.45, z);
  w.rotation.z = Math.PI / 2;   // 圆柱默认竖着，转成横躺当轮子
  car.add(w);
});
scene.add(car);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(10, 20, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
scene.add(sun);

// 键盘状态：按下记 true，松开记 false
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup',   e => { keys[e.code] = false; });

const SPEED = 12;                 // 前进速度
const camTarget = new THREE.Vector3();  // 相机想待的位置（复用，避免每帧 new）
let last = performance.now();

renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  // 转向
  if (keys['ArrowLeft']  || keys['KeyA']) car.rotation.y += 2 * dt;
  if (keys['ArrowRight'] || keys['KeyD']) car.rotation.y -= 2 * dt;

  // 前进方向 = 车头方向（车头默认朝 -z）
  const forward = new THREE.Vector3(-Math.sin(car.rotation.y), 0, -Math.cos(car.rotation.y));
  if (keys['ArrowUp']   || keys['KeyW']) car.position.addScaledVector(forward,  SPEED * dt);
  if (keys['ArrowDown'] || keys['KeyS']) car.position.addScaledVector(forward, -SPEED * dt);

  // 相机跟随：lerp 平滑插值，避免硬生生瞬移
  camTarget.set(car.position.x, 9, car.position.z + 14);
  camera.position.lerp(camTarget, 0.08);
  camera.lookAt(car.position.x, 1, car.position.z);

  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
<\/script>
</body>
</html>
```

## 关键点拆解

::: plain 键盘控制就一个「记账本」
`keys` 对象就是个小本本：`keydown` 时把对应键记成 `true`，`keyup` 记成 `false`。动画循环里只管**查这个本子**——哪个键是 true 就执行对应动作。这比在事件里直接移动物体更平滑，因为移动跟着帧走。
:::

::: plain 车头方向怎么算
车默认朝 `-z`，转了 `θ` 度后，车头方向就是 `(-sin θ, 0, -cos θ)`。用 `addScaledVector(方向, 距离)` 就能让车**朝自己车头**前进，而不是永远朝屏幕上方——所以转向后再前进，车会拐弯。
:::

::: plain lerp 是「温柔地追」
`camera.position.lerp(目标, 0.08)` 意思是「每帧朝目标挪 8%」。这样相机是**慢慢追上**车，而不是死死钉在固定偏移——画面有跟随感又不生硬。系数越小越「拖沓」，越大越「紧跟」。
:::

::: tip 改着玩
- `SPEED` 改大 → 飙车；改小 → 龟速
- 转向的 `2 * dt` 改成 `4 * dt` → 方向盘更灵敏
- 把车身的 `castShadow` 和地板的 `receiveShadow` 去掉一行 → 看阴影如何消失（复习案例 04）
:::
</script>

<script type="text/markdown" data-id="case-08" data-title="案例 08 · 点击让物体爆炸" data-group="实战案例集">
# 案例 08：点击让物体爆炸

::: plain 效果长啥样
屏幕中间一颗绿球慢慢转。**用鼠标点它一下——啪！**炸成 160 块彩色碎片向四面八方飞溅，受重力下落、边飞边翻滚，两三秒后自动重聚成原球，可以反复点。
:::

## 完整代码

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>点击爆炸</title>
<style>body { margin: 0; overflow: hidden; cursor: crosshair; }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
  }
}
<\/script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111122);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
camera.position.z = 8;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const light = new THREE.DirectionalLight(0xffffff, 2);
light.position.set(5, 5, 5);
scene.add(light);

// 目标球
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(1.5, 48, 32),
  new THREE.MeshStandardMaterial({ color: 0x42b883, roughness: 0.4 })
);
scene.add(ball);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0x222233 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -3;
scene.add(ground);

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const fragments = [];   // 当前活着的碎片

// 点击 → 发射射线 → 看有没有打中球
addEventListener('pointerdown', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;    // 屏幕坐标 → -1~1
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;  // y 轴要反过来
  raycaster.setFromCamera(mouse, camera);
  if (raycaster.intersectObject(ball).length > 0) explode();
});

function explode(){
  ball.visible = false;
  const geo = new THREE.BoxGeometry(0.22, 0.22, 0.22);  // 碎片共用同一几何体
  for (let i = 0; i < 160; i++) {
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color().setHSL(Math.random(), 0.8, 0.6)
    });
    const f = new THREE.Mesh(geo, mat);
    // 从球附近随机位置起步
    f.position.set(
      ball.position.x + (Math.random() - 0.5) * 2,
      ball.position.y + (Math.random() - 0.5) * 2,
      ball.position.z + (Math.random() - 0.5) * 2
    );
    scene.add(f);
    fragments.push({
      mesh: f,
      vel: new THREE.Vector3(
        (Math.random() - 0.5) * 2,
        (Math.random() - 0.5) * 2 + 1.5,  // 略微偏上，炸得更漂亮
        (Math.random() - 0.5) * 2
      ).multiplyScalar(5),
      life: 2.2
    });
  }
  setTimeout(reset, 2600);
}

function reset(){
  fragments.forEach(f => {
    scene.remove(f.mesh);
    f.mesh.material.dispose();   // 材质是每块独立的，必须释放
  });
  fragments.length = 0;
  ball.visible = true;
}

let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  ball.rotation.y += dt * 0.6;

  for (let i = fragments.length - 1; i >= 0; i--) {
    const f = fragments[i];
    f.vel.y -= 9.8 * dt;                          // 重力
    f.mesh.position.addScaledVector(f.vel, dt);   // 按速度移动
    f.mesh.rotation.x += dt * 5;                  // 边飞边翻滚
    f.mesh.rotation.y += dt * 3;
    f.life -= dt;
    if (f.life <= 0) {
      scene.remove(f.mesh);
      f.mesh.material.dispose();
      fragments.splice(i, 1);
    }
  }
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
<\/script>
</body>
</html>
```

## 关键点拆解

::: plain 射线拾取三板斧
「鼠标点到 3D 物体了吗」靠 `Raycaster`（射线检测器）：
1. 把鼠标屏幕坐标换成 **-1~1** 的标准坐标（注意 y 要取反）
2. `raycaster.setFromCamera(鼠标, 相机)` —— 从相机穿过鼠标点射出一条射线
3. `raycaster.intersectObject(球)` —— 返回射线打中的物体列表，**有东西就是点中了**
:::

::: plain 爆炸 = 一堆带速度的小球
「爆炸」没有魔法，就是生成 160 个小方块，每个给一个**随机的三维速度**（`vel`），然后每帧 `位置 += 速度 × dt`，再让 `速度.y -= 重力 × dt` 慢慢往下掉。加上随机旋转，就有炸裂翻滚的感觉了。
:::

::: warning 碎片用完要 dispose
`scene.remove()` 只是把物体从画面拿掉，**不会释放显存**。材质是每块碎片独立创建的，必须 `material.dispose()`。几何体是共享的（160 块共用一个 `geo`），所以只释放一次即可——这正是共享几何体的好处。这是 Three.js 内存管理的铁律。
:::

::: tip 改着玩
- `160` 改成 `500` → 更壮观的碎裂（但更吃性能）
- 速度的 `multiplyScalar(5)` 改成 `10` → 炸得更猛
- 把 `BoxGeometry` 换成 `TetrahedronGeometry(0.25)` → 尖锐的三角碎片
:::
</script>

<script type="text/markdown" data-id="case-09" data-title="案例 09 · 霓虹发光城市" data-group="实战案例集">
# 案例 09：霓虹发光城市

::: plain 效果长啥样
夜色中一片由**几百栋彩色高楼**组成的城市，楼体发出霓虹般的辉光，边缘晕开一层柔光，镜头绕着城市缓缓旋转。这是「后期处理泛光（Bloom）」的经典效果——赛博朋克风一键get。
:::

## 完整代码

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>霓虹发光城市</title>
<style>body { margin: 0; overflow: hidden; }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
  }
}
<\/script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 300);
camera.position.set(30, 25, 30);
camera.lookAt(0, 5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// 用 InstancedMesh 一次画出 400 栋楼（比建 400 个 Mesh 快得多）
const COUNT = 400;
const geo = new THREE.BoxGeometry(1, 1, 1);
const mat = new THREE.MeshBasicMaterial();  // Basic：颜色不受光照影响，更鲜艳
const city = new THREE.InstancedMesh(geo, mat, COUNT);
const dummy = new THREE.Object3D();          // 临时对象，专门用来算矩阵
const COLORS = [0x00ffff, 0xff00ff, 0x42b883, 0xffaa00, 0x4488ff, 0xff3366];

for (let i = 0; i < COUNT; i++) {
  const x = (Math.random() - 0.5) * 70;
  const z = (Math.random() - 0.5) * 70;
  const h = 2 + Math.random() * 22;              // 楼高 2~24
  dummy.position.set(x, h / 2, z);
  dummy.scale.set(1 + Math.random(), h, 1 + Math.random());
  dummy.updateMatrix();                          // 把位置/缩放烘焙成矩阵
  city.setMatrixAt(i, dummy.matrix);             // 写入第 i 栋楼的变换
  city.setColorAt(i, new THREE.Color(COLORS[i % COLORS.length]));
}
scene.add(city);

// 后期处理流水线：先把场景画出来，再叠泛光
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));          // ① 常规渲染
const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.4,    // strength：泛光强度
  0.5,    // radius：光晕扩散半径
  0.15    // threshold：亮度阈值，超过它才发光
);
composer.addPass(bloom);                                  // ② 加泛光

renderer.setAnimationLoop(() => {
  const t = performance.now() / 5000;
  camera.position.x = Math.sin(t) * 45;
  camera.position.z = Math.cos(t) * 45;
  camera.lookAt(0, 4, 0);
  composer.render();   // 注意：用 composer.render()，不是 renderer.render()
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);  // 后期处理也要跟着改尺寸
});
<\/script>
</body>
</html>
```

## 关键点拆解

::: plain InstancedMesh 是「批量复印机」
要画 400 栋楼，傻办法是 new 400 个 Mesh（显卡要提交 400 次）。`InstancedMesh` 是**一次提交画 400 份**，每份用 `setMatrixAt(i, 矩阵)` 指定各自的位置/缩放，用 `setColorAt(i, 颜色)` 指定颜色。那个临时 `dummy` 对象就是「模板」，改好它的位置缩放，`updateMatrix()` 烘焙成矩阵再写进去。几百上千个重复物体，全靠它。
:::

::: plain 泛光（Bloom）是什么
后期处理就是「画面画完后再加工一遍」。`EffectComposer` 是一条加工流水线：`RenderPass` 先把场景正常画出来，`UnrealBloomPass` 再找出画面里**足够亮的像素**，把光晕糊到周围——霓虹灯、发光招牌的晕开效果就是这么来的。
:::

::: warning 两个必改点
1. 加了 composer 后，动画里要写 `composer.render()`，**不能**再写 `renderer.render()`，否则泛光不生效。
2. 窗口变化时 `composer.setSize()` 也要调用，不然画面会被拉伸变形。
:::

::: tip 调出不同氛围
- `strength` 调到 `2.5` → 梦幻光污染；调到 `0.4` → 克制内敛
- `threshold` 调到 `0` → 所有东西都发光（很炸）；调到 `0.8` → 只有最亮的发光
- 把 `MeshBasicMaterial` 换成 `MeshStandardMaterial` 并加灯 → 楼有明暗立体感，但要调高 threshold 才发光
:::
</script>

<script type="text/markdown" data-id="case-10" data-title="案例 10 · 脉冲万花筒" data-group="实战案例集">
# 案例 10：脉冲万花筒

::: plain 效果长啥样
4096 个小方块排成一个空心立方阵，每个方块**按到中心的距离**渐变染色，整团东西像心跳一样**一呼一吸地膨胀收缩**，同时缓慢旋转，颜色持续流动。视觉冲击力很强，代码却不难。
:::

## 完整代码

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>脉冲万花筒</title>
<style>body { margin: 0; overflow: hidden; }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
  }
}
<\/script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080812);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);
camera.position.set(24, 20, 24);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const N = 16;                       // 每条边 16 格 → 16³ = 4096 个小方块
const GAP = 1.3;                    // 格子间距
const COUNT = N * N * N;
const geo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
const mesh = new THREE.InstancedMesh(geo, new THREE.MeshBasicMaterial(), COUNT);
const dummy = new THREE.Object3D();
const color = new THREE.Color();

// 预先算好每个方块的原始坐标和到中心的距离
const cells = [];
let idx = 0;
for (let x = 0; x < N; x++) {
  for (let y = 0; y < N; y++) {
    for (let z = 0; z < N; z++) {
      const px = (x - N / 2) * GAP;
      const py = (y - N / 2) * GAP;
      const pz = (z - N / 2) * GAP;
      const dist = Math.sqrt(px * px + py * py + pz * pz);
      cells.push({ x: px, y: py, z: pz, dist });
      color.setHSL((dist / 35 + 0.5) % 1, 0.85, 0.6);  // 按距离染色
      mesh.setColorAt(idx++, color);
    }
  }
}
scene.add(mesh);

renderer.setAnimationLoop(() => {
  const t = performance.now() / 1000;
  let i = 0;
  for (const c of cells) {
    // 波从中心向外扩散：sin(距离 × 频率 - 时间 × 速度)
    const wave = Math.sin(c.dist * 0.55 - t * 3) * 0.28;
    const scale = 1 + wave;
    dummy.position.set(c.x * scale, c.y * scale, c.z * scale);
    dummy.rotation.set(t * 0.2, t * 0.25, 0);
    dummy.updateMatrix();
    mesh.setMatrixAt(i++, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;  // 通知显卡矩阵变了
  mesh.rotation.y += 0.003;
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
<\/script>
</body>
</html>
```

## 关键点拆解

::: plain 4096 个方块为什么能流畅
还是 `InstancedMesh` 的功劳：一次绘制调用画 4096 份。每帧我们只更新一个 16 位浮点矩阵缓冲区（`instanceMatrix`），显卡照着它摆放所有方块。要是建 4096 个独立 Mesh，光是遍历更新就得卡爆。
:::

::: plain 「波」的公式再看一眼
`sin(距离 × 0.55 - 时间 × 3)`：减号意味着波**从中心向外传播**（若是加号则向内收）。距离越远的点，同一时刻处在波的不同相位，于是就出现一圈圈向外扩散的涟漪——和水面投石子的道理一样（复习案例 05）。
:::

::: tip 改着玩
- `t * 3` 改成 `t * 8` → 脉冲传播飞快
- `0.28` 改成 `0.5` → 呼吸幅度更夸张
- 把 `MeshBasicMaterial()` 换成 `new THREE.MeshBasicMaterial({ wireframe: true })` → 变成科幻线框风
:::
</script>

<script type="text/markdown" data-id="case-11" data-title="案例 11 · 烟花秀" data-group="实战案例集">
# 案例 11：烟花秀

::: plain 效果长啥样
黑夜里一朵朵彩色烟花**自动升空炸开**，无数亮点四散飞溅、受重力缓缓下落、渐渐熄灭。用鼠标点画面任意位置，还能在那儿**手动放一朵**。这是粒子系统的集大成案例。
:::

## 完整代码

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>烟花秀</title>
<style>body { margin: 0; overflow: hidden; cursor: crosshair; }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
  }
}
<\/script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 0, 90);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// 一个 Points 装下所有烟花的粒子（最多 3000 颗）
const MAX = 3000;
const positions = new Float32Array(MAX * 3);
const colors = new Float32Array(MAX * 3);
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
const points = new THREE.Points(geo, new THREE.PointsMaterial({
  size: 1.1,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,  // 叠加混合 → 粒子重叠处更亮
  depthWrite: false
}));
scene.add(points);

let active = 0;                       // 当前用到的粒子数
const vels = Array.from({ length: MAX }, () => new THREE.Vector3());
const lifes = new Float32Array(MAX);

// 在 (ox,oy,oz) 放一朵烟花：生成 120 个朝四面八方飞的粒子
function launch(ox, oy, oz) {
  const color = new THREE.Color().setHSL(Math.random(), 1, 0.65);
  for (let k = 0; k < 120 && active < MAX; k++) {
    const i = active++;
    positions[i*3] = ox; positions[i*3+1] = oy; positions[i*3+2] = oz;
    colors[i*3] = color.r; colors[i*3+1] = color.g; colors[i*3+2] = color.b;
    // 球面均匀随机方向 × 随机速度
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const speed = 18 + Math.random() * 22;
    vels[i].set(
      Math.sin(phi) * Math.cos(theta) * speed,
      Math.sin(phi) * Math.sin(theta) * speed,
      Math.cos(phi) * speed
    );
    lifes[i] = 1.4 + Math.random();
  }
}

let last = performance.now();
let nextLaunch = 0;
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  const t = now / 1000;

  if (t > nextLaunch) {              // 每隔约 1.3 秒自动放一朵
    launch((Math.random() - 0.5) * 70, 8 + Math.random() * 22, 0);
    nextLaunch = t + 1.3;
  }

  for (let i = 0; i < active; i++) {
    positions[i*3]   += vels[i].x * dt;
    positions[i*3+1] += vels[i].y * dt;
    positions[i*3+2] += vels[i].z * dt;
    vels[i].y -= 8 * dt;             // 重力：慢慢往下掉
    vels[i].multiplyScalar(0.985);   // 空气阻力：越来越慢
    lifes[i] -= dt;

    // 寿命耗尽：把「最后一个粒子」搬到当前位置补空位，再删掉末尾（O(1) 删除）
    if (lifes[i] <= 0) {
      const j = --active;
      if (j !== i) {
        positions[i*3] = positions[j*3];
        positions[i*3+1] = positions[j*3+1];
        positions[i*3+2] = positions[j*3+2];
        colors[i*3] = colors[j*3];
        colors[i*3+1] = colors[j*3+1];
        colors[i*3+2] = colors[j*3+2];
        vels[i].copy(vels[j]);
        lifes[i] = lifes[j];
      }
      i--;
    }
  }
  geo.setDrawRange(0, active);       // 只画前 active 个粒子
  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate = true;
  renderer.render(scene, camera);
});

// 点击哪儿就在哪儿放一朵
addEventListener('pointerdown', e => {
  const x = (e.clientX / innerWidth - 0.5) * 90;
  const y = -(e.clientY / innerHeight - 0.5) * 55;
  launch(x, y, 0);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
<\/script>
</body>
</html>
```

## 关键点拆解

::: plain 球面均匀随机方向
想让烟花炸成**球状**而不是一团扁的，方向要均匀分布在球面上。技巧是 `theta = 随机×2π`、`phi = acos(2×随机-1)`，再用球坐标转直角坐标。这是图形学里生成均匀球面方向的标准公式，记住能用一辈子。
:::

::: plain 粒子「池」与 O(1) 删除
我们不反复创建/销毁粒子，而是开一个大数组（容量 3000）当**粒子池**，用 `active` 记录用到哪。粒子死了怎么删？直接 `splice` 会挪动后面所有元素（慢）。这里用**交换删除**：把最后一个粒子搬到死掉的位置，然后 `active--`——一步到位，性能友好。这是游戏开发的常用优化。
:::

::: plain 为什么用 AdditiveBlending
`AdditiveBlending`（叠加混合）让粒子颜色**相加**，多颗粒子重叠的地方就越叠越亮，接近白色——这正好模拟了烟花/火焰的高光核心。配上 `depthWrite: false` 避免粒子互相遮挡产生的方块边缘。
:::

::: tip 改着玩
- `120` 改成 `300` → 一朵烟花更饱满（注意 MAX 上限）
- `lifes` 的 `1.4 + 随机` 改大 → 烟花在天上停留更久
- 把 `vels[i].y -= 8 * dt` 改小（如 `2`）→ 失重感，像在太空放烟花
:::
</script>

<script type="text/markdown" data-id="case-12" data-title="案例 12 · 水晶球折射" data-group="实战案例集">
# 案例 12：水晶球折射

::: plain 效果长啥样
一颗通透的**玻璃水晶球**悬在中央，背后几颗彩色小球绕着它转。透过水晶球看那些球，画面被**扭曲、放大、折射**——像真的握着一颗玻璃珠。这是 PBR 材质里 `transmission`（透射）的威力。
:::

## 完整代码

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>水晶球折射</title>
<style>body { margin: 0; overflow: hidden; }</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
  }
}
<\/script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101018);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 0, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;  // 电影级色调映射，玻璃更通透
document.body.appendChild(renderer.domElement);

// 用内置的「房间环境」生成环境贴图 —— 不用下载任何 HDR 文件！
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// 主角：水晶球
const ball = new THREE.Mesh(
  new THREE.SphereGeometry(1.7, 64, 64),
  new THREE.MeshPhysicalMaterial({
    color: 0xffffff,
    metalness: 0,
    roughness: 0.05,
    transmission: 1,       // 透光度：1 = 像玻璃一样完全透光
    thickness: 1.6,        // 厚度：越大折射弯曲越明显
    ior: 1.5,              // 折射率：水 1.33、玻璃 1.5、钻石 2.4
    clearcoat: 1,          // 表面清漆层，增加高光
    clearcoatRoughness: 0.1
  })
);
scene.add(ball);

// 球后面绕圈的小球：透过水晶球看它们会被折射扭曲
const orbiters = [];
const COLORS = [0xff4488, 0x44aaff, 0xffcc44, 0x44ffaa];
COLORS.forEach((c, i) => {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 32, 32),
    new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: 0.4 })
  );
  m.position.set(Math.cos(i / 4 * Math.PI * 2) * 2.6, Math.sin(i / 4 * Math.PI * 2) * 1.8, -1.5);
  scene.add(m);
  orbiters.push({ mesh: m, offset: i / 4 * Math.PI * 2 });
});

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

renderer.setAnimationLoop(() => {
  const t = performance.now() / 1000;
  orbiters.forEach(o => {
    const a = o.offset + t * 0.6;
    o.mesh.position.set(Math.cos(a) * 2.6, Math.sin(a) * 1.8, -1.5);
  });
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
<\/script>
</body>
</html>
```

## 关键点拆解

::: plain transmission 是「真透明」
普通的 `transparent + opacity` 只是把物体变半透，不会折射背后的东西。而 `MeshPhysicalMaterial` 的 `transmission: 1` 是**物理级透射**：渲染器会把球背后的画面抓下来，按 `ior` 折射率弯曲后再贴回来——所以透过球看后面的小球是**扭曲变形**的，这才是真玻璃。
:::

::: plain 为什么要 scene.environment
玻璃需要「反射周围环境」才有质感。`scene.environment` 给整个场景一张环境贴图，玻璃材质就会反射它。`RoomEnvironment` 是 Three.js **内置的一个虚拟房间**，用 `PMREMGenerator` 转成可用格式即可——完全不用去下载 HDR 文件，离线也能跑。
:::

::: plain ior 折射率怎么记
`ior`（Index of Refraction）决定光线弯曲程度：水 `1.33`、玻璃 `1.5`、钻石 `2.4`。值越大，透过物体看到的画面扭曲越夸张。`thickness` 则控制「光在玻璃里走了多远」，越大弯曲累积越明显。两个配合调，能做出从气泡到钻石的各种效果。
:::

::: tip 改着玩
- `ior` 改成 `2.4` → 钻石感，扭曲强烈
- `roughness` 改成 `0.3` → 磨砂玻璃，背后模糊
- `color` 改成 `0x88ccff` → 蓝色水晶球
- `transmission` 改成 `0.5` → 半透光，介于玻璃和塑料之间
:::

::: warning 性能提示
透射材质渲染开销较大（每帧要额外渲染一遍背景），手机上谨慎用在大面积物体上。想要轻量替代，可以用 `MeshPhysicalMaterial` 配 `opacity + transparent` 假装透明，但没有真实折射。
:::
</script>

<script type="text/markdown" data-id="vue3-start" data-title="Vue3-00 · 怎么用这些案例" data-group="Vue3 集成案例">
# Vue3 + Three.js 集成说明

::: plain 这一册解决什么问题
前面 12 个案例是「纯 Three.js」——一个 HTML 文件搞定。但真实项目里，你多半会用 Vue3 搭界面：**控制面板、按钮、表单、路由全交给 Vue，3D 画面交给 Three.js**。这一册就讲这两位怎么搭伙干活，以及怎么才能不踩坑。
:::

## 先准备环境

需要一个 Vue3 项目（Vite 脚手架），Three.js 用 npm 安装：

```bash
npm create vue@latest my-three-app
cd my-three-app
npm install
npm install three
npm run dev
```

之后每个案例的代码，复制进 `src/components/xxx.vue` 就能用。案例里标了额外依赖的（Pinia、vue-router），按需 `npm install pinia` / `npm install vue-router`。

::: tip 为什么不用 CDN
前面纯 JS 案例能一个 HTML 跑通，是因为脚本直接引 CDN。Vue3 的真正威力在 **SFC 单文件组件**（`<template>` + `<script setup>` + `<style scoped>`），这需要 Vite 编译。既然都用 Vue3 了，建议直接建项目，别在 CDN 版里绕。
:::

## 三条铁律（踩坑预警）

::: warning 铁律 1：Three.js 对象绝不能塞进 reactive
Vue 的 `reactive()` 会把对象套一层 **Proxy 代理**。而 Three.js 内部大量用 `instanceof`、`===` 判断和闭包缓存，被代理后会**莫名其妙失效、内存暴涨、性能崩盘**。正确做法：用 `shallowRef()` 或 `markRaw()` 包住 Three.js 对象。这是 Vue3 + Three.js 的头号大坑，案例 09 专门讲。
:::

::: warning 铁律 2：onMounted 里初始化，onUnmounted 里清理
`ref` 指向的 `<div>` 要等组件挂载后 DOM 才存在，所以初始化必须放 `onMounted`。同理，组件销毁时**必须**停掉渲染循环、移除事件监听、`dispose()` 几何体/材质/渲染器——否则路由一切走，显存蹭蹭涨，页面越用越卡。
:::

::: plain 铁律 3：Vue 管 UI，Three.js 管画面，中间靠 watch 传话
别指望用 Vue 直接控制每一帧（响应式更新太慢，扛不住 60fps）。正确分工是：**Vue 的响应式变量只存「配置」**（颜色、速度、开关），用 `watch` 监听变化后去改 Three.js 对象；3D 那边的渲染循环独立跑。两条线各司其职，互不拖累。
:::

## 案例清单

| 案例 | 主题 | 练到的 Vue3 API |
|---|---|---|
| 01 | 组件里的第一个场景 | `ref` / `onMounted` / `onUnmounted` |
| 02 | 滑杆控制面板 | `watch` / `shallowRef` |
| 03 | 组件化拆分 | `props` / `emit` / `provide`+`inject` |
| 04 | 复用渲染循环 | composable `useThree` |
| 05 | 点击拾取联动 UI | `Raycaster` / `emit` |
| 06 | Pinia 状态管理 | `defineStore` |
| 07 | GLTF 加载 + 进度条 | `GLTFLoader` / `ref` |
| 08 | 路由切换与清理 | `vue-router` / `dispose` |
| 09 | 响应式避坑专章 | `markRaw` / `toRaw` |
| 10 | 完整实战：3D 产品配置器 | 综合运用 |

::: plain 建议顺序
先做 01、02 把「生命周期 + watch 桥接」这套手感建立起来，这是所有案例的地基。然后 03~08 按需挑。09 是避坑必读。10 把前面全串起来，做完就是一个能写进简历的小项目。
:::
</script>

<script type="text/markdown" data-id="vue3-01" data-title="Vue3-01 · 组件里的第一个 3D 场景" data-group="Vue3 集成案例">
# Vue3-01：组件里的第一个 3D 场景

::: plain 效果长啥样
一个 Vue3 组件，页面上是 `400px` 高的画布区域，里面一个彩色立方体不停旋转。麻雀虽小，但**初始化、动画、清理**三件事一件不少——这是后面所有案例的模板。
:::

## 完整代码（`src/components/MyScene.vue`）

```vue
<template>
  <!-- ref 拿到这个 div，Three.js 的 canvas 会被塞进来 -->
  <div ref="container" class="canvas-box"></div>
</template>

<script setup>
import { ref, shallowRef, onMounted, onUnmounted } from 'vue'
import * as THREE from 'three'

const container = ref(null)        // 模板里的 div
const renderer = shallowRef(null)  // Three.js 对象：用 shallowRef，不用 ref！

let scene, camera, cube, startTime

onMounted(() => {
  const w = container.value.clientWidth
  const h = container.value.clientHeight

  // 1. 场景 + 相机
  scene = new THREE.Scene()
  scene.background = new THREE.Color(0x1a1a2e)
  camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 100)
  camera.position.z = 4

  // 2. 渲染器（注意是 renderer.value —— shallowRef 要解包）
  renderer.value = new THREE.WebGLRenderer({ antialias: true })
  renderer.value.setSize(w, h)
  container.value.appendChild(renderer.value.domElement)

  // 3. 一个会变色的立方体
  cube = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 1.6, 1.6),
    new THREE.MeshNormalMaterial()
  )
  scene.add(cube)

  // 4. 渲染循环：回调参数 time 是毫秒时间戳
  startTime = performance.now()
  renderer.value.setAnimationLoop((time) => {
    const t = (time - startTime) / 1000   // 转成从启动算起的秒数
    cube.rotation.x = t * 0.6
    cube.rotation.y = t * 0.9
    renderer.value.render(scene, camera)
  })

  window.addEventListener('resize', onResize)
})

function onResize() {
  const w = container.value.clientWidth
  const h = container.value.clientHeight
  camera.aspect = w / h
  camera.updateProjectionMatrix()
  renderer.value.setSize(w, h)
}

onUnmounted(() => {
  // ⚠️ 清理四件套，一个都不能少
  renderer.value.setAnimationLoop(null)          // ① 停渲染循环
  window.removeEventListener('resize', onResize) // ② 移除监听
  scene.traverse(obj => {                         // ③ 释放几何体和材质
    obj.geometry?.dispose()
    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose())
    else obj.material?.dispose()
  })
  renderer.value.dispose()                       // ④ 释放渲染器
  renderer.value.domElement.remove()             //    把 canvas 从 DOM 摘掉
})
<\/script>

<style scoped>
.canvas-box { width: 100%; height: 400px; }
/* scoped 样式默认穿透不到 Three.js 动态插入的 canvas，用 :deep() */
.canvas-box :deep(canvas) { display: block; }
</style>
```

## 关键点拆解

::: plain 为什么在 onMounted 里初始化
`const container = ref(null)` 刚开始是 `null`，只有组件**挂载完成**后，`container.value` 才指向真实的 `<div>`。在那之前访问 `container.value.clientWidth` 会直接报错。所以凡是碰 DOM 的初始化，统统放 `onMounted`。
:::

::: plain 为什么用 shallowRef 而不是 ref
`ref()` 会把对象也变成响应式代理（内部调 `reactive()`）——这正是 Three.js 最怕的。`shallowRef()` 只跟踪「整个对象被替换」，**不代理对象内部**，Three.js 对象放进去安然无恙。代价是改内部属性要让 Vue 知道时得手动 `triggerRef()`，但 3D 渲染本来就不靠 Vue 驱动，正合适。
:::

::: warning 清理不是可选项
`onUnmounted` 里那四步漏掉任何一步，路由切走后都会留下后果：不停渲染（Case 白跑）、resize 监听泄漏（内存涨）、显存不释放（GPU 爆）、canvas 残留在 DOM（界面错乱）。养成习惯：**初始化时写了什么，销毁时就反着拆什么**。
:::

::: tip 小改进
- 把 `MeshNormalMaterial` 换成 `new THREE.MeshStandardMaterial({ color: 0x42b883 })`，再加一盏 `DirectionalLight`，就有真实光照了。
- 用 `ResizeObserver` 替代 `window.resize`，能监听容器本身尺寸变化（比如侧边栏收起），更精准。
:::
</script>

<script type="text/markdown" data-id="vue3-02" data-title="Vue3-02 · 滑杆控制面板联动 3D" data-group="Vue3 集成案例">
# Vue3-02：滑杆控制面板联动 3D

::: plain 效果长啥样
上面一排 Vue 写的控件（滑杆调转速、颜色选择器调颜色、复选框切线框），下面是一个 Three.js 立方体。**拖滑杆转速立刻变、选颜色立方体立刻变色**——这就是 Vue 响应式和 Three.js 之间的「桥」。
:::

## 完整代码（`src/components/ControlPanel.vue`）

```vue
<template>
  <div class="wrap">
    <div class="panel">
      <label>转速
        <input type="range" v-model.number="speed" min="0" max="4" step="0.1">
        <b>{{ speed.toFixed(1) }}</b>
      </label>
      <label>颜色 <input type="color" v-model="color"></label>
      <label><input type="checkbox" v-model="wireframe"> 线框模式</label>
    </div>
    <div ref="container" class="canvas-box"></div>
  </div>
</template>

<script setup>
import { ref, shallowRef, watch, onMounted, onUnmounted } from 'vue'
import * as THREE from 'three'

// —— Vue 这边：只管「配置」——
const speed = ref(1)
const color = ref('#42b883')
const wireframe = ref(false)

// —— Three.js 这边——
const container = ref(null)
const material = shallowRef(null)
let scene, camera, renderer, cube, startTime, angle = 0, lastTime = 0

onMounted(() => {
  const w = container.value.clientWidth, h = container.value.clientHeight
  scene = new THREE.Scene()
  scene.background = new THREE.Color(0x101018)
  camera = new THREE.PerspectiveCamera(60, w / h, 0.1, 100)
  camera.position.z = 4

  // 材质存进 shallowRef，供 watch 修改
  material.value = new THREE.MeshStandardMaterial({
    color: color.value, wireframe: wireframe.value
  })
  cube = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.8, 1.8), material.value)
  scene.add(cube)
  scene.add(new THREE.AmbientLight(0xffffff, 0.6))
  const light = new THREE.DirectionalLight(0xffffff, 2)
  light.position.set(3, 5, 4)
  scene.add(light)

  renderer = new THREE.WebGLRenderer({ antialias: true })
  renderer.setSize(w, h)
  container.value.appendChild(renderer.domElement)

  renderer.setAnimationLoop((time) => {
    const dt = Math.min((time - lastTime) / 1000, 0.05)  // 帧间隔，限幅
    lastTime = time
    angle += dt * speed.value      // 每帧直接读 speed.value
    cube.rotation.y = angle
    renderer.render(scene, camera)
  })
  window.addEventListener('resize', onResize)
})

// —— 桥：Vue 变量变了 → 改 Three.js 对象——
watch(color, v => material.value?.color.set(v))
watch(wireframe, v => { if (material.value) material.value.wireframe = v })
// speed 不用 watch：渲染循环每帧读 speed.value 即可，更省

function onResize() {
  const w = container.value.clientWidth, h = container.value.clientHeight
  camera.aspect = w / h
  camera.updateProjectionMatrix()
  renderer.setSize(w, h)
}

onUnmounted(() => {
  renderer.setAnimationLoop(null)
  window.removeEventListener('resize', onResize)
  scene.traverse(o => {
    o.geometry?.dispose()
    if (Array.isArray(o.material)) o.material.forEach(m => m.dispose())
    else o.material?.dispose()
  })
  renderer.dispose()
  renderer.domElement.remove()
})
<\/script>

<style scoped>
.wrap { max-width: 700px; }
.panel { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 12px; font: 14px sans-serif; }
.panel label { display: flex; align-items: center; gap: 6px; }
.canvas-box { width: 100%; height: 400px; }
.canvas-box :deep(canvas) { display: block; }
</style>
```

## 关键点拆解

::: plain 两类参数，两种处理方式
这是全册最重要的设计思想：
- **连续变化的参数**（转速、位置）：渲染循环每帧直接读 `speed.value`。因为它本来就要每帧更新，读一个 ref 的值几乎零成本。
- **偶尔改一次的参数**（颜色、线框、材质类型）：用 `watch` 监听，变了才去改 Three.js 对象。因为每帧无脑重设颜色是浪费。

分清这两类，你的 Vue3 + Three.js 应用就不会卡。
:::

::: plain 为什么改颜色要 color.set(v) 而不是直接赋值
`material.color` 是一个 `THREE.Color` 对象，不能直接 `material.color = '#ff0000'`（那样会把 Color 对象替换成字符串，Three.js 就懵了）。要调它的 `.set()` 方法把新颜色「灌」进去。`watch` 拿到的 `v` 是 `v-model` 绑定的字符串比如 `#42b883`，`Color.set()` 正好认识这种格式。
:::

::: plain 用累加角度代替直接设 rotation
`angle += dt * speed.value` 然后 `cube.rotation.y = angle`：这样**改速度不会跳变**。如果写成 `cube.rotation.y = time * speed.value`，一拖滑杆速度突变，角度会瞬间跳到另一个值，画面「闪一下」。累加的方式则平滑过渡。
:::

::: tip 继续加控件
照这个模式，想加什么控件都行：
- 缩放：`watch(scale, v => cube.scale.setScalar(v))`
- 显示/隐藏：`watch(visible, v => cube.visible = v)`
- 金属度：`watch(metalness, v => material.value.metalness = v)`
:::
</script>

<script type="text/markdown" data-id="vue3-03" data-title="Vue3-03 · 组件化拆分与 provide/inject" data-group="Vue3 集成案例">
# Vue3-03：组件化拆分与 provide/inject

::: plain 效果长啥样
场景容器和场景里的物体**分成两个组件**：`SceneCanvas.vue` 负责搭台（场景/相机/渲染器），`SpinningBox.vue` 负责唱戏（一个会转、能点、能换色的立方体）。点立方体会触发事件，父组件收到后在页面上显示「你点了立方体」。
:::

## 文件 1：`src/components/SceneCanvas.vue`（父·搭台）

```vue
<template>
  <div>
    <div ref="container" class="canvas-box">
      <SpinningBox :color="boxColor" @picked="onPicked" />
    </div>
    <p class="log">{{ log }}</p>
  </div>
</template>

<script setup>
import { ref, shallowRef, provide, onMounted, onUnmounted } from 'vue'
import * as THREE from 'three'
import SpinningBox from './SpinningBox.vue'

const container = ref(null)
const boxColor = ref('#42b883')
const log = ref('点一下立方体试试')

// 三个核心对象用 shallowRef 装进「上下文」，传给子孙组件
const scene = shallowRef(null)
const camera = shallowRef(null)
const renderer = shallowRef(null)
const frameCallbacks = []                          // 收集「每帧要做的事」
const onFrame = fn => frameCallbacks.push(fn)
provide('threeCtx', { scene, camera, renderer, onFrame })  // 关键：provide

onMounted(() => {
  const w = container.value.clientWidth, h = container.value.clientHeight
  scene.value = new THREE.Scene()
  scene.value.background = new THREE.Color(0x101018)
  camera.value = new THREE.PerspectiveCamera(60, w / h, 0.1, 100)
  camera.value.position.set(0, 0, 5)
  renderer.value = new THREE.WebGLRenderer({ antialias: true })
  renderer.value.setSize(w, h)
  container.value.appendChild(renderer.value.domElement)

  renderer.value.setAnimationLoop(() => {
    frameCallbacks.forEach(fn => fn())      // 先让各子组件更新自己
    renderer.value.render(scene.value, camera.value)  // 再统一画一遍
  })
  window.addEventListener('resize', onResize)
})

function onResize() {
  const w = container.value.clientWidth, h = container.value.clientHeight
  camera.value.aspect = w / h
  camera.value.updateProjectionMatrix()
  renderer.value.setSize(w, h)
}
function onPicked() { log.value = '🎉 你点到立方体了！' }

onUnmounted(() => {
  renderer.value.setAnimationLoop(null)
  window.removeEventListener('resize', onResize)
  scene.value.traverse(o => {
    o.geometry?.dispose()
    if (Array.isArray(o.material)) o.material.forEach(m => m.dispose())
    else o.material?.dispose()
  })
  renderer.value.dispose()
  renderer.value.domElement.remove()
})
<\/script>

<style scoped>
.canvas-box { width: 100%; height: 400px; position: relative; }
.canvas-box :deep(canvas) { display: block; }
.log { font: 14px sans-serif; color: #42b883; }
</style>
```

## 文件 2：`src/components/SpinningBox.vue`（子·唱戏）

```vue
<template>
  <!-- 这是「逻辑组件」：不渲染 UI，只往父级场景里塞一个物体 -->
  <></>
</template>

<script setup>
import { inject, shallowRef, watch, onMounted, onUnmounted } from 'vue'
import * as THREE from 'three'

const props = defineProps({ color: { type: String, default: '#42b883' } })
const emit = defineEmits(['picked'])
const ctx = inject('threeCtx')       // 关键：inject 拿到父级提供的场景
const mesh = shallowRef(null)
const raycaster = new THREE.Raycaster()
const mouse = new THREE.Vector2()

onMounted(() => {
  mesh.value = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 1.6, 1.6),
    new THREE.MeshStandardMaterial({ color: props.color })
  )
  ctx.scene.value.add(mesh.value)    // 把物体加进父级场景

  const light = new THREE.DirectionalLight(0xffffff, 2)
  light.position.set(3, 5, 4)
  ctx.scene.value.add(light)
  ctx.scene.value.add(new THREE.AmbientLight(0xffffff, 0.5))

  // 点击检测（绑在父级的 canvas 上）
  ctx.renderer.value.domElement.addEventListener('pointerdown', onClick)
  // 向父级登记「每帧要干的活」，旋转逻辑自己管，渲染循环交给父级
  ctx.onFrame(() => { if (mesh.value) mesh.value.rotation.y += 0.01 })
})

function onClick(e) {
  const rect = ctx.renderer.value.domElement.getBoundingClientRect()
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1
  raycaster.setFromCamera(mouse, ctx.camera.value)
  if (raycaster.intersectObject(mesh.value).length) emit('picked')
}

watch(() => props.color, v => mesh.value?.material.color.set(v))

onUnmounted(() => {
  ctx.renderer.value?.domElement.removeEventListener('pointerdown', onClick)
  ctx.scene.value?.remove(mesh.value)
  mesh.value?.geometry.dispose()
  mesh.value?.material.dispose()
})
<\/script>
```

::: plain onFrame 是「任务登记处」
父组件 provide 了一个 `onFrame(fn)` 函数，子组件把「每帧要做的事」登记进去。父渲染循环统一执行所有登记的任务，再画一遍。这样每个物体各管各的行为，渲染循环却只有一份——比每个组件各开一个渲染循环优雅得多。案例 04 会把这套机制抽成可复用的 composable。
:::

## 关键点拆解

::: plain provide/inject 是「直达电梯」
如果场景对象要传给孙组件，一层层 `props` 往下传会很累（父传子、子传孙……）。`provide('threeCtx', {...})` 像在父组件头顶挂了个公告板，任何后代组件用 `inject('threeCtx')` 就能直接拿到，不用管中间隔了几层。这里传的是三个 `shallowRef`，子组件通过 `.value` 访问同一份场景对象。
:::

::: plain props 下去，emit 上来
这是 Vue 组件通信的黄金法则：**数据用 props 往下传，事件用 emit 往上抛**。父组件 `:color="boxColor"` 把颜色传下去；子组件点中立方体后 `emit('picked')` 告诉父组件；父组件 `@picked="onPicked"` 接住并更新页面文字。数据流清晰，单向可控。
:::

::: plain 逻辑组件为什么模板是空的
`SpinningBox` 不渲染任何可见的 Vue 元素，它的职责只是「在 3D 场景里放一个物体」。所以模板写个空标签占位即可，所有逻辑都在 `<script setup>` 里。这种模式在 3D 项目里很常见——组件代表场景中的一个「实体」。
:::

::: tip 什么时候用组件化
- 场景简单（就几个物体）：全塞一个组件里反而省事，别过度设计。
- 物体多、逻辑复杂、需要复用（比如几十个可交互零件）：拆组件 + provide/inject，代码清晰得多。
:::
</script>

    s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => '<code class="inline-code">' + codes[+i] + '</code>');
    return s;
  }

  let headingSeq = 0;
  const slug = () => 'sec-' + (++headingSeq);

  function highlight(code){
    const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|(\b(?:const|let|var|function|return|if|else|for|while|new|import|from|export|default|class|extends|this|true|false|null|undefined|async|await|of|in|break|continue|throw|try|catch)\b)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_$][\w$]*(?=\s*\())/g;
    let out = '', last = 0, m;
    while ((m = re.exec(code)) !== null){
      out += esc(code.slice(last, m.index));
      const cls = m[1] ? 'tok-comment' : m[2] ? 'tok-string' : m[3] ? 'tok-keyword' : m[4] ? 'tok-number' : 'tok-func';
      out += '<span class="' + cls + '">' + esc(m[0]) + '</span>';
      last = m.index + m[0].length;
    }
    out += esc(code.slice(last));
    return out;
  }

  const parseRow = line => line.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(x => x.trim());

  function isBlockStart(l){
    const t = l.trim();
    return t.startsWith('```') || /^:::/.test(t) || /^#{1,4}\s/.test(t) || /^>\s?/.test(t)
      || /^[-*]\s/.test(t) || /^\d+\.\s/.test(t) || /^\|/.test(t) || /^(---+|\*\*\*+)$/.test(t);
  }

  function renderMarkdown(md){
    const lines = md.replace(/\r/g,'').split('\n');
    let html = '', i = 0, listType = null;
    const closeList = () => { if (listType){ html += '</' + listType + '>'; listType = null; } };

    while (i < lines.length){
      const line = lines[i], t = line.trim();

      if (t.startsWith('```')){
        closeList();
        const lang = t.slice(3).trim() || 'code';
        const buf = []; i++;
        while (i < lines.length && !lines[i].trim().startsWith('```')){ buf.push(lines[i]); i++; }
        i++;
        html += '<div class="code-wrap"><div class="code-head"><span>' + esc(lang) + '</span>'
          + '<button class="copy-btn" type="button">复制</button></div><pre class="code-block"><code>'
          + highlight(buf.join('\n')) + '</code></pre></div>';
        continue;
      }

      const cm = t.match(/^:::\s*(\w+)\s*(.*)$/);
      if (cm){
        closeList();
        const type = cm[1], title = cm[2] || ({tip:'提示',warning:'注意',danger:'警告',plain:'大白话时间'}[type] || '说明');
        const buf = []; i++;
        while (i < lines.length && !/^:::\s*$/.test(lines[i].trim())){ buf.push(lines[i]); i++; }
        i++;
        const icon = {tip:'💡',warning:'⚠️',danger:'🚨',plain:'🗣️'}[type] || '📌';
        html += '<div class="custom-block cb-' + type + '"><div class="block-title">' + icon + ' '
          + esc(title) + '</div>' + renderMarkdown(buf.join('\n')) + '</div>';
        continue;
      }

      if (/^\|/.test(t) && i+1 < lines.length && /^\|[\s:|-]+\|$/.test(lines[i+1].trim())){
        closeList();
        const head = parseRow(t); i += 2;
        const rows = [];
        while (i < lines.length && /^\|/.test(lines[i].trim())){ rows.push(parseRow(lines[i])); i++; }
        html += '<table><thead><tr>' + head.map(h => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>';
        rows.forEach(r => { html += '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>'; });
        html += '</tbody></table>';
        continue;
      }

      const hm = t.match(/^(#{1,4})\s+(.+)$/);
      if (hm){
        closeList();
        const lv = hm[1].length, id = slug();
        html += '<h' + lv + ' id="' + id + '">' + inline(hm[2]) + '</h' + lv + '>';
        i++; continue;
      }

      if (/^(---+|\*\*\*+)$/.test(t)){ closeList(); html += '<hr>'; i++; continue; }

      if (/^>\s?/.test(t)){
        closeList();
        const buf = [];
        while (i < lines.length && /^>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^>\s?/,'')); i++; }
        html += '<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>';
        continue;
      }

      const ul = t.match(/^[-*]\s+(.+)$/), ol = t.match(/^\d+\.\s+(.+)$/);
      if (ul || ol){
        const want = ul ? 'ul' : 'ol';
        if (listType !== want){ closeList(); html += '<' + want + '>'; listType = want; }
        html += '<li>' + inline((ul||ol)[1]) + '</li>';
        i++; continue;
      }

      if (t === ''){ closeList(); i++; continue; }

      closeList();
      const buf = [line]; i++;
      while (i < lines.length && lines[i].trim() !== '' && !isBlockStart(lines[i])){ buf.push(lines[i]); i++; }
      html += '<p>' + inline(buf.join(' ')) + '</p>';
    }
    closeList();
    return html;
  }

  function buildSidebar(){
    const groups = [];
    chapters.forEach(c => {
      let g = groups.find(x => x.name === c.group);
      if (!g){ g = { name:c.group, items:[] }; groups.push(g); }
      g.items.push(c);
    });
    $('#sidebar-inner').innerHTML = groups.map(g =>
      '<div class="side-group"><div class="side-group-title">' + esc(g.name) + '</div>'
      + g.items.map(c => '<a class="side-link" href="#' + c.id + '" data-id="' + c.id + '">' + esc(c.title) + '</a>').join('')
      + '</div>').join('');
  }

  function currentId(){
    const h = decodeURIComponent(location.hash.replace(/^#/,''));
    return byId[h] ? h : chapters[0].id;
  }

  function show(id){
    const c = byId[id]; if (!c) return;
    headingSeq = 0;
    $('#article').innerHTML = renderMarkdown(c.md);
    document.title = c.title + ' · Three.js 知识库';

    const heads = $$('#article h2, #article h3');
    $('#toc-inner').innerHTML = '<div class="toc-title">本页目录</div>' + heads.map(h =>
      '<a class="toc-link ' + (h.tagName === 'H3' ? 'toc-h3' : '') + '" data-target="' + h.id + '">'
      + h.textContent.replace(/#$/,'').trim() + '</a>').join('');

    $$('.side-link').forEach(a => a.classList.toggle('active', a.dataset.id === id));

    const prev = chapters[c.index-1], next = chapters[c.index+1];
    $('#page-nav').innerHTML =
      (prev ? '<a class="pn prev" href="#' + prev.id + '"><small>← 上一篇</small><strong>' + esc(prev.title) + '</strong></a>' : '<div></div>')
      + (next ? '<a class="pn next" href="#' + next.id + '"><small>下一篇 →</small><strong>' + esc(next.title) + '</strong></a>' : '<div></div>');

    window.scrollTo(0, 0);
    updateProgress();
  }

  function updateProgress(){
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    $('#progress-bar').style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
    const heads = $$('#article h2, #article h3');
    let active = '';
    heads.forEach(x => { if (x.getBoundingClientRect().top < 140) active = x.id; });
    $$('.toc-link').forEach(a => a.classList.toggle('active', a.dataset.target === active));
  }

  document.addEventListener('click', e => {
    const toc = e.target.closest('.toc-link');
    if (toc){ const el = document.getElementById(toc.dataset.target); if (el) el.scrollIntoView({behavior:'smooth'}); return; }
    const cp = e.target.closest('.copy-btn');
    if (cp){
      const code = cp.closest('.code-wrap').querySelector('code').innerText;
      const done = () => { cp.textContent = '已复制'; setTimeout(() => cp.textContent = '复制', 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(code).then(done).catch(() => cp.textContent = '手动复制');
      else cp.textContent = '手动复制';
      return;
    }
    if (e.target.closest('.side-link, .pn, .header-nav a, .brand')){
      $('#sidebar').classList.remove('open'); $('#menu-mask').classList.remove('show');
    }
  });

  window.addEventListener('hashchange', () => show(currentId()));
  window.addEventListener('scroll', updateProgress, { passive:true });
  $('#menu-btn').addEventListener('click', () => { $('#sidebar').classList.toggle('open'); $('#menu-mask').classList.toggle('show'); });
  $('#menu-mask').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#menu-mask').classList.remove('show'); });

  const input = $('#search-input');
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    $$('.side-link').forEach(a => {
      const c = byId[a.dataset.id];
      a.style.display = (!q || (c.title + ' ' + c.md).toLowerCase().includes(q)) ? '' : 'none';
    });
    $$('.side-group').forEach(g => {
      g.style.display = $$('.side-link', g).some(a => a.style.display !== 'none') ? '' : 'none';
    });
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== input){ e.preventDefault(); input.focus(); }
    if (e.key === 'Escape'){ input.value = ''; input.dispatchEvent(new Event('input')); input.blur(); }
  });

  buildSidebar();
  show(currentId());
})();
</script>
</body>
</html>
