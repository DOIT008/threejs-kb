<script type="text/markdown" data-id="intro" data-title="01 · Three.js 是个啥" data-group="基础入门">
# Three.js 是个啥？

一句话：**它是一个让你用 JavaScript 在网页里画 3D 的「工具箱」。**

你平时看到的网页，不管多花哨，本质都是一张**平面的画**——只有宽和高，没有「深度」。想在网页里搞出能转来转去、有立体感的东西，就得靠 3D 图形技术。

## 先说人话版本

浏览器自带一套画 3D 的底层接口，叫 **WebGL**。它很强，但特别难写：矩阵、向量、着色器（shader）全都要你自己算。写个会转的立方体，可能先掉一半头发。

::: plain 大白话时间
WebGL 给你的是一堆**最原始的零件**：齿轮、螺丝、弹簧。理论上啥都能造，但想直接拿它拼台车？先练五年手艺。

**Three.js 就是把这些零件提前装成了「发动机」「车轮」「方向盘」——你拿来拼就行。**

它帮你把矩阵运算、着色器编译、灯光计算这些脏活累活全包了，你只要说「这里放个球，给它红色，让它转」，它就给你画出来。
:::

## 它能做什么？

- **3D 产品展示**：一颗能 360° 旋转的球鞋，比九张静态图有说服力
- **数据可视化**：把表格里冰冷的数字，变成会动的立体图表
- **网页小游戏**：不用下载安装，点开链接就玩
- **建筑 / 室内预览**：装修前先在房子里「走」一遍
- **数字孪生**：把工厂、城市搬进浏览器里实时监控
- **各种酷炫特效**：粒子、星空、流体、模型翻转……

::: tip 小贴士
你玩过的很多网页 3D 效果——比如苹果官网的产品展示、一些汽车官网的看车页面——背后大多是 Three.js（或同类库）在做。
:::

## 学习它要准备什么？

好消息：**不用装任何 3D 软件，也不用买服务器。**

| 你需要 | 说明 |
|---|---|
| 一点点 JavaScript | 会写 `const a = 1`、会写函数就够了 |
| 一个现代浏览器 | Chrome / Edge / Firefox 都行 |
| 一个代码编辑器 | VS Code 推荐 |
| 一点点耐心 | 前 30 分钟可能全是黑屏，正常 |

::: warning 注意
不需要先学 WebGL，也不需要数学很好。初中几何知识（什么是坐标、什么是角度）就够起步了。线性代数那些东西，等你想深入着色器时再补也来得及。
:::

## 这本书怎么读？

本知识库按这条路线走，建议按顺序来：

1. **基础入门**：搭环境、跑通第一行代码、认识三件套
2. **核心概念**：几何体、材质、坐标、相机、光照
3. **动起来**：动画循环、控制器、鼠标交互
4. **进阶特性**：贴图、模型加载、后期处理、着色器、性能
5. **实战**：完整项目、排错手册、学习资源

每一章都配了能直接跑的代码。**别只看，一定要动手敲一遍**——3D 这东西，看 ten 遍不如跑一遍。

## 一个心理准备

刚开始你会遇到这些情况，都正常：

- 页面上什么都没有，一片黑
- 写得明明没错，物体却跑到屏幕外去了
- 加了灯但画面还是黑的
- 改了参数却没反应

这些坑后面「排错手册」那一章会专门讲。现在你只需要知道：**每个人都这么过来的。**

::: plain 大白话时间
学 Three.js 就像学开车：一开始你满脑子都是「离合、油门、方向盘」，手忙脚乱。但开多了，这些就变成肌肉记忆了。

Three.js 的「离合油门」就是**场景、相机、渲染器**——记住这三个词，你已经赢在起跑线上了。
:::

<script type="text/markdown" data-id="install" data-title="02 · 把环境搭起来" data-group="基础入门">
# 把环境搭起来

写代码之前，先让 Three.js 能在浏览器里跑起来。这里给两种方式：**CDN**（最快）和 **npm**（正经项目用）。

## 方式一：CDN，三分钟跑起来

新建一个 `index.html`，把下面这段贴进去：

```html
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的第一个 Three.js</title>
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.187.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
    }
  }
  <\/script>
  <script type="module">
    import * as THREE from 'three';
    console.log('Three.js 加载成功，版本：', THREE.REVISION);
  <\/script>
</body>
</html>
```

然后在 VS Code 里装一个 **Live Server** 插件，右键文件选择「Open with Live Server」。浏览器会自动打开，按 F12 打开控制台，能看到版本号就说明成功了。

::: warning 注意
**别直接双击 HTML 文件打开！** 浏览器对 `file://` 开头的本地文件有安全限制，`type="module"` 的脚本很可能加载失败，控制台会报 CORS 错误。一定要用本地服务器。

如果你不想装插件，也可以在目录里执行 `npx serve` 或 `python -m http.server 8000`，然后访问 `http://localhost:8000`。
:::

### `importmap` 是个啥？

::: plain 大白话时间
以前用第三方库，得去网上下载一个 `.js` 文件，放到项目里，再写 `<script src="...">` 引入。麻烦。

`importmap` 就像是给浏览器一张**地址簿**：你代码里写 `import ... from 'three'`，浏览器一查地址簿——哦，`three` 对应的是 unpkg 上那个网址，去那儿拿。

于是**不用下载、不用打包工具、不用构建**，直接就能写 `import` 语句。浏览器原生支持，现代浏览器全都能用。
:::

注意这里配了两条映射：

| 映射 | 作用 |
|---|---|
| `"three"` | 核心库，写 `import * as THREE from 'three'` 时用 |
| `"three/addons/"` | 官方扩展（控制器、加载器等），写 `import { OrbitControls } from 'three/addons/controls/OrbitControls.js'` 时用 |

::: tip 关于版本
本知识库统一使用**当前最新版 r187**（npm 包 `three@0.187.0`，2026 年 10 月发布）。Three.js 没有传统意义上的「大版本」，每次发布叫一个 **revision（修订版）**——GitHub 上标 `r187`，npm 上对应 `0.187.x`，代码里用 `THREE.REVISION` 能读到当前版本号（字符串 `"187"`）。

它大约每 1~3 个月发一次版，偶尔会有破坏性改动（比如 r183 用 `Timer` 取代了 `Clock`，r186 移除了 `PCFSoftShadowMap`）。本知识库已按 r187 的写法更新；锁定版本是为了避免 API 变动带来的意外，等熟悉了再升级也不迟。
:::

## 方式二：npm + Vite（正经项目用）

真要长期做项目，用 npm 管理依赖更靠谱：

```bash
# 创建项目
npm create vite@latest my-three-app
cd my-three-app

# 安装依赖
npm install
npm install three

# 启动开发服务器
npm run dev
```

然后 `src/main.js` 里写：

```js
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

console.log('版本：', THREE.REVISION);
```

### Vite 项目结构

```text
my-three-app/
├── index.html
├── package.json
├── src/
│   ├── main.js        ← 你的 Three.js 代码
│   └── style.css
└── node_modules/      ← npm 装的依赖（包括 three）
```

::: plain 大白话时间
Vite 就是个**本地开发服务器 + 打包工具**。它帮你干两件事：

1. 你改代码，浏览器自动刷新（热更新）
2. 项目做完要上线时，它能把代码压缩打包成一堆小文件

小 demo 用 CDN 就够了；项目一大、文件一多，Vite 就香了。
:::

## 两种方式怎么选？

| 场景 | 推荐 |
|---|---|
| 学习、做 demo、写代码片段 | CDN + importmap |
| 正式项目、要上线、代码分文件 | npm + Vite |
| 想用 TypeScript | npm + Vite |

::: tip 小贴士
本知识库的所有例子，**两种方式都能跑**。用 CDN 的话把例子放进 `<script type="module">`；用 Vite 的话放进 `main.js`。
:::

## 检查是否成功

在控制台输入：

```js
THREE.REVISION
```

能输出 `"187"`（对应 r187）就说明环境没问题。如果数字不一样，说明你用了别的版本——代码大体通用，但遇到 API 对不上时记得核对版本。

接下来就可以画第一个 3D 场景了。

<script type="text/markdown" data-id="hello" data-title="03 · 第一个 3D 场景" data-group="基础入门">
# 第一个 3D 场景

废话不多说，先上能跑的代码。把上一章环境里的 `import` 部分换成下面这段，刷新页面：

```js
import * as THREE from 'three';

// 1. 场景：装东西的大盒子
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

// 2. 相机：观众的眼睛
const camera = new THREE.PerspectiveCamera(
  75,                                     // 视野角度
  window.innerWidth / window.innerHeight, // 宽高比
  0.1,                                    // 最近能看到哪
  1000                                    // 最远能看到哪
);
camera.position.z = 5;

// 3. 渲染器：把画面画到屏幕上
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 4. 造一个立方体
const geometry = new THREE.BoxGeometry(1, 1, 1);
const material = new THREE.MeshBasicMaterial({ color: 0x42b883 });
const cube = new THREE.Mesh(geometry, material);
scene.add(cube);

// 5. 不停地把画面画出来
renderer.setAnimationLoop(() => {
  cube.rotation.x += 0.01;
  cube.rotation.y += 0.01;
  renderer.render(scene, camera);
});
```

看到**一个绿色立方体在转**了吗？恭喜，你已经进入 3D 世界了。

## 逐行拆解

### 第 1 步：场景

```js
const scene = new THREE.Scene();
```

场景就是一个**空盒子**，所有要显示的东西都得 `scene.add(xxx)` 加进去。

### 第 2 步：相机

```js
const camera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
camera.position.z = 5;
```

创建了「透视相机」，四个参数后面会详细讲。这里只需要知道：`z = 5` 表示**相机往后退了 5 步**。为什么要退？因为物体默认在原点 `(0,0,0)`，相机也在原点的话，就等于贴在物体脸上，什么都看不见。

::: plain 大白话时间
想象你站在客厅正中央，脸贴着墙——你能看到墙吗？只能看到一片糊。

同理，相机和物体必须**拉开距离**。往后退 5 步，正好能看到整个立方体。
:::

### 第 3 步：渲染器

```js
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
```

渲染器负责把 3D 场景算成 2D 图片。它内部会创建一个 `<canvas>` 元素，`renderer.domElement` 就是这个 canvas。第三行把它塞进页面，你才能看见。

::: warning 注意
忘了 `appendChild(renderer.domElement)` 是新手最常犯的错误之一——代码没错，但页面上什么都没有，因为画布根本没加到页面里。
:::

### 第 4 步：造物体

```js
const geometry = new THREE.BoxGeometry(1, 1, 1);
const material = new THREE.MeshBasicMaterial({ color: 0x42b883 });
const cube = new THREE.Mesh(geometry, material);
scene.add(cube);
```

三行对应三件事：

| 代码 | 大白话 |
|---|---|
| `BoxGeometry(1,1,1)` | 造一个 1×1×1 的立方体**形状** |
| `MeshBasicMaterial(...)` | 做一件绿色的**外衣** |
| `new THREE.Mesh(形状, 外衣)` | 把形状和外衣**组合成物体** |
| `scene.add(cube)` | 把物体**放进场景** |

### 第 5 步：动画循环

```js
renderer.setAnimationLoop(() => {
  cube.rotation.x += 0.01;
  cube.rotation.y += 0.01;
  renderer.render(scene, camera);
});
```

`setAnimationLoop` 会让浏览器**每秒调用这个函数约 60 次**。每次做两件事：

1. 把立方体稍微转一点
2. 重新画一遍画面

::: tip 关于写法
老教程里常见的是 `requestAnimationFrame` 自己写循环。r187 官方推荐用 `renderer.setAnimationLoop()`——更简洁，而且原生支持 VR/AR。详细的动画章节会讲。
:::

::: plain 大白话时间
这就是**翻页动画**：你小时候可能在书角画过小人在跑，快速翻页他就动起来了。

Three.js 就是那个「翻页」的人——每秒翻 60 页，每页把立方体转 0.01 弧度。你的眼睛觉得它在连续旋转，其实它是 60 张静态图。
:::

## 试试改几个数

亲手改改下面这些数字，看效果变化，比看十遍理论管用：

| 改哪里 | 变成什么 | 效果 |
|---|---|---|
| `BoxGeometry(1,1,1)` 改成 `(2,1,1)` | 宽变成 2 | 立方体变成扁的长方体 |
| `0x42b883` 改成 `0xff0000` | 颜色变红 | 红色立方体 |
| `0.01` 改成 `0.05` | 转得更快 | 快速旋转 |
| `camera.position.z = 5` 改成 `10` | 相机退更远 | 立方体变小 |
| 删掉 `cube.rotation.x += 0.01` | 不绕 X 轴转 | 只绕 Y 轴转 |

## 窗口大小变化时

现在缩放浏览器窗口，画面会被拉伸变形。加上这段就好了：

```js
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
```

::: tip 小贴士
`camera.updateProjectionMatrix()` 这行千万别忘！改了相机参数后必须调用它，否则改动不生效。这是新手最容易漏掉的一行代码。
:::

## 小结

你已经掌握了 Three.js 最核心的流程：

```text
创建场景 → 创建相机 → 创建渲染器 → 往场景里加物体 → 循环渲染
```

后面所有复杂的项目，本质上都是在这五步上添砖加瓦。
</script>

<script type="text/markdown" data-id="trio" data-title="04 · 三件套详解" data-group="基础入门">
# 场景、相机、渲染器详解

上一章你跑通了第一个场景。这一章把「三件套」掰开揉碎讲清楚——它们是最基础也最重要的三个概念。

::: plain 大白话时间
想象你在**拍电影**：

- **场景 Scene** = 片场，演员（物体）和道具（灯光）都待在这里
- **相机 Camera** = 摄影机，决定从哪个角度、多远的地方拍
- **渲染器 Renderer** = 摄影师 + 冲印师，把拍到的画面变成你能看到的照片

流程就是：**搭台子 → 架机器 → 出片子**。
:::

## 一、场景 Scene

### 它是什么

场景是一个**容器**，是所有 3D 物体的「根」。只有加进场景的东西，才会被渲染出来。

```js
const scene = new THREE.Scene();
scene.add(mesh);       // 加物体
scene.add(light);      // 加灯
scene.add(group);      // 加分组
```

### 常用属性

```js
// 设置背景色
scene.background = new THREE.Color(0x1a1a2e);

// 用图片当背景（需要加载纹理，后面会讲）
scene.background = texture;

// 加雾：远处的物体渐渐融进背景色
scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);
//              颜色       近处   远处

// 指数雾：更自然的衰减
scene.fog = new THREE.FogExp2(0x1a1a2e, 0.02);
```

::: plain 大白话时间
`Fog(颜色, 10, 50)` 的意思是：距离相机 10 以内清晰，50 以外完全变成背景色，中间渐变。

雾有两个作用：**好看**（营造纵深）和**藏拙**（遮挡远处没做好的模型，还能提升性能——反正看不见了）。
:::

### 场景树

场景里的物体可以**嵌套**，形成一个树状结构：

```js
const scene = new THREE.Scene();

const car = new THREE.Group();       // 一辆车 = 一个组
const wheel1 = new THREE.Mesh(...);  // 四个轮子
const wheel2 = new THREE.Mesh(...);
car.add(wheel1, wheel2, ...);

scene.add(car);  // 只需把车加进场景
car.position.x = 3;  // 移动车，轮子跟着走
```

::: tip 小贴士
`Group` 本身不显示任何东西，它只是个「收纳盒」。移动/旋转 Group，里面所有子物体都会跟着动。做复杂物体（人、车、机器人）时必备。
:::

## 二、相机 Camera

### 透视相机 PerspectiveCamera

模拟人眼：**近大远小**。最常用。

```js
const camera = new THREE.PerspectiveCamera(fov, aspect, near, far);
```

| 参数 | 全称 | 大白话 | 常用值 |
|---|---|---|---|
| `fov` | field of view | 视野角度，越大看得越广（广角镜头） | 45~75 |
| `aspect` | aspect ratio | 画面宽高比，写窗口宽/窗口高 | `innerWidth/innerHeight` |
| `near` | near plane | 比这更近的东西不画 | 0.1 |
| `far` | far plane | 比这更远的东西不画 | 1000 |

::: plain 大白话时间
`fov` 就像你睁眼的大小。fov 小（比如 30）像望远镜，看到的范围窄但物体显得大；fov 大（比如 90）像鱼眼镜头，看到的范围广但边缘会变形。

游戏里常用 60~75，产品展示常用 35~50（不会变形得太夸张）。
:::

::: warning 注意
`near` 和 `far` 的比值别太夸张（比如 `near=0.0001, far=1000000`），会导致**深度精度不足**，物体表面一闪一闪的（z-fighting）。实践中 `near=0.1, far=1000` 这种比例就很安全。
:::

### 正交相机 OrthographicCamera

**没有近大远小**，所有物体大小一致。做等距视角游戏、工程图纸、2D 游戏时用。

```js
const camera = new THREE.OrthographicCamera(
  -5, 5,   // 左、右边界
  5, -5,   // 上、下边界
  0.1, 100 // 近、远
);
```

| 相机 | 特点 | 用途 |
|---|---|---|
| 透视相机 | 近大远小，有纵深感 | 大多数 3D 场景 |
| 正交相机 | 大小恒定，无透视 | 工程图、等距游戏、UI |

### 相机的常用操作

```js
camera.position.set(5, 3, 8);       // 放到某个位置
camera.lookAt(0, 0, 0);             // 看向某个点
camera.position.y += 1;             // 移动相机
camera.rotation.z = Math.PI / 4;    // 直接转（一般不推荐）
camera.zoom = 2;                    // 缩放（正交相机常用）
camera.updateProjectionMatrix();    // 改完参数记得调用
```

::: plain 大白话时间
`lookAt(0,0,0)` 就是命令相机：「盯着原点看」。

除非你要做第一人称游戏，否则**别手动改 rotation**——用 `lookAt()` 让相机自动对准目标，简单又不容易晕。想让用户自己转视角？用 `OrbitControls`（后面会讲），那是专门干这个的。
:::

## 三、渲染器 WebGLRenderer

### 创建与配置

```js
const renderer = new THREE.WebGLRenderer({
  antialias: true,    // 抗锯齿，边缘更平滑（推荐开）
  alpha: true,        // 背景透明，能看到后面的 HTML
  powerPreference: 'high-performance'
});

renderer.setSize(width, height);       // 画布尺寸
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); // 适配高清屏
renderer.setClearColor(0x000000, 1);   // 背景色（scene.background 会覆盖它）
document.body.appendChild(renderer.domElement);
```

### `setPixelRatio` 是干嘛的？

::: plain 大白话时间
Retina 屏（苹果高清屏）上一个 CSS 像素对应 2~3 个物理像素。如果不特别设置，画面在高清屏上会**发虚**。

`setPixelRatio(devicePixelRatio)` 就是按屏幕的真实像素密度来渲染，画面更清晰。

为什么要 `Math.min(..., 2)` 限制上限？因为 3 倍像素意味着 9 倍的计算量，手机会卡死。限制到 2 是清晰度和性能的平衡点。
:::

### 阴影设置

```js
renderer.shadowMap.enabled = true;                      // 总开关
renderer.shadowMap.type = THREE.PCFShadowMap;            // 柔和阴影（r187 起 PCFShadowMap 本身就是柔化的，PCFSoftShadowMap 已移除）
```

注意：光了这一行还不够，灯和物体都要分别设置（详见「光照」那章）。

### 色彩与色调映射

```js
renderer.outputColorSpace = THREE.SRGBColorSpace;  // 新版默认就是
renderer.toneMapping = THREE.ACESFilmicToneMapping; // 电影级色调映射
renderer.toneMappingExposure = 1.0;                 // 曝光度
```

::: tip 小贴士
如果你觉得画面「灰蒙蒙的」「不够通透」，试试加上 `ACESFilmicToneMapping`，通常能立刻提升质感。这是很多 Three.js 作品的「秘密武器」。
:::

## 三者如何配合

一次渲染的完整流程：

```text
1. 你把物体 add 到 scene
2. 你设置好 camera 的位置和角度
3. 调用 renderer.render(scene, camera)
4. 渲染器遍历场景树，把能看见的东西画成图片
5. 图片显示在 canvas 上
```

::: plain 大白话时间
`renderer.render(scene, camera)` 这一行，翻译成人话就是：

**「以这台相机的视角，把那个场景拍下来，画到屏幕上。」**

Every frame 都拍一张，快速连播，就成了动画。所有 Three.js 程序，归根结底都是这一行。
:::
</script>

<script type="text/markdown" data-id="mesh" data-title="05 · 几何体与材质" data-group="核心概念">
# 几何体与材质：万物皆网格

Three.js 里你能看见的实体，几乎都是 **Mesh（网格）**。一个 Mesh 由两样东西拼出来：

> **Mesh = Geometry（几何体，长什么样）+ Material（材质，表面是什么感觉）**

::: plain 大白话时间
**Geometry 是骨架，Material 是衣服。**

同一个骨架，穿上红衣服就是红球，穿上金属衣服就是钢球。骨架管形状，衣服管长相。

所以造物体永远分三步：造形状 → 做材质 → 拼起来。
:::

```js
const geometry = new THREE.SphereGeometry(1, 32, 32);
const material = new THREE.MeshStandardMaterial({ color: 0x42b883 });
const ball = new THREE.Mesh(geometry, material);
scene.add(ball);
```

## 一、内置几何体

Three.js 自带很多现成形状，直接 new 就能用：

```js
new THREE.BoxGeometry(1, 1, 1);              // 立方体：宽、高、深
new THREE.SphereGeometry(1, 32, 32);        // 球：半径、水平分段、垂直分段
new THREE.PlaneGeometry(4, 2);              // 平面：宽、高
new THREE.CylinderGeometry(1, 1, 2, 32);    // 圆柱：顶半径、底半径、高、分段
new THREE.ConeGeometry(1, 2, 32);           // 圆锥：半径、高、分段
new THREE.TorusGeometry(1, 0.4, 16, 100);   // 甜甜圈：半径、管径、管分段、环分段
new THREE.TorusKnotGeometry(1, 0.3);        // 扭结（很酷，试试就知道）
new THREE.IcosahedronGeometry(1, 0);        // 二十面体：半径、细节等级
new THREE.DodecahedronGeometry(1, 0);       // 十二面体
new THREE.OctahedronGeometry(1, 0);         // 八面体
new THREE.TetrahedronGeometry(1, 0);        // 四面体
new THREE.CircleGeometry(1, 32);            // 圆盘（2D）
new THREE.RingGeometry(0.5, 1, 32);         // 圆环（2D）
```

::: tip 小贴士
分段数（比如 `32, 32`）越大，表面越圆滑，但顶点越多、越吃性能。一般 32 就够了，球体用 48 已经很顺滑。别动不动写 1000。
:::

### 看几何体长什么样

`IcosahedronGeometry` 这类多面体有个细节等级参数：

```js
new THREE.IcosahedronGeometry(1, 0); // 20 个面，棱角分明
new THREE.IcosahedronGeometry(1, 1); // 80 个面，稍微圆一点
new THREE.IcosahedronGeometry(1, 2); // 320 个面，接近球
```

配合 `wireframe: true` 材质能看到网格结构，很适合学习：

```js
const m = new THREE.MeshBasicMaterial({ color: 0x42b883, wireframe: true });
```

## 二、BufferGeometry：自定义几何体

所有内置几何体本质都是 **BufferGeometry**——一堆顶点数据。你可以自己造：

```js
const geometry = new THREE.BufferGeometry();

// 三个顶点，每个顶点 3 个数（x, y, z）
const vertices = new Float32Array([
  -1, -1, 0,
   1, -1, 0,
   0,  1, 0
]);
geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));

// 计算法线（光照需要）
geometry.computeVertexNormals();

const mesh = new THREE.Mesh(geometry, new THREE.MeshNormalMaterial());
scene.add(mesh);
```

::: plain 大白话时间
BufferGeometry 就是**「点连成面」**。你告诉它三个点的坐标，它帮你连成一个三角形。

复杂模型（ mountains、地形）本质上就是成千上万个三角形。你以后加载的 `.glb` 模型，最后也会变成 BufferGeometry。
:::

## 三、常用材质

### 材质速查表

| 材质 | 特点 | 吃光照吗 | 典型用途 |
|---|---|---|---|
| `MeshBasicMaterial` | 纯色，不受光影响 | ❌ | 调试、图标、发光的物体 |
| `MeshLambertMaterial` | 漫反射，便宜 | ✅ | 低配设备、性能优先 |
| `MeshPhongMaterial` | 有高光，塑料感 | ✅ | 经典材质 |
| `MeshStandardMaterial` | 物理正确，真实感强 | ✅ | **最常用**，推荐默认选它 |
| `MeshPhysicalMaterial` | Standard 的加强版 | ✅ | 玻璃、车漆、清漆 |
| `MeshNormalMaterial` | 按法线方向染色 | ❌ | 调试神器 |
| `MeshDepthMaterial` | 按深度染色 | ❌ | 特殊效果（后期处理） |
| `ShaderMaterial` | 自己写着色器 | 看你自己 | 高级特效 |
| `PointsMaterial` | 点材质 | ❌ | 粒子 |

### MeshStandardMaterial 详解

日常开发 90% 的场景用它：

```js
const material = new THREE.MeshStandardMaterial({
  color: 0x42b883,       // 颜色
  roughness: 0.4,        // 粗糙度：0=镜面，1=完全哑光
  metalness: 0.6,        // 金属度：0=非金属（塑料/木头），1=金属
  transparent: true,     // 是否透明
  opacity: 0.8,          // 透明度 0~1
  side: THREE.DoubleSide,// 渲染哪面：FrontSide/BackSide/DoubleSide
  flatShading: true,     // 平面着色，有棱角感
  emissive: 0x000000,    // 自发光颜色
  emissiveIntensity: 1   // 自发光强度
});
```

::: plain 大白话时间
**roughness（粗糙度）**和 **metalness（金属度）** 是理解 PBR 材质的钥匙：

- 塑料球：roughness 高（0.7），metalness 0
- 抛光金属球：roughness 低（0.1），metalness 1
- 磨砂金属：roughness 0.5，metalness 1
- 橡胶：roughness 1，metalness 0

:::

::: warning 注意
如果你发现加了灯但物体还是一模一样亮，八成是用了 `MeshBasicMaterial`——它**完全不吃光照**。想看光影效果，换成 `MeshStandardMaterial`。
:::

### MeshPhysicalMaterial：玻璃效果

```js
const glass = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0,
  roughness: 0,
  transmission: 1,       // 透射！关键参数
  thickness: 0.5,        // 厚度
  ior: 1.5,              // 折射率（玻璃约 1.5）
  transparent: true
});
```

::: tip 小贴士
`transmission` 是做玻璃/透明塑料的关键。它和简单的 `opacity` 不一样——`opacity` 只是变淡，`transmission` 会真实地折射背后的物体。
:::

## 四、运行时修改物体

```js
mesh.material.color.set(0xff0000);   // 改颜色
mesh.material.wireframe = true;      // 线框模式
mesh.material.opacity = 0.5;         // 改透明度（要 transparent:true）
mesh.geometry.dispose();             // 释放旧几何体（重要！）
mesh.geometry = newGeometry;         // 换几何体
```

::: warning 注意
**多个 Mesh 共用同一个材质时，改一个，其他全跟着变**——因为它们指向同一个对象。想单独改，用 `material.clone()` 复制一份：

```js
const myMat = material.clone();
mesh.material = myMat;
```

换几何体/材质时，旧的要调用 `dispose()` 释放显存，否则长时间运行会内存泄漏。
:::

## 五、性能小贴士

- 相同的几何体和材质**尽量复用**，别在循环里 `new` 几百份
- 分段数够用就行，别无脑堆高
- 物体特别多（成千上万个相同物体）时，用 `InstancedMesh`（进阶章节会讲）
- 看不见的物体可以设 `mesh.visible = false`，或者直接 `scene.remove(mesh)`
</script>

<!-- ---------- 6 坐标与变换 ---------- -->
<script type="text/markdown" data-id="transform" data-title="06 · 坐标与变换" data-group="核心概念">
# 坐标、旋转、缩放

物体造出来之后，怎么摆放、转动、改变大小？靠三个属性：**position（位置）、rotation（旋转）、scale（缩放）**。

::: plain 大白话时间
把物体想象成一件家具：

- **position** = 把它搬到房间的哪个角落
- **rotation** = 把它转个方向（朝东还是朝西）
- **scale** = 把它拉大或压扁

这三个属性每个物体都有，改完立刻生效，不用重新创建。
:::

## 一、坐标系

Three.js 用**右手坐标系**：

| 轴 | 方向 | 大白话 | 颜色约定 |
|---|---|---|---|
| **X** | 左右 | 往右是正，往左是负 | 红 |
| **Y** | 上下 | 往上是正，往下是负 | 绿 |
| **Z** | 前后 | **朝你**是正，往屏幕里是负 | 蓝 |

::: plain 大白话时间
伸出右手：食指指向 X（右），中指指向 Y（上），大拇指指向 Z（朝自己）。这就是「右手坐标系」。

记不住也没关系，只要记住一个画面：**站在原点，X 往右走，Y 往天花板走，Z 往你脸上走。**

相机默认在 Z 轴正方向（比如 `z=5`）往原点看。所以「屏幕外面」就是 Z 的正方向。
:::

### 单位是啥？

**没有固定单位。** 你可以当它是米，也可以当它是厘米，全看你自己怎么设定。

::: tip 建议
统一当成「米」来想：人高 1.8，桌子高 0.75，房间高 3。这样调相机距离、光照范围时心里有数，不会乱。
:::

## 二、position：位置

```js
mesh.position.set(2, 1, -3);  // 一次性设置 x/y/z
mesh.position.x = 5;          // 单独改 x
mesh.position.y += 0.1;       // 在原来基础上加
mesh.position.z -= 1;
```

也可以单独用向量对象：

```js
mesh.position = new THREE.Vector3(1, 2, 3);
```

## 三、rotation：旋转

::: warning 注意
**单位是弧度（radian），不是角度（degree）！** `rotation.y = 90` 不是转 90 度，而是转 90 弧度（相当于转了 14 圈多）。
:::

```js
mesh.rotation.set(0, Math.PI / 2, 0); // 绕 Y 轴转 90 度
mesh.rotation.x = Math.PI;            // 绕 X 轴转 180 度
mesh.rotation.z += 0.01;              // 每帧绕 Z 轴转一点
```

换算关系：

| 角度 | 弧度 |
|---|---|
| 90° | `Math.PI / 2` |
| 180° | `Math.PI` |
| 360° | `Math.PI * 2` |
| 1° | `Math.PI / 180` |

嫌换算麻烦，写个小工具函数：

```js
const deg = d => d * Math.PI / 180;
mesh.rotation.y = deg(45); // 终于能写 45 度了
```

::: plain 大白话时间
一圈是 360 度 = `2π` 弧度，所以 π 弧度 = 180 度。

为什么程序员喜欢用弧度？因为它是数学里的「自然单位」，做 sin/cos 计算时不用额外转换。记住 `Math.PI` 就是半圈，基本够用了。
:::

### rotation.order：旋转顺序

```js
mesh.rotation.order = 'YXZ'; // 默认 XYZ
```

::: plain 大白话时间
先转 X 再转 Y，和先转 Y 再转 X，结果**不一样**！就像你把一本书先左右翻再上下翻，和反过来操作，最后朝向不同。

做第一人称相机时常用 `'YXZ'`（先左右看，再抬头低头），这样手感更自然。
:::

## 四、scale：缩放

```js
mesh.scale.set(2, 2, 2); // 整体放大 2 倍
mesh.scale.x = 0.5;      // 只在 X 方向压扁一半
mesh.scale.setScalar(3); // 三个方向一起放大 3 倍
```

::: warning 注意
- `scale` 设成 0 会让物体消失（法线算不出来，光照会出问题）
- 设成负值会翻面（有时候故意用来做镜像）
- 非等比缩放（比如 `scale.set(2,1,1)`）会让法线变形，Three.js 会自动处理，但极端比例下光照可能不对
:::

## 五、父子关系与 Group

物体可以有父子关系，形成一棵**场景树**：

```js
const group = new THREE.Group();
group.position.set(3, 0, 0); // 整组往右挪 3

const a = new THREE.Mesh(...);
a.position.set(1, 0, 0);     // 在组内的「相对位置」
group.add(a);

scene.add(group);
// a 的世界坐标是 (4, 0, 0)
```

::: plain 大白话时间
`Group` 就是个**纸箱**。你在箱子里摆好东西，然后搬箱子就行——箱子里的东西相对位置不变。

做一辆由几十个零件组成的车时特别好用：把零件都放进 `carGroup`，然后移动/旋转整个组，车就整体动了。轮子想单独转？直接转 `wheel.rotation` 即可。
:::

### 局部坐标 vs 世界坐标

```js
mesh.position;              // 局部坐标（相对父级）
mesh.getWorldPosition(v);   // 世界坐标（相对场景原点）
```

## 六、四元数 Quaternion（了解即可）

`rotation` 用三个角度表示旋转，有个著名问题叫**万向节死锁**（gimbal lock）——某些角度下会丢失一个旋转自由度。

四元数用四个数表示旋转，没这个问题，还能平滑插值（做旋转动画很丝滑）：

```js
const q1 = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, 0, 0));
const q2 = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI, 0));

// 平滑插值：t 从 0 到 1
mesh.quaternion.slerpQuaternions(q1, q2, t);
```

::: tip 小贴士
日常开发用 `rotation` 就够了。只有当你需要做「在两个朝向之间平滑过渡」（比如角色转身、相机绕物体飞）时，才需要四元数的 `slerp`。
:::

## 七、lookAt：自动对准

```js
mesh.lookAt(0, 0, 0);       // 看向原点
mesh.lookAt(camera.position); // 一直看着相机（做公告板/精灵）
```

::: plain 大白话时间
`lookAt` 帮你算好旋转角度，命令物体「盯着那个点看」。

相机要看向目标用 `camera.lookAt(...)`；物体要面向某个方向用 `mesh.lookAt(...)`。注意物体的「正面」默认是 **+Z 方向**——如果你做了个箭头模型，箭头得朝 +Z 摆，lookAt 才对。
:::
</script>

<!-- ---------- 7 光照 ---------- -->
<script type="text/markdown" data-id="lighting" data-title="07 · 光照与阴影" data-group="核心概念">
# 光照与阴影

除了 `MeshBasicMaterial` 那种「自发光」材质，其他材质**没有光就什么都看不见**。

::: plain 大白话时间
想象你在一个全黑的房间里：就算放一头大象在面前，你也看不见。

Three.js 的世界默认就是**全黑房间**。你得像拍电影一样，自己布光。
:::

## 一、常用灯光

### 1. AmbientLight 环境光 —— 打底的

```js
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);
```

从**四面八方均匀照射**，没有方向，不产生阴影。作用是「别让暗面死黑」。

### 2. HemisphereLight 半球光 —— 天空 + 地面

```js
const hemi = new THREE.HemisphereLight(
  0x87ceeb,  // 天空色（蓝）
  0x8b5a2b,  // 地面色（棕）
  1.0        // 强度
);
scene.add(hemi);
```

从上方是天空色，从下方是地面色。户外场景神器，比环境光自然得多。

### 3. DirectionalLight 平行光 —— 太阳

```js
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(5, 10, 5);
scene.add(sun);
```

光线**互相平行**，像太阳（无限远）。适合做主光源。

### 4. PointLight 点光源 —— 灯泡

```js
const bulb = new THREE.PointLight(0xffaa00, 50, 20, 2);
//                                颜色   强度 距离 衰减
bulb.position.set(0, 3, 0);
scene.add(bulb);
```

从一个点向四周发散，离得越远越暗。第二个参数是强度，第三个是照射距离（0 = 无限远）。

::: warning 注意
r155 之后 Three.js 启用了**物理正确光照**，PointLight/SpotLight 的强度数值感觉和老版本完全不同（需要更大的值，比如 50、100）。如果你按老教程写 `intensity: 1` 发现太暗，别怀疑自己——把数值调大就行。
:::

### 5. SpotLight 聚光灯 —— 舞台灯

```js
const spot = new THREE.SpotLight(0xffffff, 100);
spot.position.set(0, 10, 0);
spot.angle = Math.PI / 6;     // 光锥张角
spot.penumbra = 0.3;          // 边缘柔化（0~1）
spot.distance = 30;
spot.decay = 2;
spot.target.position.set(0, 0, 0); // 照向哪里
scene.add(spot, spot.target);
```

### 6. RectAreaLight 面光源 —— 灯管/柔光箱

```js
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
RectAreaLightUniformsLib.init(); // 必须初始化！

const rect = new THREE.RectAreaLight(0xffffff, 5, 4, 2); // 颜色、强度、宽、高
rect.position.set(0, 5, 5);
rect.lookAt(0, 0, 0);
scene.add(rect);
```

一块矩形在发光，能产生很漂亮的柔和高光，适合拍产品。

| 灯 | 大白话 | 能投影吗 | 性能 |
|---|---|---|---|
| AmbientLight | 阴天天光 | ❌ | 极低 |
| HemisphereLight | 天空+地面反光 | ❌ | 低 |
| DirectionalLight | 太阳 | ✅ | 中 |
| PointLight | 灯泡 | ✅ | 中高 |
| SpotLight | 手电筒/舞台灯 | ✅ | 中高 |
| RectAreaLight | 柔光箱 | ❌ | 中 |

::: tip 关于新版本
**SunLight** 扩展（`three/addons/lights/SunLight.js`）内置级联阴影（cascaded shadow maps），做大场景户外阳光时阴影质量比普通 DirectionalLight 好很多，r186 起可用、r187 继续支持。

而 **r187**（当前版本）在光照相关上的改进是：重新设计了 PMREM 环境贴图的生成方式（基于立方体渲染目标），让基于图片的照明（IBL）质量更高——配合后面「纹理」章节的 `scene.environment` 使用效果更明显。
:::

## 二、阴影

### 开阴影的三个条件

::: plain 大白话时间
阴影要同时满足三个条件，缺一个都看不到——就像拍电影要有灯、有演员、有地面才能看到影子：

1. **渲染器**打开阴影开关
2. **灯**设置 `castShadow = true`（它会投影）
3. **物体**设置 `castShadow`（它投影）和**接收面**设置 `receiveShadow`（它上面出现影子）
:::

```js
// 1. 渲染器
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap; // r187 推荐，本身就是柔化的

// 2. 灯
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);  // 阴影贴图分辨率，越高越清晰越吃性能
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 50;
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10;
sun.shadow.camera.bottom = -10;
sun.shadow.bias = -0.0001;           // 消除Shadow acne（表面条纹）

// 3. 物体和地面
cube.castShadow = true;
floor.receiveShadow = true;
```

::: warning 注意
平行光的阴影用的是**正交相机**，默认范围只有 ±5。场景大了，阴影会被裁掉——所以要调 `shadow.camera.left/right/top/bottom` 覆盖整个场景。

`shadow.bias` 设成很小的负值（如 `-0.0001`）能消除物体表面的条纹状伪影（shadow acne）。但别设太大，否则影子会和物体「脱节」（peter panning）。
:::

### 万能起手式

不知道先加什么灯？先来这一套，基本不会错：

```js
// 天空光打底
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));

// 主光（太阳）
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.position.set(5, 10, 7);
sun.castShadow = true;
scene.add(sun);

// 补光（从反面照亮暗部）
const fill = new THREE.DirectionalLight(0x88bbff, 0.6);
fill.position.set(-5, 3, -5);
scene.add(fill);
```

::: plain 大白话时间
这就是摄影里的**三点布光**：主光（塑造形体）+ 补光（提亮暗部）+ 环境光（统一基调）。

只用一盏灯，物体背面会死黑一片，看起来很「平」。加一盏弱弱的补光，立体感立刻出来。
:::

## 三、光照性能

- 每多一盏灯，着色器计算量就增加，**灯不是越多越好**
- 阴影尤其贵：每盏投影的灯都要额外渲染一遍场景
- 能用 `AmbientLight`/`HemisphereLight` 解决的，就别用投影灯
- 静态场景可以设 `light.shadow.autoUpdate = false`，阴影只算一次
- 移动端建议最多 1~2 盏投影灯
</script>

<!-- ---------- 8 动画 ---------- -->
<script type="text/markdown" data-id="animation" data-title="08 · 动画循环（r187 新写法）" data-group="动画与交互">
# 动画循环

3D 动画的原理和电影一模一样：**快速播放一张张静止画面，骗过你的眼睛。**

::: plain 大白话时间
电影每秒 24 帧，Three.js 通常每秒 60 帧（跟屏幕刷新率一致）。

每一帧做的事都一样：**改一点数据 → 重新画一遍**。只要够快，你的大脑就觉得它在动。
:::

## 一、推荐写法：setAnimationLoop + Timer

这是 r187 官方推荐的方式（新版例子全都这么写）：

```js
import * as THREE from 'three';

const timer = new THREE.Timer();

renderer.setAnimationLoop(() => {
  timer.update();                       // 先更新计时器
  const delta = timer.getDelta();       // 距上一帧过了多少秒
  const elapsed = timer.getElapsed();   // 总共过了多少秒

  cube.rotation.y += 1 * delta;         // 每秒转 1 弧度
  ball.position.y = Math.sin(elapsed) * 0.5;

  renderer.render(scene, camera);
});
```

### 为什么用 setAnimationLoop？

```js
// 老写法（还能用，但不推荐）
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

// 新写法
renderer.setAnimationLoop(() => {
  renderer.render(scene, camera);
});
```

| 对比 | requestAnimationFrame | setAnimationLoop |
|---|---|---|
| 自动跟随屏幕刷新率 | ✅ | ✅ |
| 切到后台自动暂停 | ✅ | ✅ |
| 支持 WebXR（VR/AR） | ❌ 要自己处理 | ✅ 原生支持 |
| 停止动画 | 要自己管状态 | `renderer.setAnimationLoop(null)` |

::: tip 小贴士
`Timer` 在 r179 之前是独立扩展，r179 起已进入核心库，`import * as THREE from 'three'` 就能直接用 `THREE.Timer`。
:::

## 二、关于 Clock（老教程里的常客）

你会在大量老教程里看到：

```js
const clock = new THREE.Clock();
const delta = clock.getDelta();
const elapsed = clock.getElapsedTime();
```

::: warning 注意
`Clock` 在 **r183 已被标记为废弃（deprecated）**，r187 仍能运行，但控制台可能给警告。新代码请直接用 `Timer`：

| 旧 API | 新 API |
|---|---|
| `new THREE.Clock()` | `new THREE.Timer()` |
| `clock.getDelta()` | `timer.getDelta()` |
| `clock.getElapsedTime()` | `timer.getElapsed()` |
| （无需） | `timer.update()` 每帧调用 |

如果用 `Timer` 时切到后台再回来发现物体「瞬移」了，可以加上 `timer.connect(document)` 恢复旧版的页面可见性处理。
:::

## 三、为什么要乘 delta？

按「帧」改数据有个大问题：**60 帧的电脑和 30 帧的电脑，物体速度差一倍。**

```js
// ❌ 按帧算：不同设备速度不同
cube.rotation.y += 0.01;

// ✅ 按时间算：所有设备速度一致
cube.rotation.y += 1 * delta; // 每秒转 1 弧度
```

::: plain 大白话时间
`delta` 就是「这一帧花了多久」。帧率高它就小，帧率低它就大。乘上它，速度就恒定——

**快的电脑多走几小步，慢的电脑少走几大步，最后走的距离一样。**

这是做流畅动画的关键，一定要养成习惯。
:::

## 四、常用动画公式

```js
// 匀速旋转
mesh.rotation.y += delta;

// 上下浮动（正弦波）
mesh.position.y = Math.sin(elapsed * 2) * 0.5;

// 呼吸缩放
const s = 1 + Math.sin(elapsed * 3) * 0.1;
mesh.scale.setScalar(s);

// 绕圈走
mesh.position.x = Math.cos(elapsed) * 5;
mesh.position.z = Math.sin(elapsed) * 5;

// 摆锤
mesh.rotation.z = Math.sin(elapsed * 2) * 0.5;
```

::: plain 大白话时间
`Math.sin()` 的输出在 -1 到 1 之间来回摆动，画出来就是一条波浪线。

把这个波浪值乘上幅度、加到位置上，物体就「来回动」了。`sin(elapsed * 2)` 里的 2 是速度——数字越大摆得越快。
:::

## 五、缓动动画（Tween）

想让物体「慢慢加速再慢慢停下」，光靠 sin 不够。手动实现 easing：

```js
// 缓入缓出：从 0 平滑到 1，再平滑回到 0
const easeInOut = t => t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;

// 在 2 秒内从 A 移动到 B
let progress = 0;
renderer.setAnimationLoop(() => {
  timer.update();
  progress = Math.min(timer.getElapsed() / 2, 1);
  const t = easeInOut(progress);
  mesh.position.x = THREE.MathUtils.lerp(0, 5, t); // 插值
  renderer.render(scene, camera);
});
```

::: tip 小贴士
项目里做复杂动画，建议用专门的 tween 库，比如 **gsap** 或 **tWEEN**。它们提供了几十种缓动曲线、时间轴、序列动画，比手写舒服得多。
:::

## 六、性能注意

- **别在动画循环里 `new` 对象**！每帧创建 `new THREE.Vector3()`、`new THREE.Color()` 会让垃圾回收器忙死

```js
// ❌ 糟糕
function animate(){
  mesh.position = new THREE.Vector3(x, y, z); // 每帧都 new
}

// ✅ 正确
const pos = new THREE.Vector3(); // 循环外创建一次
function animate(){
  pos.set(x, y, z);
  mesh.position.copy(pos);
}
```

- 用 `THREE.MathUtils.lerp()` 做插值，别自己写浮点运算
- 静态物体不要放在循环里反复赋值
</script>

<!-- ---------- 9 控制器 ---------- -->
<script type="text/markdown" data-id="controls" data-title="09 · 鼠标控制器" data-group="动画与交互">
# 鼠标控制器：让用户转一转

自己监听鼠标事件写相机控制很麻烦。Three.js 官方提供了一堆**控制器**，几行代码就能实现拖拽旋转、滚轮缩放。

## 一、OrbitControls（最常用）

围绕一个目标点旋转查看，产品展示、模型预览基本都用它。

```js
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const controls = new OrbitControls(camera, renderer.domElement);

renderer.setAnimationLoop(() => {
  controls.update();  // 用了 damping 时必须每帧调用
  renderer.render(scene, camera);
});
```

### 常用配置

```js
// 手感
controls.enableDamping = true;     // 惯性（松开鼠标后慢慢停）
controls.dampingFactor = 0.05;     // 阻尼系数，越小越顺滑
controls.rotateSpeed = 1.0;        // 旋转速度
controls.zoomSpeed = 1.0;          // 缩放速度
controls.panSpeed = 1.0;           // 平移速度

// 功能开关
controls.enableRotate = true;
controls.enableZoom = true;
controls.enablePan = true;
controls.screenSpacePanning = true; // 平移相对于屏幕，而非世界

// 限制
controls.minDistance = 2;               // 最近能拉多近
controls.maxDistance = 20;              // 最远能拉多远
controls.minPolarAngle = 0;             // 上下转动范围
controls.maxPolarAngle = Math.PI / 2;   // 限制在水平线以上，看不到地下
controls.minAzimuthAngle = -Infinity;   // 左右转动范围
controls.maxAzimuthAngle = Infinity;

// 自动旋转
controls.autoRotate = true;
controls.autoRotateSpeed = 2;

// 围绕哪个点转
controls.target.set(0, 1, 0);
controls.update();
```

::: plain 大白话时间
`target` 就是**转盘的中心**——相机永远绕着这个点转。

如果你的模型在 `(0, 3, 0)`，但没改 `target`（默认原点 `(0,0,0)`），那转起来就是绕着地面转，模型会跑到画面边上去。

**模型在哪，target 就设到哪。**
:::

### 鼠标操作对照

| 操作 | 效果 |
|---|---|
| 左键拖拽 | 旋转 |
| 滚轮 / 双指捏合 | 缩放 |
| 右键拖拽 / 双指拖动 | 平移 |
| 双击? | 无（需自己实现） |

## 二、其他控制器

```js
// 飞行视角（像开飞机，WASD + 鼠标）
import { FlyControls } from 'three/addons/controls/FlyControls.js';

// 第一人称（FPS 游戏，指针锁定）
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// 编辑器风格（拖拽移动/旋转/缩放物体的小工具）
import { TransformControls } from 'three/addons/controls/TransformControls.js';

// 像地图一样平移拖拽（OrbitControls 的变体）
import { MapControls } from 'three/addons/controls/MapControls.js';

// 直接拖动物体（Raycaster 封装）
import { DragControls } from 'three/addons/controls/DragControls.js';

// 轨迹球（自由旋转，没有极角限制）
import { TrackballControls } from 'three/addons/controls/TrackballControls.js';
```

::: tip 小贴士
- 产品展示 → OrbitControls
- 场景漫游 → PointerLockControls
- 做 3D 编辑器 → TransformControls + OrbitControls 组合
- 看地图/平面图 → MapControls
:::

## 三、多控制器共存

编辑器里经常需要「平时用 OrbitControls 转视角，点中物体后切换成 TransformControls 拖拽」：

```js
transformControls.addEventListener('dragging-changed', e => {
  orbitControls.enabled = !e.value; // 拖拽物体时暂时禁用轨道控制
});
```

::: plain 大白话时间
两个控制器同时监听鼠标会「打架」——你拖物体，相机也跟着转。

所以拖物体的时候，先把 OrbitControls 临时关掉，松手再打开。这个 `dragging-changed` 事件就是干这个的。
:::

## 四、移动端适配

OrbitControls 原生支持触摸：单指旋转、双指缩放/平移。但要注意：

```js
renderer.domElement.style.touchAction = 'none'; // 阻止页面滚动干扰
```

::: warning 注意
如果页面在手机上能滚动，触摸拖拽 3D 场景时可能连带页面一起滚。给 canvas 加 `touch-action: none` 能解决。
:::
</script>

<!-- ---------- 10 鼠标交互 ---------- -->
<script type="text/markdown" data-id="raycaster" data-title="10 · 鼠标交互与射线拾取" data-group="动画与交互">
# 鼠标交互：射线拾取 Raycaster

3D 场景里，「用户点中了哪个物体」不像 2D 网页那么简单。因为屏幕是 2D 的，物体是 3D 的——需要一套专门的办法。

::: plain 大白话时间
想象你闭着眼睛，从屏幕这个「窗户」往屋里**射出一根激光笔**。激光穿过窗户，碰到第一个物体——那个就是你点中的东西。

Raycaster（射线投射器）就是这根激光笔。
:::

## 一、基本用法

```js
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// 监听鼠标移动
window.addEventListener('pointermove', (event) => {
  // 把鼠标屏幕坐标转成 -1 ~ 1 的标准设备坐标
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
});

renderer.setAnimationLoop(() => {
  // 从相机出发，穿过鼠标位置射出射线
  raycaster.setFromCamera(mouse, camera);

  // 检测射线和哪些物体相交（第二个参数 true 表示检测子物体）
  const hits = raycaster.intersectObjects(scene.children, true);

  if (hits.length > 0) {
    const object = hits[0].object;  // 第一个就是最近的
    object.material.color.set(0xff0000); // 变红
  }

  renderer.render(scene, camera);
});
```

::: warning 注意
`mouse.y` 前面有个**负号**！因为屏幕坐标 Y 轴向下为正，而 Three.js 的世界坐标 Y 轴向上为正——必须翻转。忘了这个负号，点击位置会上下颠倒。
:::

### 坐标转换拆解

```js
mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
```

::: plain 大白话时间
Three.js 需要的坐标范围是 **-1 到 1**：屏幕最左边是 -1，最右边是 +1，中间是 0。

鼠标的 `clientX` 是像素值（比如 0~1920）。除以宽度得到 0~1，乘 2 得到 0~2，减 1 就变成 -1~1。

Y 轴同理，但屏幕 Y 从上往下增长，和 3D 世界相反，所以要加负号翻转。
:::

## 二、intersect 返回什么？

```js
const hits = raycaster.intersectObjects(objects);
```

返回一个数组，按**距离从近到远**排序。每个元素包含：

| 属性 | 说明 |
|---|---|
| `distance` | 射线起点到交点的距离 |
| `point` | 交点的世界坐标（Vector3） |
| `object` | 被击中的物体 |
| `face` | 被击中的三角面（含法线） |
| `uv` | 交点处的纹理坐标（做贴图交互很有用） |

## 三、悬停高亮（完整例子）

```js
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(-10, -10); // 初始放在屏幕外
let hovered = null;

addEventListener('pointermove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});

renderer.setAnimationLoop(() => {
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickableObjects, false);
  const current = hits.length ? hits[0].object : null;

  if (current !== hovered) {
    if (hovered) hovered.material.emissive.set(0x000000);
    if (current) current.material.emissive.set(0x333333);
    hovered = current;
    document.body.style.cursor = current ? 'pointer' : 'default';
  }

  renderer.render(scene, camera);
});
```

::: tip 小贴士
用 `emissive`（自发光）来做高亮，比直接改 `color` 好看——它是在原色上叠加光，不会破坏物体本身的材质感。

性能提示：不要在 `pointermove` 里做射线检测（鼠标移动事件可能一秒触发上百次）。像上面这样**只在动画循环里检测一次**，配合一个 `needsUpdate` 标记更好。
:::

## 四、点击拾取

```js
addEventListener('click', () => {
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(clickableObjects);
  if (hits.length) {
    console.log('你点了：', hits[0].object.name);
  }
});
```

::: plain 大白话时间
「悬停高亮」和「点击拾取」原理完全一样，只是触发时机不同。

实际项目里，把可点击的物体放进一个单独的数组（`clickableObjects`），而不是每次都检测 `scene.children`——这样更快，也避免误中地面、灯光这些不该点的东西。
:::

## 五、射线其他用法

```js
// 设置射线的起点和方向（不从相机出发）
raycaster.set(origin, direction);

// 限制检测距离
raycaster.near = 0;
raycaster.far = 10;

// 只检测某一类物体：用 Layers
raycaster.layers.set(1);
mesh.layers.enable(1);
```

::: tip 小贴士
射线拾取还能做很多事：
- **角色贴地**：从角色脚底向下发射线，检测地面高度
- **射击游戏**：从枪口发射线，判断是否命中敌人
- **测量工具**：点击两点，计算距离
:::
</script>

<!-- ---------- 11 纹理 ---------- -->
<script type="text/markdown" data-id="textures" data-title="11 · 纹理贴图" data-group="进阶特性">
# 纹理贴图：让物体有细节

纯色材质看多了会腻。真实世界有木纹、金属划痕、布料的纤维——这些靠**纹理（Texture）**实现。

::: plain 大白话时间
材质（Material）决定物体「是什么料子」，纹理（Texture）就是往料子上**印的图案**。

比如一个木头箱子：Material 说「这是木头，粗糙，不反光」，Texture 说「表面有年轮纹路」。两者配合才有真实感。
:::

## 一、加载图片纹理

```js
const loader = new THREE.TextureLoader();

// 方式一：回调
loader.load('/textures/wood.jpg', (texture) => {
  material.map = texture;
  material.needsUpdate = true; // 重要！改了贴图要通知材质更新
});

// 方式二：先创建空纹理，加载完自动填充
const texture = loader.load('/textures/wood.jpg');
const material = new THREE.MeshStandardMaterial({ map: texture });
```

::: warning 注意
图片路径在 `file://` 下通常加载失败——又是本地服务器的问题。用 Live Server 或 Vite 就不会有这个问题。

加载跨域图片时，对方服务器必须允许 CORS，否则会报错。可以设 `loader.setCrossOrigin('anonymous')`。
:::

## 二、常见贴图类型

```js
const material = new THREE.MeshStandardMaterial({
  map: colorTexture,           // 颜色贴图（基础色）
  normalMap: normalTexture,    // 法线贴图（凹凸细节，不改几何体）
  roughnessMap: roughTexture,  // 粗糙度贴图（哪里亮哪里哑）
  metalnessMap: metalTexture,  // 金属度贴图
  aoMap: aoTexture,            // 环境光遮蔽（缝隙变暗）
  emissiveMap: glowTexture,    // 自发光贴图
  displacementMap: dispTexture,// 位移贴图（真的改变顶点，很贵）
  alphaMap: alphaTexture       // 透明度贴图
});
```

::: plain 大白话时间
最常用的是前三个：

- **map（颜色贴图）**：就是「印上去的画」
- **normalMap（法线贴图）**：骗眼睛用的——几何体还是光滑的，但光照计算时假装表面有凹凸。比真的建模便宜太多，游戏里的砖墙、皮肤纹理都靠它
- **roughnessMap（粗糙度贴图）**：让同一物体有的地方反光、有的地方不反光，比如旧金属上的锈斑
:::

### 法线贴图示例

```js
const loader = new THREE.TextureLoader();
const colorMap = loader.load('/brick_color.jpg');
const normalMap = loader.load('/brick_normal.jpg');

colorMap.colorSpace = THREE.SRGBColorSpace;  // 颜色贴图要设 sRGB
// normalMap 不用设，保持线性空间（默认）

const wall = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 5),
  new THREE.MeshStandardMaterial({
    map: colorMap,
    normalMap: normalMap,
    normalScale: new THREE.Vector2(1, 1) // 凹凸强度
  })
);
```

::: warning 注意
**颜色贴图**（map）要设置 `colorSpace = THREE.SRGBColorSpace`，否则颜色会偏暗/偏亮。

**数据贴图**（normalMap、roughnessMap 等）不要设置——它们是数学数据，不是颜色，用线性空间才对。
:::

## 三、纹理的常用属性

```js
texture.wrapS = THREE.RepeatWrapping;   // 水平方向重复
texture.wrapT = THREE.RepeatWrapping;   // 垂直方向重复
texture.repeat.set(4, 4);              // 重复 4×4 次
texture.offset.set(0.5, 0);            // 偏移
texture.rotation = Math.PI / 4;        // 旋转
texture.center.set(0.5, 0.5);          // 旋转中心
texture.flipY = false;                 // 翻转 Y（某些模型格式需要）
texture.anisotropy = renderer.capabilities.getMaxAnisotropy(); // 斜视角更清晰
```

::: plain 大白话时间
`RepeatWrapping` 就像**铺瓷砖**：一张图不够大，就重复贴。

地板、墙面用这个特别合适——一张 512px 的砖块图，重复 20 次就能铺满整个地板，比用一张 10000px 的大图省内存多了。
:::

## 四、程序化生成纹理

没有图片素材？用 Canvas 画一个：

```js
const canvas = document.createElement('canvas');
canvas.width = canvas.height = 256;
const ctx = canvas.getContext('2d');

// 画个棋盘格
for (let i = 0; i < 8; i++) {
  for (let j = 0; j < 8; j++) {
    ctx.fillStyle = (i + j) % 2 ? '#ffffff' : '#42b883';
    ctx.fillRect(i * 32, j * 32, 32, 32);
  }
}

const texture = new THREE.CanvasTexture(canvas);
texture.colorSpace = THREE.SRGBColorSpace;
texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
texture.repeat.set(4, 4);

const material = new THREE.MeshStandardMaterial({ map: texture });
```

::: tip 小贴士
CanvasTexture 很适合做：文字标签、动态更新内容（比如 3D 场景里显示实时数据）、简单的程序化图案。
:::

## 五、环境贴图（反射）

让金属物体反射周围环境：

```js
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

new RGBELoader().load('/hdri/studio.hdr', (texture) => {
  texture.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = texture;   // 给所有物体提供环境反射
  // scene.background = texture; // 也可以顺便当背景
});
```

::: plain 大白话时间
金属球为什么看起来是「金属」？因为它反射周围的东西。

没有环境贴图时，金属材质看起来就是一团黑或灰。`scene.environment` 给它一张「周围世界的照片」，反射立刻真实起来。

想快速看到效果，可以用 `RoomEnvironment`（Three.js 自带的示例环境）：

```js
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment()).texture;
```
:::
</script>

<!-- ---------- 12 加载模型 ---------- -->
<script type="text/markdown" data-id="models" data-title="12 · 加载外部模型" data-group="进阶特性">
# 加载外部模型

现实项目不可能全靠手搓立方体。真实模型通常用 Blender、Maya、Cinema4D 等软件做好，再导出成 3D 文件给网页用。

## 一、格式选择：GLTF 是王道

| 格式 | 说明 | 推荐度 |
|---|---|---|
| **GLTF / GLB** | 现代 Web 3D 标准，体积小、加载快、支持材质动画 | ⭐⭐⭐⭐⭐ |
| OBJ | 老格式，只有几何体，没有材质动画 | ⭐⭐ |
| FBX | 功能全但不是网页原生格式，需要先转换 | ⭐ |
| STL | 3D 打印用，只有几何 | ⭐ |

::: plain 大白话时间
**GLB 就是 3D 世界里的 JPG**——一个文件打包了模型、材质、贴图、动画，浏览器加载特别快。

GLTF 有两种形式：`.gltf`（文本 JSON + 外部贴图文件）和 `.glb`（二进制，全部打包成一个文件）。**日常用 GLB 最省事。**
:::

## 二、GLTFLoader 基本用法

```js
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const loader = new GLTFLoader();

loader.load(
  '/models/robot.glb',
  (gltf) => {
    const model = gltf.scene;
    scene.add(model);
  },
  (progress) => {
    // 加载进度
    console.log('已加载', (progress.loaded / progress.total * 100) + '%');
  },
  (error) => {
    console.error('模型加载失败：', error);
  }
);
```

## 三、调整模型大小与位置

不同软件导出的模型尺度千差万别（有的 0.01 单位大，有的 1000 单位大）。加载后通常需要调整：

```js
loader.load('/model.glb', (gltf) => {
  const model = gltf.scene;

  // 自动计算包围盒，缩放到合适大小
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const maxDim = Math.max(size.x, size.y, size.z);
  const scale = 2 / maxDim;  // 让最大边变成 2 个单位
  model.scale.setScalar(scale);

  // 居中
  model.position.sub(center.multiplyScalar(scale));

  // 开启阴影
  model.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;
    }
  });

  scene.add(model);
});
```

::: plain 大白话时间
这段代码在做一件很实用的事：**不管模型原本多大，都自动缩放到统一大小并居中。**

`Box3.setFromObject()` 会算出模型的「外接盒子」——能装下整个模型的最小长方体。拿到它的尺寸和中心点，就能算缩放比例、把模型挪到原点。

做产品展示时这段代码几乎是标配。
:::

## 四、播放模型自带动画

BLender 导出的 GLB 可以带动画（走路、开门等）：

```js
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let mixer, actions;

loader.load('/models/character.glb', (gltf) => {
  scene.add(gltf.scene);

  // AnimationMixer 是动画播放器
  mixer = new THREE.AnimationMixer(gltf.scene);

  // gltf.animations 是模型里所有的动画片段
  actions = {};
  gltf.animations.forEach(clip => {
    actions[clip.name] = mixer.clipAction(clip);
  });

  // 播放第一个动画
  actions[gltf.animations[0].name].play();
});

// 在动画循环里更新（别忘了 delta！）
const timer = new THREE.Timer();
renderer.setAnimationLoop(() => {
  timer.update();
  const delta = timer.getDelta();

  if (mixer) mixer.update(delta);

  renderer.render(scene, camera);
});
```

### 动画切换

```js
// 从走路切换到跑步，平滑过渡 0.5 秒
actions.walk.fadeOut(0.5);
actions.run.reset().setEffectiveWeight(1).fadeIn(0.5).play();
```

## 五、加载管理器（LoadingManager）

统一处理多个资源的加载状态：

```js
const manager = new THREE.LoadingManager();

manager.onStart = (url, loaded, total) => console.log('开始加载');
manager.onProgress = (url, loaded, total) => {
  console.log(`加载进度：${loaded}/${total}`);
  // 更新进度条 UI
};
manager.onLoad = () => console.log('全部加载完成！');
manager.onError = (url) => console.error('加载失败：' + url);

const gltfLoader = new GLTFLoader(manager);
const textureLoader = new THREE.TextureLoader(manager);

gltfLoader.load('/model.glb', ...);
textureLoader.load('/texture.jpg', ...);
```

::: plain 大白话时间
`LoadingManager` 就像个**收货总管**。你同时订了好几个包裹（模型、贴图），它帮你盯着：到货几个了、有没有丢件、什么时候全到齐。

做加载进度条、加载完成再开始动画，都靠它。
:::

## 六、DRACO 压缩模型

大型模型可以用 DRACO 压缩，体积能小 90%：

```js
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const draco = new DRACOLoader();
draco.setDecoderPath('/draco/');  // 解码器文件，从 three/examples/jsm/libs/draco 复制
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

loader.load('/models/compressed.glb', (gltf) => scene.add(gltf.scene));
```

::: warning 注意
DRACO 需要在 Blender 导出时勾选压缩，并且要部署解码器文件。模型小的时候没必要折腾——压缩和解压本身也有成本。
:::
</script>

<!-- ---------- 13 后期处理 ---------- -->
<script type="text/markdown" data-id="postprocessing" data-title="13 · 后期处理" data-group="进阶特性">
# 后期处理：给画面加滤镜

后期处理（Post-processing）就是：**先把场景渲染成一张图，再对这张图做加工，最后显示出来。**

::: plain 大白话时间
就像手机拍照：拍完还能加滤镜、磨皮、调色、加暗角。

Three.js 里也一样——画面先渲染到一张「离屏画布」，然后一串「滤镜」依次处理，最后才输出到屏幕。发光、景深、描边这些效果都靠它。
:::

## 一、EffectComposer 基础套装

```js
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// 1. 创建合成器
const composer = new EffectComposer(renderer);

// 2. 第一个 Pass：渲染场景（必须有）
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

// 3. 中间可以加各种效果 Pass
// composer.addPass(bloomPass);

// 4. 最后一个 Pass：输出到屏幕（r152+ 推荐加上）
const outputPass = new OutputPass();
composer.addPass(outputPass);

// 渲染时用 composer，不用 renderer
renderer.setAnimationLoop(() => {
  composer.render();
});
```

::: warning 注意
用了 `EffectComposer` 后，要调用 `composer.render()` 而不是 `renderer.render()`。

r152 之后要加 `OutputPass` 做最终的颜色空间转换和色调映射——少了它画面会偏暗或偏亮。
:::

## 二、泛光 Bloom（最常用）

让画面中明亮的部分「发光」，霓虹灯、能量条、发光按钮全靠它：

```js
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  1.5,   // strength 强度
  0.4,   // radius 半径（光晕扩散范围）
  0.85   // threshold 阈值（亮度超过这个值的才发光）
);
composer.addPass(bloomPass);
```

::: plain 大白话时间
`threshold` 是关键：它决定「多亮才算亮」。

设 0.85，只有画面中最亮的 15% 区域会发光。想让更多东西发光，把 threshold 调低；想只让特别亮的部分发光，调高。

配合 `MeshBasicMaterial` 用纯白/亮色材质做发光物体，效果最好。
:::

### 选择性泛光（高级）

让只有特定物体发光，其他不发光——用两层场景渲染 + 亮度差合成。代码较长，官方示例 `webgl_postprocessing_unreal_bloom_selective.html` 有完整实现。

## 三、其他常用 Pass

```js
// 景深：模拟相机对焦，远处模糊
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
const bokeh = new BokehPass(scene, camera, {
  focus: 10,      // 对焦距离
  aperture: 0.025,// 光圈（越大背景越糊）
  maxblur: 0.01
});

// 描边：给物体加轮廓线
import { OutlinePass } from 'three/addons/postprocessing/OutlinePass.js';
const outline = new OutlinePass(new THREE.Vector2(w, h), scene, camera);
outline.selectedObjects = [selectedMesh]; // 要描边的物体
outline.edgeStrength = 3;
outline.edgeGlow = 1;
outline.visibleEdgeColor.set('#42b883');

// FXAA / SMAA：抗锯齿
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
const fxaa = new ShaderPass(FXAAShader);
fxaa.material.uniforms['resolution'].value.set(1/w, 1/h);

// 胶片颗粒、色调、暗角等
import { FilmPass } from 'three/addons/postprocessing/FilmPass.js';
const film = new FilmPass(0.35, 0.025, 648, false);
```

| Pass | 效果 | 性能开销 |
|---|---|---|
| UnrealBloomPass | 发光 | 中高 |
| BokehPass | 景深 | 高 |
| OutlinePass | 描边 | 中 |
| FXAAShader | 抗锯齿 | 低 |
| FilmPass | 胶片颗粒 | 低 |
| GlitchPass | 故障特效 | 低 |

## 四、性能建议

::: plain 大白话时间
后期处理是**逐像素**操作的——每个 Pass 都要把整张图过一遍。1920×1080 的屏幕有 200 多万个像素，串 5 个 Pass 就是 1000 万次计算。

所以：**效果要克制，别堆太多 Pass。** 两个就够了，多了手机直接卡死。
:::

- Pass 数量控制在 2~3 个以内
- 移动端可以动态关闭后期处理
- 用 `composer.setSize()` 处理窗口变化
- 低性能设备可以降低渲染分辨率：`renderer.setPixelRatio(1)`
</script>

<!-- ---------- 14 着色器 ---------- -->
<script type="text/markdown" data-id="shaders" data-title="14 · 着色器入门" data-group="进阶特性">
# 着色器 Shader：从「会用」到「会创造」

前面所有材质都是 Three.js 提供的「成品」。想做水波、火焰、溶解、全息投影这些独特效果，就得自己写**着色器**。

::: plain 大白话时间
着色器是运行在 **GPU 上的小程序**，它告诉显卡：「每个像素应该是什么颜色」。

普通程序在 CPU 上跑，一次算一个东西；着色器在 GPU 上跑，**几百万个像素同时算**——这就是它能实时渲染 3D 的原因。
:::

## 一、着色器的两种类型

| 类型 | 英文名 | 作用 | 运行次数 |
|---|---|---|---|
| 顶点着色器 | Vertex Shader | 决定顶点在哪 | 每个顶点一次 |
| 片元着色器 | Fragment Shader | 决定像素什么颜色 | 每个像素一次 |

::: plain 大白话时间
想象画画：

1. **顶点着色器**先摆好画板上的「骨架」（三角形的三个角在哪）
2. **片元着色器**再给骨架内部的每一个像素「上色」

两步配合，就画出了一张图。
:::

## 二、ShaderMaterial 最简例子

```js
const material = new THREE.ShaderMaterial({
  // 传给着色器的自定义数据（uniform = 全局变量）
  uniforms: {
    uTime: { value: 0 },
    uColor: { value: new THREE.Color(0x42b883) }
  },

  vertexShader: `
    varying vec2 vUv;

    void main() {
      vUv = uv;  // 把 UV 坐标传给片元着色器
      // 标准变换：把顶点从本地坐标变成屏幕坐标
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,

  fragmentShader: `
    uniform float uTime;
    uniform vec3 uColor;
    varying vec2 vUv;

    void main() {
      // 用 sin 波做个上下流动的颜色渐变
      float wave = sin(vUv.y * 10.0 + uTime * 2.0) * 0.5 + 0.5;
      vec3 color = uColor * wave;
      gl_FragColor = vec4(color, 1.0);
    }
  `
});

// 动画循环里更新时间
renderer.setAnimationLoop(() => {
  material.uniforms.uTime.value = performance.now() / 1000;
  renderer.render(scene, camera);
});
```

## 三、三个关键概念

### uniform

从 JavaScript 传给着色器的**全局变量**，所有顶点/像素共享同一个值。常用于时间、颜色、鼠标位置。

```js
uniforms: {
  uTime: { value: 0 },           // float
  uColor: { value: new THREE.Color('red') }, // vec3
  uTexture: { value: texture }   // sampler2D
}
```

::: plain 大白话时间
`uniform` 是 JS 和 GPU 之间的**传话筒**。你想让 GPU 知道「现在是第几秒」，就通过 uniform 传进去。

命名习惯加 `u` 前缀（`uTime`、`uColor`），一眼就能认出是 uniform。
:::

### varying

顶点着色器传给片元着色器的**桥梁数据**。最常用的是 `uv`（纹理坐标）和 `normal`（法线）。

```js
// 顶点着色器
varying vec2 vUv;
vUv = uv;

// 片元着色器
varying vec2 vUv;  // 名字必须一致
```

### GLSL 基础类型

```glsl
float  // 浮点数
vec2   // 二维向量 (x, y)
vec3   // 三维向量 (x, y, z) 或颜色 (r, g, b)
vec4   // 四维向量 (x, y, z, w) 或颜色 (r, g, b, a)
mat4   // 4x4 矩阵
sampler2D // 纹理
```

常用函数：`sin()`, `cos()`, `mix()`, `smoothstep()`, `clamp()`, `length()`, `normalize()`, `fract()`

## 四、实用效果示例

### 波纹效果

```glsl
// 片元着色器核心
float dist = distance(vUv, vec2(0.5));
float wave = sin(dist * 30.0 - uTime * 5.0) * 0.5 + 0.5;
vec3 color = mix(colorA, colorB, wave);
gl_FragColor = vec4(color, 1.0);
```

### 溶解效果

```glsl
// 用噪声纹理决定哪些像素消失
float noise = texture2D(uNoise, vUv).r;
if (noise < uProgress) discard;  // 丢弃像素

// 边缘发光
float edge = smoothstep(uProgress, uProgress + 0.1, noise);
vec3 color = mix(glowColor, baseColor, edge);
```

::: tip 小贴士
`discard` 会直接丢弃当前像素（不绘制），做溶解、镂空效果很方便。
:::

## 五、Node Material（WebGPU 新方向）

r187 里，Three.js 主推的 **WebGPURenderer** 提供了新的 **Node Material** 系统——用 JavaScript 拼装节点来写材质，不用直接写 GLSL：

```js
import * as THREE from 'three/webgpu';
import { color, uv, sin, time, mix, vec3 } from 'three/tsl';

const material = new THREE.MeshBasicNodeMaterial();
const wave = sin(uv().y.mul(10).add(time.mul(2))).mul(0.5).add(0.5);
material.colorNode = mix(color(0x42b883), color(0xff0000), wave);
```

::: plain 大白话时间
传统 ShaderMaterial 要写 GLSL 字符串（像另一门语言）。Node Material 让你用 **JavaScript 函数拼装**效果——`sin()`、`mix()` 这些都能像搭积木一样组合。

对不熟悉 GLSL 的 JS 开发者友好很多。这是未来方向，但传统 ShaderMaterial 依然完全可用。
:::

## 六、学习建议

::: warning 注意
着色器有一定门槛，别指望一天学会。建议路线：

1. 先改现成 shader 的参数，看效果变化
2. 理解 `uv`、`uniform`、`varying` 三个概念
3. 学会用 `sin/cos/mix/smoothstep` 做基本图形
4. 去 Shadertoy 网站看别人的作品和源码
:::
</script>

<script type="text/markdown" data-id="particles" data-title="15 · 粒子系统" data-group="进阶特性">
# 粒子系统：星空、烟雾、魔法特效

粒子就是一堆**小点**。几千几万个点一起动，就能做出星空、雪花、烟花、萤火虫等效果。

::: plain 大白话时间
一个点渲染起来很便宜。一万个点同时渲染，比一万个立方体快得多——因为点不需要复杂的几何体和光照计算。

所以特效领域有个潜规则：**能用粒子就别用模型。**
:::

## 一、Points 基本用法

```js
// 1. 准备顶点数据：每个粒子 3 个坐标
const count = 1000;
const positions = new Float32Array(count * 3);

for (let i = 0; i < count; i++) {
  positions[i * 3]     = (Math.random() - 0.5) * 10; // x
  positions[i * 3 + 1] = (Math.random() - 0.5) * 10; // y
  positions[i * 3 + 2] = (Math.random() - 0.5) * 10; // z
}

// 2. 创建 BufferGeometry
const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// 3. 粒子材质
const material = new THREE.PointsMaterial({
  color: 0x42b883,
  size: 0.05,          // 点的大小
  sizeAttenuation: true, // 远小近大（透视）
  transparent: true,
  opacity: 0.8
});

// 4. 创建粒子系统
const particles = new THREE.Points(geometry, material);
scene.add(particles);
```

## 二、让粒子动起来

直接改顶点数据，然后标记需要更新：

```js
const positions = geometry.attributes.position.array;

renderer.setAnimationLoop(() => {
  for (let i = 0; i < count; i++) {
    positions[i * 3 + 1] += 0.01; // 每个粒子往上飘

    // 飘出范围后回到底部
    if (positions[i * 3 + 1] > 5) {
      positions[i * 3 + 1] = -5;
    }
  }

  geometry.attributes.position.needsUpdate = true; // 关键！
  renderer.render(scene, camera);
});
```

::: warning 注意
改完顶点数据必须设 `needsUpdate = true`，否则 GPU 不知道数据变了，画面不会更新。

粒子数很多时，每帧遍历所有粒子改位置会吃 CPU。上万粒子建议用着色器在 GPU 上算（进阶内容）。
:::

## 三、给粒子上色

```js
const colors = new Float32Array(count * 3);
for (let i = 0; i < count; i++) {
  const c = new THREE.Color().setHSL(Math.random(), 1, 0.5);
  colors[i * 3]     = c.r;
  colors[i * 3 + 1] = c.g;
  colors[i * 3 + 2] = c.b;
}
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const material = new THREE.PointsMaterial({
  size: 0.1,
  vertexColors: true  // 开启顶点颜色
});
```

## 四、自定义粒子形状

默认的点是方块。用贴图可以让它变圆、变星光：

```js
// 画个圆形渐变
const canvas = document.createElement('canvas');
canvas.width = canvas.height = 64;
const ctx = canvas.getContext('2d');
const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
grad.addColorStop(0, 'rgba(255,255,255,1)');
grad.addColorStop(1, 'rgba(255,255,255,0)');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, 64, 64);

const texture = new THREE.CanvasTexture(canvas);

const material = new THREE.PointsMaterial({
  size: 0.2,
  map: texture,          // 用贴图
  transparent: true,
  depthWrite: false,     // 关闭深度写入，避免透明粒子互相遮挡
  blending: THREE.AdditiveBlending // 叠加混合，发光效果
});
```

::: plain 大白话时间
`AdditiveBlending`（叠加混合）是做发光特效的秘密武器——多个粒子重叠时颜色会**相加**，越叠越亮，像真的光一样。

配合 `depthWrite: false` 使用，否则后面的粒子会被前面的「挡住」，光晕效果就没了。
:::

## 五、实战：星空背景

```js
const count = 3000;
const positions = new Float32Array(count * 3);
const colors = new Float32Array(count * 3);

for (let i = 0; i < count; i++) {
  // 球壳上随机分布
  const r = 50 + Math.random() * 50;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);

  positions[i*3]     = r * Math.sin(phi) * Math.cos(theta);
  positions[i*3 + 1] = r * Math.cos(phi);
  positions[i*3 + 2] = r * Math.sin(phi) * Math.sin(theta);

  const c = new THREE.Color().setHSL(0.6 + Math.random() * 0.1, 0.5, 0.6 + Math.random() * 0.4);
  colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const stars = new THREE.Points(geo, new THREE.PointsMaterial({
  size: 0.8,
  vertexColors: true,
  sizeAttenuation: true,
  transparent: true,
  depthWrite: false
}));
scene.add(stars);

// 缓慢旋转整个星空
renderer.setAnimationLoop(() => {
  stars.rotation.y += 0.0002;
  renderer.render(scene, camera);
});
```
</script>

<!-- ---------- 16 性能优化 ---------- -->
<script type="text/markdown" data-id="performance" data-title="16 · 性能优化" data-group="进阶特性">
# 性能优化：让页面不卡

3D 项目最怕「卡」。这一章整理最常见的优化手段。

::: plain 大白话时间
显卡每秒能画的三角形数量是有限的。优化的核心思想就两条：

1. **少画**：看不见的别画，重复的合并画
2. **画简单点**：远处用简化模型，能用贴图骗的就别真建模型
:::

## 一、先测量，再优化

```js
// 渲染信息
console.log(renderer.info.render.calls);      // draw call 次数（最重要！）
console.log(renderer.info.render.triangles);  // 三角形数量
console.log(renderer.info.memory.geometries); // 几何体数量
console.log(renderer.info.memory.textures);   // 纹理数量
```

::: tip 关键指标
**Draw Call（绘制调用）** 是最关键的性能指标。每个 Mesh 至少一次 draw call。1000 个独立小立方体 = 1000 次调用，显卡会累死。

目标：控制在几百次以内。
:::

## 二、InstancedMesh：批量渲染相同物体

一万个相同物体，不用创建一万个 Mesh，用一个 `InstancedMesh`：

```js
const geometry = new THREE.BoxGeometry(0.1, 0.1, 0.1);
const material = new THREE.MeshStandardMaterial({ color: 0x42b883 });
const count = 10000;

const instanced = new THREE.InstancedMesh(geometry, material, count);
const dummy = new THREE.Object3D(); // 辅助对象，用来算变换矩阵

for (let i = 0; i < count; i++) {
  dummy.position.set(
    (Math.random() - 0.5) * 50,
    (Math.random() - 0.5) * 50,
    (Math.random() - 0.5) * 50
  );
  dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
  dummy.updateMatrix();
  instanced.setMatrixAt(i, dummy.matrix);
}

scene.add(instanced);
```

::: plain 大白话时间
`InstancedMesh` 就像**盖章**：几何体和材质只准备一份，然后告诉 GPU「把这个形状在 10000 个位置各画一遍」。

原本 10000 次 draw call，现在 1 次。性能提升是**几十倍**级别的。

草原上的草、森林里的树、满天星星——都该用它。
:::

### 给实例单独上色

```js
const color = new THREE.Color();
for (let i = 0; i < count; i++) {
  color.setHSL(Math.random(), 1, 0.5);
  instanced.setColorAt(i, color);
}
instanced.instanceColor.needsUpdate = true;
```

## 三、几何体合并

多个不同几何体合成一个，减少 draw call：

```js
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

const geometries = [];
for (let i = 0; i < 100; i++) {
  const geo = new THREE.BoxGeometry(1, 1, 1);
  geo.translate(i * 2, 0, 0); // 设置位置
  geometries.push(geo);
}

const merged = mergeGeometries(geometries);
const mesh = new THREE.Mesh(merged, material);
scene.add(mesh);
```

::: warning 注意
合并后的物体**不能再单独移动**——所有几何体变成一个整体了。适合合并静态景物（建筑、地板），不适合会动的角色。
:::

## 四、LOD（细节层级）

远处用简化模型，近处用精细模型：

```js
import { LOD } from 'three';

const lod = new THREE.LOD();

const highDetail = new THREE.Mesh(highGeo, material);  // 10000 面
const midDetail  = new THREE.Mesh(midGeo, material);   // 1000 面
const lowDetail  = new THREE.Mesh(lowGeo, material);   // 100 面

lod.addLevel(highDetail, 0);   // 0 米内用精细版
lod.addLevel(midDetail, 20);   // 20 米外用中等版
lod.addLevel(lowDetail, 50);   // 50 米外用简化版

scene.add(lod);
```

::: plain 大白话时间
LOD 是「**远看轮廓，近看细节**」。

一个远处的路人，你根本看不清他的脸，没必要渲染 10000 个面。Three.js 会根据距离自动切换模型版本，用户完全感知不到。
:::

## 五、视锥剔除

Three.js **默认开启**视锥剔除（frustum culling）——相机看不到的物体自动不渲染。

但有时需要关闭（比如粒子系统被意外剔除）：

```js
mesh.frustumCulled = false;
```

确保几何体有正确的包围盒：

```js
geometry.computeBoundingSphere();
```

## 六、纹理优化

- 图片尺寸用 2 的幂（512、1024、2048）——GPU 处理最高效
- 用压缩纹理格式（KTX2、Basis）——体积和显存都省
- 复用纹理，别重复加载同一张图
- 移动端限制纹理尺寸（2048 以下）

## 七、渲染器设置

```js
// 限制像素比（高清屏上很有效）
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

// 移动端降到 1
if (isMobile) renderer.setPixelRatio(1);

// 关闭不需要的特性
renderer.shadowMap.enabled = false;  // 不用阴影就关
renderer.antialias = false;          // 用后期 AA 时可以关
```

## 八、内存管理

```js
// 移除物体后要释放资源
scene.remove(mesh);
mesh.geometry.dispose();
mesh.material.dispose();
mesh.material.map?.dispose();

// 彻底销毁渲染器
renderer.dispose();
renderer.forceContextLoss();
```

::: warning 注意
`scene.remove()` 只是从场景里移除，**不会释放显存**。不调用 `dispose()` 的话，切换场景几次显存就爆了。这在做页面切换、SPA 路由时特别容易出问题。
:::

## 九、优化清单

| 问题 | 解决方案 |
|---|---|
| Draw call 太多 | InstancedMesh / 合并几何体 |
| 三角形太多 | 降低分段数 / LOD / 简化模型 |
| 纹理太大 | 压缩纹理 / 降低分辨率 |
| 后期处理卡 | 减少 Pass / 降低像素比 |
| 阴影卡 | 降低 mapSize / 减少投影灯 |
| 内存泄漏 | 及时 dispose() |
| 移动端卡 | 关阴影、降像素比、关后期 |
</script>

<script type="text/markdown" data-id="full-project" data-title="17 · 完整实战项目" data-group="实战与排错">
# 完整实战项目

把前面学的串起来，做一个能跑的完整场景。把 `index.html` 的 `<script type="module">` 换成下面这段（用 r187 + importmap 环境）：

```js
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ========== 1. 基础三件套 ==========
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 12, 35);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5, 4, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// ========== 2. 控制器 ==========
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.target.set(0, 0.5, 0);
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;

// ========== 3. 光照 ==========
scene.add(new THREE.HemisphereLight(0x88bbff, 0x222233, 1.2));

const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(5, 10, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -12;
sun.shadow.camera.right = 12;
sun.shadow.camera.top = 12;
sun.shadow.camera.bottom = -12;
scene.add(sun);

// ========== 4. 地面 ==========
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0x252540, roughness: 0.9 })
);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ========== 5. 主角：发光球 ==========
const ball = new THREE.Mesh(
  new THREE.IcosahedronGeometry(1, 4),
  new THREE.MeshStandardMaterial({
    color: 0x42b883,
    roughness: 0.2,
    metalness: 0.6,
    emissive: 0x0a3d2a,
    emissiveIntensity: 0.5,
    flatShading: true
  })
);
ball.position.y = 1.2;
ball.castShadow = true;
scene.add(ball);

// ========== 6. 环绕的小方块（InstancedMesh） ==========
const cubeCount = 60;
const cubes = new THREE.InstancedMesh(
  new THREE.BoxGeometry(0.18, 0.18, 0.18),
  new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 }),
  cubeCount
);
cubes.castShadow = true;
const dummy = new THREE.Object3D();
const color = new THREE.Color();
for (let i = 0; i < cubeCount; i++) {
  dummy.position.set(
    (Math.random() - 0.5) * 20,
    Math.random() * 6,
    (Math.random() - 0.5) * 20
  );
  dummy.rotation.set(Math.random() * 3, Math.random() * 3, 0);
  dummy.updateMatrix();
  cubes.setMatrixAt(i, dummy.matrix);
  cubes.setColorAt(i, color.setHSL(Math.random(), 0.7, 0.6));
}
scene.add(cubes);

// ========== 7. 星空粒子 ==========
const starCount = 800;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i*3]     = (Math.random() - 0.5) * 60;
  starPos[i*3 + 1] = Math.random() * 30 + 5;
  starPos[i*3 + 2] = (Math.random() - 0.5) * 60;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
  color: 0xffffff, size: 0.15, transparent: true, opacity: 0.8
}));
scene.add(stars);

// ========== 8. 鼠标悬停交互 ==========
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(-10, -10);
addEventListener('pointermove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});

// ========== 9. 动画循环（r187 新写法） ==========
const timer = new THREE.Timer();
renderer.setAnimationLoop(() => {
  timer.update();
  const t = timer.getElapsed();

  ball.position.y = 1.2 + Math.sin(t * 1.5) * 0.4;
  ball.rotation.y = t * 0.3;
  ball.rotation.x = t * 0.15;
  stars.rotation.y = t * 0.01;

  // 悬停检测
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObject(ball);
  ball.material.emissiveIntensity = hits.length ? 1.5 : 0.5;
  document.body.style.cursor = hits.length ? 'pointer' : 'default';

  controls.update();
  renderer.render(scene, camera);
});

// ========== 10. 窗口自适应 ==========
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
```

::: plain 大白话时间
这 10 步看着吓人，其实每一段你都学过：

| 步骤 | 对应章节 |
|---|---|
| 三件套 | 第 3、4 章 |
| 控制器 | 第 9 章 |
| 光照阴影 | 第 7 章 |
| 主角 + 实例 | 第 5、16 章 |
| 粒子星空 | 第 15 章 |
| 鼠标交互 | 第 10 章 |
| 动画循环 | 第 8 章 |

**复杂的场景 = 简单模块堆起来。** 别被代码量吓到，一块块看就都认识了。
:::

## 怎么继续改造？

- 把 `IcosahedronGeometry` 换成 `TorusKnotGeometry`，看扭结旋转
- 给主角加载一个 GLB 模型（第 12 章）
- 加 Bloom 后期处理让它真的发光（第 13 章）
- 点击小方块让它飞走（第 10 章 + 数组记录位置）
- 换成自己的颜色主题

<script type="text/markdown" data-id="faq" data-title="18 · 常见问题排错" data-group="实战与排错">
# 常见问题排错

收集那些「明明写对了却跑不起来」的经典问题。

## 1. 画面一片黑

按顺序检查：

1. **控制台有报错吗？** F12 打开开发者工具，红色报错优先解决
2. **材质是不吃光的吗？** `MeshStandardMaterial` 没加灯就是黑的，先加 `HemisphereLight`
3. **物体在相机背后吗？** 检查 `camera.position` 和 `mesh.position`，相机默认朝 -Z 看
4. **物体太小/太远吗？** `camera.position.z = 5` 配 1 单位立方体正合适
5. **`far` 裁掉了吗？** 物体在 200 单位外但 `far=100`，当然看不见
6. **画布加到页面了吗？** 检查有没有 `document.body.appendChild(renderer.domElement)`
7. **动画循环调用了吗？** 只 `renderer.render()` 一次，物体不会动但至少该看见

::: tip 调试大招
把材质临时换成：

```js
new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true })
```

纯红 + 线框 + 不吃光。能看见红色线框 → 物体位置没问题，问题在光照或材质；看不见 → 问题在相机或渲染流程。
:::

## 2. 页面出现滚动条

```css
body { margin: 0; overflow: hidden; }
canvas { display: block; }
```

`canvas` 默认是行内元素，底部会有几像素空隙，`display: block` 能消掉。

## 3. 窗口缩放后画面变形

漏了 resize 处理（改相机参数后必须 `updateProjectionMatrix()`）：

```js
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix(); // 别忘！
  renderer.setSize(innerWidth, innerHeight);
});
```

## 4. 物体表面一闪一闪（z-fighting）

两个面**紧贴在一起**，显卡不知道该画谁。

::: plain 大白话时间
就像把两张纸完全叠在一起，从侧面看边缘会「打架」。

**解决**：稍微错开一点距离（比如 `z: 0.001`），或者调整相机的 `near`（别设成 0.00001 这种极小值），或者设 `polygonOffset`。
:::

```js
material.polygonOffset = true;
material.polygonOffsetFactor = -1;
```

## 5. 阴影有条纹（Shadow Acne）

```js
sun.shadow.bias = -0.0001;
sun.shadow.normalBias = 0.02; // 更推荐
```

::: warning 注意
bias 别设太大，否则影子会和物体「脱节」（叫 peter panning，像皮特潘的影子跑了）。慢慢微调，从 `-0.0001` 开始试。
:::

## 6. 直接双击 HTML 打不开

`type="module"` 在 `file://` 协议下会被浏览器拦。用 VS Code 的 Live Server，或执行 `npx serve` / `python -m http.server`。

## 7. 版本 API 对不上

你可能在看老教程。常见变更：

| 老写法 | 新写法（r187） | 变更版本 |
|---|---|---|
| `THREE.Geometry` | `BufferGeometry` | r125 移除 |
| `outputEncoding` | `outputColorSpace` | r152 |
| `new THREE.Clock()` | `new THREE.Timer()` | r183 废弃 |
| `PCFSoftShadowMap` | `PCFShadowMap` | r182 起废弃 |
| `encoding` on texture | `colorSpace` | r152 |

## 8. 旋转方向看着不对

Three.js 的旋转用**弧度**不是角度。

```js
mesh.rotation.y = Math.PI / 2;  // ✅ 90 度
mesh.rotation.y = 90;           // ❌ 转了 90 弧度
```

## 9. 改了材质颜色没反应

- 材质用了 `map` 贴图？贴图颜色会**乘以** `color`，色相会被染色。想要原色把 color 设为白色
- 共享材质？改一个全变（第 5 章讲过），用 `clone()`
- 忘了 `material.needsUpdate = true`？改贴图或某些属性后需要它

## 10. 性能越来越卡

- 在动画循环里 `new` 对象了？检查并移到外面
- 模型没做 LOD 或 InstancedMesh？
- 阴影/后期处理开太多？
- 切换场景后没 `dispose()`？

## 11. 纹理加载失败（CORS）

浏览器控制台报 `CORS policy` 错误：

- 图片服务器没开放跨域 → 换成本地图片
- 用图床 → 确认支持跨域
- `loader.setCrossOrigin('anonymous')` 有时能解决

## 12. 找不到某个 addon 模块

检查导入路径是不是 `three/addons/...`：

```js
// ✅ 正确
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ❌ 错误
import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
```

用 importmap 时必须配好 `three/addons/` 的映射（第 2 章有）。

::: tip 最后的建议
遇到问题时，**先把代码简化到最小可复现**——只留一个立方体、一盏灯。能跑通再一块块加回去，问题自然定位。

另外，搜索引擎搜英文关键词（"three.js black screen"、"three.js shadow acne"）通常比中文结果更靠谱，因为英文社区讨论量大得多。
:::
</script>

## 三、进阶路线图

### 阶段一：扎实基础（你现在在这）

- [x] 三件套、几何体、材质
- [x] 坐标变换、光照阴影
- [x] 动画循环、控制器、拾取交互
- [x] 纹理、模型加载
- [ ] 把第 17 章的完整项目亲手敲一遍

### 阶段二：做出作品

- 用 GLB 模型做一个产品展示页
- 加 Bloom 后期处理
- 做一个点击进入的 3D 小场景
- 部署上线（Vite build → 静态托管）

### 阶段三：深入原理

- 学习 GLSL 着色器，看懂 ShaderMaterial
- 理解 PBR 物理渲染（roughness/metalness 背后的数学）
- 学习 WebGPU 和 Node Material（r187 主推方向）
- 阅读 Three.js 源码（从 `WebGLRenderer.js` 开始）

### 阶段四：工程化

- 用 React Three Fiber（R3F）在 React 项目里写 Three.js
- 用 TresJS 在 Vue 项目里写 Three.js
- 性能分析与调优
- 大型场景的架构设计

## 四、框架集成

| 框架 | 库 | 适合 |
|---|---|---|
| React | React Three Fiber（@react-three/fiber） | React 项目 |
| Vue | TresJS（@tresjs/core） | Vue 项目 |
| Svelte | Threlte | Svelte 项目 |
| 原生 | Three.js 本身 | 任何项目 |

::: plain 大白话时间
这些库本质上是把 Three.js 的命令式 API 包装成各自框架的「组件式」写法。

比如原生写 `scene.add(mesh)`，在 Vue 里就写成 `<TresMesh />` 标签。**底层还是 Three.js**——所以先把原生学明白，用框架只是换种写法而已。
:::

## 五、r187 时代的新方向

::: tip 值得关注
- **WebGPURenderer**：已相对成熟，自动回退 WebGL 2，新项目可以考虑
- **Node Material / TSL**：用 JS 拼装着色器，替代手写 GLSL；r187 里 TSL 会自动把运算参数提升到共同类型，写起来更省心
- **GSplat（高斯泼溅）**：r186 新增 addon，做真实场景扫描重建
- **SunLight**：r186 新增，级联阴影，大场景户外光照更真实
- **r187 本版变化**：PMREM 环境贴图改用立方体渲染目标重建，IBL 照明质量更高；`MeshPhysicalMaterial` 加入 EON 粗糙漫反射 BRDF；新增 `Texture.mipmapsAutoUpdate` 和 WebGPU 深度-only 渲染目标；移除了 `CubeUVReflectionMapping`
:::

## 结语

::: plain 大白话时间
3D 这东西，**看着难，动手就那么回事**。

你现在已经掌握了最核心的那套东西：场景、相机、渲染器、网格、光照、动画循环。剩下的就是不停地写、不停地改、不停地看效果。

别怕写烂代码——第一个 3D 页面谁不是从「一片黑」开始的。去造点好玩的吧。🚀
:::

<script type="text/markdown" data-id="api-constants" data-title="API 01 · 全局约定与常量" data-group="API 速查手册">
# API 01 · 全局约定与常量

这一章是查手册的「字典前言」。后面所有 API 都会反复用到这些常量和写法，先集中列清楚。

## 一、版本

| 常量 | 类型 | 说明 |
|---|---|---|
| `THREE.REVISION` | `string` | 当前版本号，如 `"187"`（r187） |

## 二、颜色的四种写法

所有接受颜色参数的 API（`color`、`background`、`emissive` 等）都能用下面任意一种：

```js
new THREE.Color(0x42b883)      // 十六进制整数（最常用）
new THREE.Color('#42b883')     // CSS 十六进制字符串
new THREE.Color('rgb(66,184,131)') // RGB 字符串
new THREE.Color('steelblue')   // CSS 颜色名
new THREE.Color().setHSL(0.4, 0.6, 0.5) // HSL：色相/饱和度/亮度
new THREE.Color(1, 0.5, 0.2)   // 三个 0~1 的浮点数
```

::: plain 大白话时间
`0x` 开头是十六进制写法——`0x42b883` 就是 CSS 里的 `#42b883`。程序员喜欢用它，因为直接写在代码里不用加引号。
:::

## 三、材质渲染面 side

控制物体的哪个面被渲染。

| 常量 | 值 | 说明 |
|---|---|---|
| `THREE.FrontSide` | 0 | 只渲染正面（默认） |
| `THREE.BackSide` | 1 | 只渲染背面（从内部看球体时用） |
| `THREE.DoubleSide` | 2 | 正反面都渲染（平面、薄片必用） |

```js
material.side = THREE.DoubleSide;
```

::: warning 注意
平面（`PlaneGeometry`）默认正面朝 **+Z**。你从背面看它会「消失」——设 `DoubleSide` 或把它转过来即可。
:::

## 四、混合模式 blending

| 常量 | 说明 |
|---|---|
| `THREE.NoBlending` | 不混合，直接覆盖 |
| `THREE.NormalBlending` | 普通透明混合（默认） |
| `THREE.AdditiveBlending` | 加法混合，越叠越亮（发光特效） |
| `THREE.SubtractiveBlending` | 减法混合 |
| `THREE.MultiplyBlending` | 乘法混合，越叠越暗 |
| `THREE.CustomBlending` | 自定义，配合下面两组常量 |

**混合方程**（`blendEquation`）：

| 常量 | 说明 |
|---|---|
| `AddEquation` | 相加（默认） |
| `SubtractEquation` | 相减 |
| `ReverseSubtractEquation` | 反向相减 |
| `MinEquation` / `MaxEquation` | 取最小/最大 |

**混合因子**（`blendSrc` / `blendDst`）：

`ZeroFactor`、`OneFactor`、`SrcColorFactor`、`OneMinusSrcColorFactor`、`SrcAlphaFactor`、`OneMinusSrcAlphaFactor`、`DstColorFactor`、`OneMinusDstColorFactor`、`DstAlphaFactor`、`OneMinusDstAlphaFactor`、`SrcAlphaSaturateFactor`、`ConstantFactor`、`OneMinusConstantFactor`

```js
material.blending = THREE.CustomBlending;
material.blendEquation = THREE.AddEquation;
material.blendSrc = THREE.SrcAlphaFactor;
material.blendDst = THREE.OneMinusSrcAlphaFactor;
```

## 五、颜色空间 colorSpace

| 常量 | 说明 |
|---|---|
| `THREE.SRGBColorSpace` | sRGB，用于颜色贴图和最终输出（最常用） |
| `THREE.LinearSRGBColorSpace` | 线性空间，用于数据贴图（法线、粗糙度等） |
| `THREE.NoColorSpace` | 不转换，纯数据 |
| `THREE.DisplayP3ColorSpace` | P3 广色域 |

```js
colorMap.colorSpace = THREE.SRGBColorSpace;  // 颜色贴图
normalMap.colorSpace = THREE.NoColorSpace;   // 数据贴图
renderer.outputColorSpace = THREE.SRGBColorSpace;
```

::: plain 大白话时间
颜色贴图要设 sRGB，数据贴图**不要**设——这是新手最常踩的坑之一。记住：**能看见颜色的用 sRGB，存数学数据的不用。**
:::

## 六、色调映射 toneMapping

| 常量 | 说明 |
|---|---|
| `THREE.NoToneMapping` | 不做映射（默认） |
| `THREE.LinearToneMapping` | 线性 |
| `THREE.ReinhardToneMapping` | 柔和压暗高光 |
| `THREE.CineonToneMapping` | 电影感 |
| `THREE.ACESFilmicToneMapping` | 电影级，最常用 |
| `THREE.AgXToneMapping` | 更真实的色彩保留（较新） |
| `THREE.NeutralToneMapping` | 中性，颜色变化小 |
| `THREE.CustomToneMapping` | 自定义 |

```js
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2; // 曝光度
```

## 七、阴影类型

| 常量 | 说明 |
|---|---|
| `THREE.BasicShadowMap` | 硬阴影，最快，锯齿明显 |
| `THREE.PCFShadowMap` | 百分比滤波，柔化（r186 起推荐，默认） |
| `THREE.VSMShadowMap` | 方差阴影，更柔和但可能有漏光 |

::: warning 注意
`THREE.PCFSoftShadowMap` 在 r182（WebGL）和 r186（WebGPU）已被移除，现在 `PCFShadowMap` 本身就是柔化的。老教程里看到的这个常量别再用了。
:::

## 八、纹理包裹方式 wrapS / wrapT

| 常量 | 说明 |
|---|---|
| `THREE.ClampToEdgeWrapping` | 超出部分拉伸边缘像素（默认） |
| `THREE.RepeatWrapping` | 重复平铺 |
| `THREE.MirroredRepeatWrapping` | 镜像重复（像镜子翻转） |

## 九、纹理过滤 filter

| 常量 | 说明 |
|---|---|
| `THREE.NearestFilter` | 最近邻，像素风，最快 |
| `THREE.LinearFilter` | 线性插值，平滑 |
| `THREE.NearestMipmapNearestFilter` | 最近 mipmap + 最近邻 |
| `THREE.NearestMipmapLinearFilter` | 最近 mipmap + 线性 |
| `THREE.LinearMipmapNearestFilter` | 线性 mipmap + 最近邻 |
| `THREE.LinearMipmapLinearFilter` | 三线性过滤（默认，质量最好） |

```js
texture.magFilter = THREE.LinearFilter;
texture.minFilter = THREE.LinearMipmapLinearFilter;
```

## 十、纹理映射方式 mapping

| 常量 | 说明 |
|---|---|
| `THREE.UVMapping` | 普通 UV 贴图（默认） |
| `THREE.EquirectangularReflectionMapping` | 全景图反射（HDRI 常用） |
| `THREE.EquirectangularRefractionMapping` | 全景图折射 |
| `THREE.CubeReflectionMapping` | 立方体反射 |
| `THREE.CubeRefractionMapping` | 立方体折射 |

::: warning 注意
`THREE.CubeUVReflectionMapping` 在 r187 已被移除。用 `EquirectangularReflectionMapping` 即可，Three.js 内部会自动用 PMREM 转换。
:::

## 十一、像素数据类型 type

`UnsignedByteType`（默认）、`ByteType`、`ShortType`、`UnsignedShortType`、`IntType`、`UnsignedIntType`、`FloatType`、`HalfFloatType`

## 十二、缓冲区用途 usage

用于 `BufferAttribute.setUsage()`：

| 常量 | 说明 |
|---|---|
| `THREE.StaticDrawUsage` | 静态，几乎不变（默认） |
| `THREE.DynamicDrawUsage` | 频繁更新 |
| `THREE.StreamDrawUsage` | 每帧都变 |

```js
geometry.attributes.position.setUsage(THREE.DynamicDrawUsage);
```

## 十三、深度比较函数 depthFunc

`NeverDepth`、`AlwaysDepth`、`LessDepth`、`LessEqualDepth`（默认）、`EqualDepth`、`GreaterEqualDepth`、`GreaterDepth`、`NotEqualDepth`

## 十四、其他常用枚举速查

| 类别 | 常量 |
|---|---|
| 动画循环 | `THREE.LoopOnce`、`THREE.LoopRepeat`、`THREE.LoopPingPong` |
| 插值 | `THREE.InterpolateSmooth`、`InterpolateLinear`、`InterpolateDiscrete` |
| 曲线 | `THREE.CurvePath`、`CatmullRomCurve3`、`CubicBezierCurve3` |
| 键盘/鼠标 | 标准 DOM 事件值（详见控制器章节） |
</script>
