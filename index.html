# API 02 · Object3D 全参考

`Object3D` 是**所有物体的基类**——Mesh、Group、Camera、Light、Points 全都继承它。下面这些属性和方法，任何物体都能用。

::: plain 大白话时间
把 Object3D 想成「所有 3D 物体的身份证」。不管它是球、是灯、还是相机，都有位置、旋转、缩放，都能 add 子物体——因为它们是一家人。
:::

## 一、构造

```js
const obj = new THREE.Object3D();
```

没有参数。通常不直接实例化，而是用它派生的类。

## 二、属性

### 身份与层级

| 属性 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `id` | `number` | 自动递增 | 只读，全局唯一数字 ID |
| `uuid` | `string` | 自动生成 | 只读，UUID 字符串 |
| `name` | `string` | `''` | 名字，用于 `getObjectByName()` |
| `type` | `string` | `'Object3D'` | 只读，类类型标识 |
| `parent` | `Object3D` | `null` | 只读，父对象 |
| `children` | `Object3D[]` | `[]` | 只读，子对象数组 |

### 变换

| 属性 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `position` | `Vector3` | `(0,0,0)` | 局部位置 |
| `rotation` | `Euler` | `(0,0,0)` | 局部旋转（**弧度**） |
| `quaternion` | `Quaternion` | `(0,0,0,1)` | 局部旋转（四元数），与 rotation 同步 |
| `scale` | `Vector3` | `(1,1,1)` | 局部缩放 |
| `up` | `Vector3` | `(0,1,0)` | 「上方」方向，`lookAt()` 用它 |
| `matrix` | `Matrix4` | 单位矩阵 | 局部变换矩阵 |
| `matrixWorld` | `Matrix4` | 单位矩阵 | 世界变换矩阵（含所有父级） |
| `matrixAutoUpdate` | `boolean` | `true` | 每帧自动由 position/rotation/scale 重算 matrix |
| `matrixWorldAutoUpdate` | `boolean` | `true` | 自动更新世界矩阵 |

### 可见性与渲染

| 属性 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `visible` | `boolean` | `true` | `false` 时整个子树都不渲染 |
| `layers` | `Layers` | 第 0 层 | 渲染层，配合相机/射线的 layers |
| `renderOrder` | `number` | `0` | 同深度物体的绘制顺序（小的先画） |
| `frustumCulled` | `boolean` | `true` | 视锥外自动不渲染 |
| `castShadow` | `boolean` | `false` | 是否投射阴影 |
| `receiveShadow` | `boolean` | `false` | 是否接收阴影 |
| `userData` | `object` | `{}` | 任意自定义数据（不会被 JSON 序列化丢失） |

## 三、方法

### 添加 / 移除

| 方法 | 参数 | 返回 | 说明 |
|---|---|---|---|
| `add(...objects)` | `Object3D...` | `this` | 添加为子物体（可一次多个） |
| `remove(...objects)` | `Object3D...` | `this` | 移除子物体 |
| `clear()` | — | `this` | 移除所有子物体 |
| `attach(object)` | `Object3D` | `this` | 添加子物体但**保持世界变换不变** |

```js
group.add(mesh1, mesh2, mesh3);
group.remove(mesh1);
```

::: tip add vs attach
`add` 后子物体的 `position` 不变（相对父级），世界位置可能跳变。

`attach` 会自动调整局部坐标，让物体在屏幕上**原地不动**。做「把物体从一个组挪到另一个组」时用 `attach`。
:::

### 查找

| 方法 | 参数 | 返回 | 说明 |
|---|---|---|---|
| `getObjectById(id)` | `number` | `Object3D` | 按 id 查（含后代） |
| `getObjectByName(name)` | `string` | `Object3D` | 按 name 查第一个匹配的 |
| `getObjectByProperty(name, value)` | `string, any` | `Object3D` | 按任意属性查 |
| `getObjectsByProperty(name, value)` | `string, any` | `Object3D[]` | 返回所有匹配的 |
| `getWorldPosition(target)` | `Vector3` | `Vector3` | 写入世界坐标 |
| `getWorldQuaternion(target)` | `Quaternion` | `Quaternion` | 写入世界旋转 |
| `getWorldScale(target)` | `Vector3` | `Vector3` | 写入世界缩放 |
| `getWorldDirection(target)` | `Vector3` | `Vector3` | 写入世界朝向（+Z 方向） |

```js
const p = new THREE.Vector3();
mesh.getWorldPosition(p); // p 现在是世界坐标
```

::: warning 注意
`getWorld*` 系列方法内部会调用 `updateWorldMatrix(true, false)`，所以不手动更新矩阵也能拿到正确值。但要传入一个 target 对象来接收结果，不是返回值本身。
:::

### 坐标转换

| 方法 | 参数 | 返回 | 说明 |
|---|---|---|---|
| `worldToLocal(vector)` | `Vector3` | `Vector3` | 世界坐标 → 局部坐标（原地修改向量） |
| `localToWorld(vector)` | `Vector3` | `Vector3` | 局部坐标 → 世界坐标 |

### 朝向与移动

| 方法 | 参数 | 说明 |
|---|---|---|
| `lookAt(x, y, z)` | 三个数或 `Vector3` | 让物体的 +Z 轴指向目标 |
| `translateX/Y/Z(d)` | `number` | 沿**自身局部轴**移动 d 距离 |
| `translateOnAxis(axis, d)` | `Vector3, number` | 沿任意局部轴移动 |
| `rotateX/Y/Z(angle)` | `number`（弧度） | 绕**自身局部轴**旋转 |
| `rotateOnAxis(axis, angle)` | `Vector3, number` | 绕任意局部轴旋转 |
| `rotateOnWorldAxis(axis, angle)` | `Vector3, number` | 绕**世界轴**旋转 |
| `setRotationFromAxisAngle(axis, angle)` | `Vector3, number` | 用轴角设置旋转 |
| `setRotationFromEuler(euler)` | `Euler` | 用欧拉角设置旋转 |
| `setRotationFromQuaternion(q)` | `Quaternion` | 用四元数设置旋转 |

::: plain 大白话时间
`translateX(1)` 和 `position.x += 1` 不一样！

- `position.x += 1` 是沿**世界 X 轴**移动
- `translateX(1)` 是沿**物体自己的 X 轴**移动

物体转了 90 度后，自己的 X 轴可能指向世界的 Z 方向——这时两者结果完全不同。做飞船、角色移动时用 `translateX` 更符合直觉。
:::

### 遍历

| 方法 | 参数 | 说明 |
|---|---|---|
| `traverse(callback)` | `(obj) => void` | 遍历自身 + 所有后代 |
| `traverseVisible(callback)` | `(obj) => void` | 只遍历可见的 |
| `traverseAncestors(callback)` | `(obj) => void` | 遍历所有父级（不含自身） |

```js
scene.traverse(obj => {
  if (obj.isMesh) {
    obj.castShadow = true; // 给所有网格开阴影
  }
});
```

### 矩阵更新

| 方法 | 参数 | 说明 |
|---|---|---|
| `updateMatrix()` | — | 从 position/rotation/scale 重算 `matrix` |
| `updateMatrixWorld(force)` | `boolean` | 更新自身及子级的 `matrixWorld` |
| `updateWorldMatrix(updateParents, updateChildren)` | `boolean, boolean` | 精确控制更新范围 |

### 克隆与序列化

| 方法 | 参数 | 返回 | 说明 |
|---|---|---|---|
| `clone(recursive)` | `boolean`（默认 `true`） | `Object3D` | 克隆，`recursive=true` 时连子物体一起 |
| `copy(source, recursive)` | `Object3D, boolean` | `this` | 从源复制 |
| `toJSON(meta)` | `object` | `object` | 序列化为 JSON |

::: warning 注意
`clone()` 的几何体和材质是**共享引用**（浅拷贝）！改克隆体的材质颜色，原物体也会变。要完全独立得手动 `clone()` 材质：

```js
const c = mesh.clone();
c.material = mesh.material.clone();
```
:::

### 类型判断属性

不用 `instanceof`，用这些布尔标记更快：

| 属性 | 说明 |
|---|---|
| `isObject3D` | 所有 Object3D 都有 |
| `isMesh` / `isLine` / `isPoints` / `isSprite` | 各类物体 |
| `isCamera` / `isLight` | 相机 / 灯光 |
| `isScene` / `isGroup` / `isBone` | 场景 / 组 / 骨骼 |

```js
obj.traverse(o => {
  if (o.isMesh) { /* ... */ }
});
```

## 四、事件

Object3D 继承自 `EventDispatcher`：

| 方法 | 说明 |
|---|---|
| `addEventListener(type, fn)` | 监听事件 |
| `removeEventListener(type, fn)` | 移除监听 |
| `dispatchEvent(event)` | 触发事件 |

内置事件：`'added'`（被 add 时）、`'removed'`（被 remove 时）、`'childadded'`、`'childremoved'`（r152+）。

```js
mesh.addEventListener('added', () => console.log('进场景了'));
```
</script>

<script type="text/markdown" data-id="api-scene" data-title="API 03 · Scene / Group / Layers" data-group="API 速查手册">
# API 03 · Scene / Group / Layers

## 一、Scene（场景）

继承 `Object3D`，是所有物体的根容器。

### 构造

```js
const scene = new THREE.Scene();
```

### 特有属性

| 属性 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `background` | `Color \| Texture \| CubeTexture \| null` | `null` | 背景：纯色 / 全景图 / 立方体贴图 |
| `backgroundIntensity` | `number` | `1` | 背景亮度 |
| `backgroundBlurriness` | `number` | `0` | 背景模糊度（仅环境贴图，0~1） |
| `environment` | `Texture \| null` | `null` | 环境贴图，给所有 PBR 材质提供反射 |
| `environmentIntensity` | `number` | `1` | 环境光强度 |
| `environmentRotation` | `Euler` | `(0,0,0)` | 环境贴图旋转 |
| `fog` | `Fog \| FogExp2 \| null` | `null` | 雾效 |
| `overrideMaterial` | `Material \| null` | `null` | 强制所有物体用此材质渲染（调试用） |
| `autoUpdate` | `boolean` | `true` | 每帧自动更新场景矩阵 |
| `matrixWorldAutoUpdate` | `boolean` | `true` | 自动更新世界矩阵 |

```js
scene.background = new THREE.Color(0x1a1a2e);
scene.backgroundBlurriness = 0.3;
scene.environment = envTexture;
scene.environmentIntensity = 0.8;
scene.fog = new THREE.Fog(0x1a1a2e, 10, 50);
```

::: tip overrideMaterial 的妙用
设 `scene.overrideMaterial = new THREE.MeshDepthMaterial()` 能一键查看场景深度；设成线框材质能看所有物体的网格结构。调试神器。用完记得设回 `null`。
:::

### 继承的方法

`Scene` 没有特有方法，全部继承自 `Object3D`（见上一章）。

## 二、Fog / FogExp2（雾）

### Fog（线性雾）

```js
new THREE.Fog(color, near, far)
```

| 参数 | 类型 | 说明 |
|---|---|---|
| `color` | `Color` | 雾的颜色，通常和背景色一致 |
| `near` | `number` | 从多远开始起雾 |
| `far` | `number` | 到多远完全变成雾色 |

### FogExp2（指数雾）

```js
new THREE.FogExp2(color, density)
```

| 参数 | 类型 | 说明 |
|---|---|---|
| `color` | `Color` | 雾色 |
| `density` | `number` | 密度，越大雾越浓（常用 0.001~0.1） |

| 属性 | 说明 |
|---|---|
| `.name` | 名字 |
| `.color` | 雾颜色，可运行时改 |
| `.near` / `.far` | Fog 的起止距离 |
| `.density` | FogExp2 的密度 |

::: plain 大白话时间
线性雾是「10 米开始糊，50 米全糊」；指数雾是「越远越糊，没有明确终点」，更自然一些。
:::

## 三、Group（分组）

继承 `Object3D`，**没有任何新增属性或方法**。

它存在的意义是**语义分组**：把相关物体放一起，移动/旋转/删除整组。

```js
const car = new THREE.Group();
car.name = 'car';
car.add(body, wheel1, wheel2, ...);
scene.add(car);

car.position.set(0, 0, 5);   // 整车移动
car.rotation.y = Math.PI/2;  // 整车转向
```

## 四、Layers（渲染层）

控制「哪些物体被哪台相机看到」「哪些物体被射线检测到」。

### 构造

```js
const layer = new THREE.Layers(); // 默认在第 0 层
```

### 属性

| 属性 | 类型 | 说明 |
|---|---|---|
| `mask` | `number` | 32 位整数位掩码，每一位代表一个层（0~31） |

### 方法

| 方法 | 参数 | 返回 | 说明 |
|---|---|---|---|
| `set(channel)` | `number` | `this` | 只启用指定层（清掉其他） |
| `enable(channel)` | `number` | `this` | 启用某层 |
| `enableAll()` | — | `this` | 启用全部 32 层 |
| `toggle(channel)` | `number` | `this` | 切换某层开关 |
| `disable(channel)` | `number` | `this` | 禁用某层 |
| `disableAll()` | — | `this` | 禁用所有层 |
| `test(layers)` | `Layers` | `boolean` | 与另一 Layers 是否有交集 |

### 实战：分会场的物体

```js
// 物体放第 1 层
mesh.layers.set(1);

// 主相机默认在第 0 层，看不到它
// 让主相机也能看第 1 层：
camera.layers.enable(1);

// 或者专门用一台渲染第 1 层的相机
const layerCamera = camera.clone();
layerCamera.layers.set(1);
```

::: plain 大白话时间
`Layers` 就像**电视频道**。物体在特定频道播，相机要调到那个频道才能收到。

常见用途：
- 做「小地图」：主相机看所有物体，小地图相机只看第 1 层的标记点
- 做「编辑模式」：辅助线放第 2 层，只在编辑器里显示
- 射线拾取：让射线只检测第 1 层的可交互物体
:::

```js
// 射线只检测第 1 层
raycaster.layers.set(1);
```
</script>

<script type="text/markdown" data-id="api-camera" data-title="API 04 · 相机全参考" data-group="API 速查手册">
# API 04 · 相机全参考

## 一、Camera（基类）

不直接使用，是所有相机的父类。

### 属性

| 属性 | 类型 | 说明 |
|---|---|---|
| `position` | `Vector3` | 相机位置（继承 Object3D） |
| `up` | `Vector3` | 上方方向，默认 `(0,1,0)` |
| `matrixWorldInverse` | `Matrix4` | 世界矩阵逆矩阵（视图矩阵），内部计算 |
| `projectionMatrix` | `Matrix4` | 投影矩阵 |
| `projectionMatrixInverse` | `Matrix4` | 投影矩阵逆矩阵 |
| `layers` | `Layers` | 渲染层：只有同层的物体才会被渲染 |
| `near` | `number` | 近裁剪面 |
| `far` | `number` | 远裁剪面 |
| `zoom` | `number` | 缩放倍数，默认 1 |
| `filmGauge` | `number` | 胶片尺寸，默认 35 |
| `filmOffset` | `number` | 胶片偏移，默认 0 |
| `view` | `object \| null` | 多视口偏移参数，由 setViewOffset 设置 |

### 方法

| 方法 | 参数 | 说明 |
|---|---|---|
| `lookAt(x,y,z)` | 三个数或 `Vector3` | 让相机看向目标（修改 rotation） |
| `updateProjectionMatrix()` | — | **改参数后必须调用** |
| `updateMatrixWorld(force)` | `boolean` | 更新世界矩阵 |
| `getWorldDirection(target)` | `Vector3` | 相机的朝向（看向的方向，-Z） |
| `setFocalLength(focalLength)` | `number` | 用毫米焦距设置 fov |
| `getFocalLength()` | — | 返回当前焦距（毫米） |
| `getEffectiveFOV()` | — | 考虑 zoom 后的实际垂直 fov |
| `getFilmWidth()` | — | 胶片宽度 |
| `getFilmHeight()` | — | 胶片高度 |
| `clearViewOffset()` | — | 清除视口偏移 |
| `updateProjectionMatrix()` | — | 重算投影矩阵 |

## 二、PerspectiveCamera（透视相机）

```js
new THREE.PerspectiveCamera(fov, aspect, near, far)
```

### 构造参数

| 参数 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `fov` | `number` | 50 | 垂直视野角度（**度**，不是弧度），常用 35~75 |
| `aspect` | `number` | 1 | 宽高比，通常 `innerWidth / innerHeight` |
| `near` | `number` | 0.1 | 近裁剪面，比这更近的不渲染 |
| `far` | `number` | 2000 | 远裁剪面，比这更远的不渲染 |

### 特有属性（在基类基础上）

| 属性 | 类型 | 说明 |
|---|---|---|
| `fov` | `number` | 视野角度 |
| `aspect` | `number` | 宽高比 |
| `view` | `object \| null` | 视口偏移配置 |

### 特有方法

| 方法 | 参数 | 说明 |
|---|---|---|
| `setViewOffset(fullWidth, fullHeight, x, y, width, height)` | 6 个数字 | 设置视口偏移，做多屏拼接/分屏渲染 |
| `updateProjectionMatrix()` | — | 改 fov/aspect/near/far/zoom 后调用 |

```js
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2, 5);
camera.lookAt(0, 0, 0);

// 窗口变化时
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix(); // 必须！
  renderer.setSize(innerWidth, innerHeight);
});
```

::: plain 大白话时间
`fov` 是垂直方向能看多少度。数值越大，画面越「广角」，物体显得越小，边缘越容易变形。

产品展示常用 35~45（不变形），游戏常用 60~75（视野开阔），鱼眼效果用 90+。
:::

::: warning 注意
`near` 和 `far` 的比值别超过约 10000:1，否则深度缓冲精度不够，会出现 z-fighting（表面闪烁）。`near=0.1, far=1000` 是安全范围。
:::

## 三、OrthographicCamera（正交相机）

```js
new THREE.OrthographicCamera(left, right, top, bottom, near, far)
```

### 构造参数

| 参数 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `left` | `number` | -1 | 左边界 |
| `right` | `number` | 1 | 右边界 |
| `top` | `number` | 1 | 上边界 |
| `bottom` | `number` | -1 | 下边界 |
| `near` | `number` | 0.1 | 近裁剪面 |
| `far` | `number` | 2000 | 远裁剪面 |

### 特有属性

| 属性 | 类型 | 说明 |
|---|---|---|
| `left` / `right` / `top` / `bottom` | `number` | 视锥边界 |
| `view` | `object \| null` | 视口偏移 |

```js
const aspect = innerWidth / innerHeight;
const d = 5; // 半高
const camera = new THREE.OrthographicCamera(-d*aspect, d*aspect, d, -d, 0.1, 100);
```

::: plain 大白话时间
正交相机**没有近大远小**——1 米远的球和 10 米远的球看起来一样大。

适合做：建筑图纸、等距视角游戏、2.5D 场景、UI 叠加层。
:::

## 四、CubeCamera（立方体相机）

一次性渲染 6 个方向，生成环境贴图（做反射球常用）。

```js
new THREE.CubeCamera(near, far, renderTarget)
```

| 参数 | 类型 | 说明 |
|---|---|---|
| `near` | `number` | 近裁剪面 |
| `far` | `number` | 远裁剪面 |
| `renderTarget` | `WebGLCubeRenderTarget` | 立方体渲染目标 |

| 方法 | 参数 | 说明 |
|---|---|---|
| `update(renderer, scene)` | `WebGLRenderer, Scene` | 渲染 6 个面到 renderTarget |

```js
const cubeRT = new THREE.WebGLCubeRenderTarget(256);
const cubeCam = new THREE.CubeCamera(0.1, 100, cubeRT);
cubeCam.update(renderer, scene);
ball.material.envMap = cubeRT.texture;
```

## 五、ArrayCamera（相机数组）

用于 VR/多视口，一次渲染多个相机视角。

```js
new THREE.ArrayCamera(cameras)
```

| 属性 | 说明 |
|---|---|
| `cameras` | 子相机数组，每个需设置 `viewport` |
| `isArrayCamera` | `true` |

## 六、相机选择速查

| 需求 | 用哪个 |
|---|---|
| 常规 3D 场景、产品展示 | PerspectiveCamera |
| 建筑图纸、等距游戏、UI | OrthographicCamera |
| 实时反射/环境捕获 | CubeCamera |
| VR、分屏 | ArrayCamera |
</script>

<script type="text/markdown" data-id="api-renderer" data-title="API 05 · WebGLRenderer 全参数" data-group="API 速查手册">
# API 05 · WebGLRenderer 全参数

## 一、构造

```js
const renderer = new THREE.WebGLRenderer(parameters)
```

### 构造参数

| 参数 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `canvas` | `HTMLCanvasElement` | 自动创建 | 指定已有 canvas 元素 |
| `context` | `WebGLRenderingContext` | `null` | 指定已有 WebGL 上下文 |
| `alpha` | `boolean` | `false` | canvas 是否带 alpha 通道（透明背景） |
| `antialias` | `boolean` | `false` | 抗锯齿，边缘更平滑，有性能开销 |
| `depth` | `boolean` | `true` | 是否启用深度缓冲 |
| `stencil` | `boolean` | `false` | 是否启用模板缓冲 |
| `premultipliedAlpha` | `boolean` | `true` | 预乘 alpha |
| `preserveDrawingBuffer` | `boolean` | `false` | 保留绘图缓冲（截图需要设 true） |
| `powerPreference` | `string` | `'default'` | `'high-performance'` / `'low-power'` / `'default'` |
| `failIfMajorPerformanceCaveat` | `boolean` | `false` | 性能不足时是否失败 |
| `logarithmicDepthBuffer` | `boolean` | `false` | 对数深度缓冲，解决超大场景精度 |

```js
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true,
  powerPreference: 'high-performance'
});
```

## 二、核心属性

| 属性 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `domElement` | `HTMLCanvasElement` | — | 只读，渲染用的 canvas |
| `autoClear` | `boolean` | `true` | 每帧渲染前自动清屏 |
| `autoClearColor` | `boolean` | `true` | 自动清颜色缓冲 |
| `autoClearDepth` | `boolean` | `true` | 自动清深度缓冲 |
| `autoClearStencil` | `boolean` | `true` | 自动清模板缓冲 |
| `sortObjects` | `boolean` | `true` | 按材质/深度排序，减少状态切换 |
| `shadowMap` | `WebGLShadowMap` | — | 阴影配置对象（见下） |
| `outputColorSpace` | `string` | `SRGBColorSpace` | 输出颜色空间 |
| `toneMapping` | `constant` | `NoToneMapping` | 色调映射 |
| `toneMappingExposure` | `number` | `1` | 曝光度 |
| `localClippingEnabled` | `boolean` | `false` | 是否启用局部裁剪 |
| `clippingPlanes` | `Plane[]` | `[]` | 全局裁剪平面 |
| `info` | `object` | — | 渲染统计（见下） |
| `capabilities` | `object` | — | 硬件能力（见下） |
| `properties` | `object` | — | 内部属性缓存 |
| `state` | `object` | — | 内部 WebGL 状态 |
| `extensions` | `object` | — | WebGL 扩展管理 |
| `xr` | `WebXRManager` | — | XR/VR 管理 |

### shadowMap 子对象

| 属性 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `enabled` | `boolean` | `false` | 阴影总开关 |
| `autoUpdate` | `boolean` | `true` | 每帧重算阴影 |
| `needsUpdate` | `boolean` | `false` | 手动标记需要更新阴影 |
| `type` | `constant` | `PCFShadowMap` | 阴影算法 |

## 三、核心方法

### 尺寸

| 方法 | 参数 | 说明 |
|---|---|---|
| `setSize(width, height, updateStyle)` | `number, number, boolean` | 设置画布尺寸；`updateStyle=true` 时同时设 CSS 样式 |
| `getSize(target)` | `Vector2` | 读取当前尺寸到 target |
| `setPixelRatio(value)` | `number` | 设置像素比（高清屏适配） |
| `getPixelRatio()` | — | 返回当前像素比 |
| `getDrawingBufferSize(target)` | `Vector2` | 绘图缓冲区实际尺寸（含像素比） |
| `setViewport(x, y, width, height)` | 4 个数字 | 设置视口 |
| `setScissor(x, y, width, height)` | 4 个数字 | 设置裁剪区域 |
| `setScissorTest(boolean)` | `boolean` | 开关裁剪测试 |

### 渲染

| 方法 | 参数 | 说明 |
|---|---|---|
| `render(scene, camera)` | `Scene, Camera` | 渲染一帧 |
| `setAnimationLoop(callback)` | `Function \| null` | 设置动画循环；传 null 停止 |
| `compile(scene, camera, targetScene)` | `Scene, Camera, Scene` | 预编译着色器（减少卡顿） |
| `compileAsync(scene, camera, targetScene)` | 同上 | 异步预编译，返回 Promise |
| `clear(color, depth, stencil)` | `boolean...` | 清空缓冲 |
| `clearColor()` / `clearDepth()` / `clearStencil()` | — | 清指定缓冲 |
| `setClearColor(color, alpha)` | `Color, number` | 设置清屏颜色 |
| `getClearColor(target)` | `Color` | 读取清屏颜色 |
| `getClearAlpha()` | — | 读取清屏透明度 |
| `setRenderTarget(rt, activeCubeFace, activeMipmapLevel)` | `RenderTarget, number, number` | 切换到渲染目标 |
| `getRenderTarget()` | — | 返回当前渲染目标 |
| `copyFramebufferToTexture(...)` | 多参数 | 复制帧缓冲到纹理 |
| `copyTextureToTexture(...)` | 多参数 | 纹理间复制 |
| `readRenderTargetPixels(rt, x, y, w, h, buffer, activeCubeFaceIndex)` | 多参数 | 读取渲染目标像素 |

### 生命周期

| 方法 | 说明 |
|---|---|
| `dispose()` | 释放渲染器资源 |
| `forceContextLoss()` | 强制丢失 WebGL 上下文（测试用） |
| `forceContextRestore()` | 恢复上下文 |
| `getContext()` | 返回底层 WebGL 上下文 |
| `getContextAttributes()` | 返回上下文属性 |

## 四、info 渲染统计

```js
console.log(renderer.info);
```

| 字段 | 说明 |
|---|---|
| `info.render.frame` | 已渲染帧数 |
| `info.render.calls` | draw call 次数（**性能关键指标**） |
| `info.render.triangles` | 三角形数量 |
| `info.render.points` | 点数量 |
| `info.render.lines` | 线数量 |
| `info.memory.geometries` | 已上传的几何体数 |
| `info.memory.textures` | 已上传的纹理数 |
| `info.programs` | 着色器程序数组 |
| `info.autoReset` | 是否每帧自动重置统计（默认 true） |
| `info.reset()` | 手动重置统计 |

## 五、capabilities 硬件能力

| 属性 | 说明 |
|---|---|
| `isWebGL2` | 是否 WebGL 2（r163 起强制） |
| `maxTextures` | 最大纹理单元数 |
| `maxTextureSize` | 最大纹理尺寸 |
| `maxCubemapSize` | 最大立方体贴图尺寸 |
| `maxAttributes` | 最大顶点属性数 |
| `maxVertexUniforms` | 最大顶点 uniform 数 |
| `maxVaryings` | 最大 varying 数 |
| `maxFragmentUniforms` | 最大片元 uniform 数 |
| `vertexTextures` | 是否支持顶点纹理 |
| `maxSamples` | 最大多重采样数 |
| `precision` | 着色器精度（`highp`/`mediump`/`lowp`） |
| `getMaxAnisotropy()` | 最大各向异性过滤级别 |

```js
texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
```

## 六、WebGPURenderer（r187 新方向）

```js
import * as THREE from 'three/webgpu';
const renderer = new THREE.WebGPURenderer({ antialias: true });
await renderer.init(); // 异步初始化！
renderer.setAnimationLoop(animate); // 推荐：在循环里渲染会自动初始化
```

| 构造参数 | 说明 |
|---|---|
| `antialias` / `alpha` / `canvas` | 同 WebGLRenderer |
| `forceWebGL` | 强制使用 WebGL 后端 |
| `powerPreference` | 电源偏好 |

| 方法 | 说明 |
|---|---|
| `init()` | 异步初始化后端 |
| `renderAsync(scene, camera)` | 异步渲染 |
| `computeAsync(node, count)` | 执行计算着色器 |
| `render(scene, camera)` | 同步渲染（需先 init） |

::: warning 注意
WebGPURenderer **只支持 Node Material**——传统 `ShaderMaterial` 和 `onBeforeCompile` 在它上面不生效。要移植到 TSL。它会自动回退到 WebGL 2，所以一套代码全平台能跑。
:::
</script>

<script type="text/markdown" data-id="api-geometry" data-title="API 06 · 几何体全参考" data-group="API 速查手册">
# API 06 · 几何体全参考

## 一、BufferGeometry（基类）

所有几何体的基类，也是自定义几何体的方式。

### 构造

```js
const geometry = new THREE.BufferGeometry();
```

### 属性

| 属性 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `attributes` | `object` | `{}` | 所有属性数据，如 `position`、`normal`、`uv` |
| `index` | `BufferAttribute \| null` | `null` | 索引数据（复用顶点） |
| `groups` | `Array` | `[]` | 分组，用于多材质 |
| `boundingBox` | `Box3 \| null` | `null` | 包围盒（需 compute 后才有效） |
| `boundingSphere` | `Sphere \| null` | `null` | 包围球（视锥剔除用） |
| `drawRange` | `object` | `{start:0, count:Infinity}` | 只绘制指定范围的顶点 |
| `userData` | `object` | `{}` | 自定义数据 |

### 方法

| 方法 | 参数 | 说明 |
|---|---|---|
| `setAttribute(name, attribute)` | `string, BufferAttribute` | 设置顶点属性 |
| `getAttribute(name)` | `string` | 获取属性 |
| `deleteAttribute(name)` | `string` | 删除属性 |
| `hasAttribute(name)` | `string` | 是否存在某属性 |
| `setIndex(index)` | `BufferAttribute \| number[]` | 设置索引 |
| `getIndex()` | — | 获取索引 |
| `computeVertexNormals()` | — | 根据位置计算法线 |
| `computeBoundingBox()` | — | 计算包围盒 |
| `computeBoundingSphere()` | — | 计算包围球 |
| `computeTangents()` | — | 计算切线（法线贴图需要） |
| `center()` | — | 把几何体移到原点（居中） |
| `translate(x,y,z)` | `number...` | 平移所有顶点 |
| `rotateX/Y/Z(angle)` | `number` | 旋转所有顶点 |
| `scale(x,y,z)` | `number...` | 缩放所有顶点 |
| `applyMatrix4(matrix)` | `Matrix4` | 应用变换矩阵（原地修改顶点） |
| `addGroup(start, count, materialIndex)` | `number...` | 添加材质分组 |
| `clearGroups()` | — | 清空分组 |
| `setDrawRange(start, count)` | `number...` | 设置绘制范围 |
| `clone()` | — | 克隆几何体（深拷贝数据） |
| `copy(source)` | `BufferGeometry` | 复制 |
| `toJSON()` | — | 序列化 |
| `dispose()` | — | **释放 GPU 显存** |

### 内置属性名

| 名称 | 分量数 | 说明 |
|---|---|---|
| `position` | 3 | 顶点位置（必需） |
| `normal` | 3 | 法线（光照需要） |
| `uv` | 2 | 纹理坐标 |
| `uv1` / `uv2` / `uv3` | 2 | 多套 UV（aoMap 用 uv1） |
| `color` | 3 或 4 | 顶点颜色 |
| `tangent` | 4 | 切线（法线贴图） |

### 自定义几何体模板

```js
const geo = new THREE.BufferGeometry();
const positions = new Float32Array([
  -1,-1,0,  1,-1,0,  0,1,0  // 三角形的三个顶点
]);
const indices = [0, 1, 2];

geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setIndex(indices);
geo.computeVertexNormals();
geo.computeBoundingSphere();
```

::: warning 注意
删除/替换几何体时，务必调用旧几何体的 `dispose()` 释放显存，否则内存泄漏。
:::

## 二、BufferAttribute

```js
new THREE.BufferAttribute(array, itemSize, normalized)
```

| 参数 | 类型 | 说明 |
|---|---|---|
| `array` | `TypedArray` | 数据数组（Float32Array 等） |
| `itemSize` | `number` | 每个顶点占几个分量（position=3, uv=2） |
| `normalized` | `boolean` | 是否归一化到 0~1（用于整数类型） |

| 方法 | 说明 |
|---|---|
| `setX/Y/Z/W(index, value)` | 设置分量 |
| `getX/Y/Z/W(index)` | 读取分量 |
| `setUsage(usage)` | 设置用途（StaticDrawUsage 等） |
| `needsUpdate = true` | **改数据后必须设**，通知 GPU 更新 |
| `clone()` / `copy()` | 克隆 / 复制 |
| `array` | 只读访问底层数组 |

## 三、内置几何体完整参数

### BoxGeometry（立方体）

```js
new THREE.BoxGeometry(width, height, depth, widthSegments, heightSegments, depthSegments)
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `width` | 1 | X 方向宽度 |
| `height` | 1 | Y 方向高度 |
| `depth` | 1 | Z 方向深度 |
| `widthSegments` | 1 | X 方向分段数 |
| `heightSegments` | 1 | Y 方向分段数 |
| `depthSegments` | 1 | Z 方向分段数 |

### SphereGeometry（球体）

```js
new THREE.SphereGeometry(radius, widthSegments, heightSegments, phiStart, phiLength, thetaStart, thetaLength)
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `radius` | 1 | 半径 |
| `widthSegments` | 32 | 水平分段（经线数） |
| `heightSegments` | 16 | 垂直分段（纬线数） |
| `phiStart` | 0 | 水平起始角（弧度） |
| `phiLength` | `2π` | 水平跨度 |
| `thetaStart` | 0 | 垂直起始角 |
| `thetaLength` | `π` | 垂直跨度 |

::: tip 半球的画法
`new THREE.SphereGeometry(1, 32, 16, 0, Math.PI*2, 0, Math.PI/2)` —— thetaLength 设 π/2 就是上半球。
:::

### PlaneGeometry（平面）

```js
new THREE.PlaneGeometry(width, height, widthSegments, heightSegments)
```

默认 1×1，面朝 **+Z**。

### CylinderGeometry（圆柱）

```js
new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radialSegments, heightSegments, openEnded, thetaStart, thetaLength)
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `radiusTop` | 1 | 顶面半径 |
| `radiusBottom` | 1 | 底面半径 |
| `height` | 1 | 高 |
| `radialSegments` | 32 | 圆周分段 |
| `heightSegments` | 1 | 高度分段 |
| `openEnded` | `false` | 是否无顶底盖 |
| `thetaStart` / `thetaLength` | `0` / `2π` | 圆周起止角 |

::: tip 圆锥 / 圆台
顶面半径 0 = 圆锥；顶底半径不同 = 圆台。
:::

### ConeGeometry（圆锥）

```js
new THREE.ConeGeometry(radius, height, radialSegments, heightSegments, openEnded, thetaStart, thetaLength)
```

等价于 `CylinderGeometry(0, radius, height, ...)`。默认半径 1、高 1。

### TorusGeometry（圆环/甜甜圈）

```js
new THREE.TorusGeometry(radius, tube, radialSegments, tubularSegments, arc)
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `radius` | 1 | 环中心到管中心的距离 |
| `tube` | 0.4 | 管的半径 |
| `radialSegments` | 12 | 管截面分段 |
| `tubularSegments` | 48 | 环周分段 |
| `arc` | `2π` | 圆环跨度（可做部分环） |

### TorusKnotGeometry（环面扭结）

```js
new THREE.TorusKnotGeometry(radius, tube, tubularSegments, radialSegments, p, q)
```

默认：`radius=1, tube=0.4, tubularSegments=64, radialSegments=8, p=2, q=3`。`p`、`q` 控制缠绕方式，改它能得到各种奇妙形状。

### 多面体家族

```js
new THREE.IcosahedronGeometry(radius, detail)   // 二十面体
new THREE.DodecahedronGeometry(radius, detail)  // 十二面体
new THREE.OctahedronGeometry(radius, detail)    // 八面体
new THREE.TetrahedronGeometry(radius, detail)   // 四面体
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `radius` | 1 | 外接球半径 |
| `detail` | 0 | 细分等级：0=棱角分明，1/2/3 越细分越接近球 |

### 圆与环

```js
new THREE.CircleGeometry(radius, segments, thetaStart, thetaLength)  // 实心圆盘
new THREE.RingGeometry(innerRadius, outerRadius, thetaSegments, phiSegments, thetaStart, thetaLength) // 圆环
```

### CapsuleGeometry（胶囊体）

```js
new THREE.CapsuleGeometry(radius, length, capSegments, radialSegments)
```

默认：`radius=1, length=1, capSegments=4, radialSegments=8`。

### LatheGeometry（旋转体）

```js
new THREE.LatheGeometry(points, segments, phiStart, phiLength)
```

| 参数 | 说明 |
|---|---|
| `points` | `Vector2[]`，轮廓线（旋转轴是 Y 轴） |
| `segments` | 旋转分段数，默认 12 |
| `phiStart` / `phiLength` | 起止角 |

```js
const points = [];
for (let i = 0; i < 10; i++) points.push(new THREE.Vector2(Math.sin(i*0.2)*2+2, i));
const vase = new THREE.Mesh(new THREE.LatheGeometry(points), material);
```

### ExtrudeGeometry（挤出）

```js
new THREE.ExtrudeGeometry(shapes, options)
```

| options | 默认值 | 说明 |
|---|---|---|
| `depth` | 1 | 挤出深度 |
| `bevelEnabled` | `true` | 是否倒角 |
| `bevelThickness` | 0.2 | 倒角厚度 |
| `bevelSize` | 0.1 | 倒角大小 |
| `bevelSegments` | 3 | 倒角分段 |
| `steps` | 1 | 挤出步数 |
| `curveSegments` | 12 | 曲线分段 |

### TubeGeometry（管道）

```js
new THREE.TubeGeometry(path, tubularSegments, radius, radialSegments, closed)
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `path` | — | `Curve` 对象（如 CatmullRomCurve3） |
| `tubularSegments` | 64 | 沿路径分段 |
| `radius` | 1 | 管半径 |
| `radialSegments` | 8 | 截面分段 |
| `closed` | `false` | 是否闭合 |

### ShapeGeometry / TextGeometry

```js
new THREE.ShapeGeometry(shapes, curveSegments) // 2D 形状
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
new THREE.TextGeometry(text, { font, size, depth, curveSegments, bevelEnabled }) // 3D 文字（需先加载字体）
```

### EdgesGeometry / WireframeGeometry

```js
new THREE.EdgesGeometry(geometry, thresholdAngle) // 只保留夹角大于阈值的边
new THREE.WireframeGeometry(geometry)             // 所有边
```

配合 `LineSegments` 做描边效果。

## 四、几何体选择速查

| 想要 | 用这个 |
|---|---|
| 方块 / 盒子 | BoxGeometry |
| 球 / 半球 | SphereGeometry |
| 平面 / 地面 | PlaneGeometry |
| 柱子 / 圆锥 / 圆台 | CylinderGeometry / ConeGeometry |
| 甜甜圈 | TorusGeometry |
| 花瓶 / 旋转对称体 | LatheGeometry |
| 自定义 2D 形状挤出 | ExtrudeGeometry |
| 沿路径的管子 | TubeGeometry |
| 3D 文字 | TextGeometry |
| 只要边框 | EdgesGeometry |
</script>

<script type="text/markdown" data-id="api-material-base" data-title="API 07 · Material 基类与基础材质" data-group="API 速查手册">
# API 07 · Material 基类与基础材质

## 一、Material（基类）

所有材质的父类，下面的属性各种材质通用。

### 构造

```js
const material = new THREE.Material();
```

### 通用属性

| 属性 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `id` | `number` | 自动 | 只读，唯一 ID |
| `uuid` | `string` | 自动 | 只读 |
| `name` | `string` | `''` | 材质名 |
| `type` | `string` | `'Material'` | 只读，类型标识 |
| `color` | `Color` | 白色 | 材质颜色（部分材质有） |
| `opacity` | `number` | `1` | 透明度 0~1 |
| `transparent` | `boolean` | `false` | 是否启用透明（改 opacity 必须开这个） |
| `alphaTest` | `number` | `0` | alpha 阈值，低于它的像素被丢弃（做镂空，比 transparent 快） |
| `alphaHash` | `boolean` | `false` | 用哈希抖动模拟透明（r155+，无需排序） |
| `side` | `constant` | `FrontSide` | 渲染哪面 |
| `depthTest` | `boolean` | `true` | 是否做深度测试 |
| `depthWrite` | `boolean` | `true` | 是否写入深度缓冲（透明物体常设 false） |
| `depthFunc` | `constant` | `LessEqualDepth` | 深度比较函数 |
| `blending` | `constant` | `NormalBlending` | 混合模式 |
| `blendSrc` / `blendDst` | `constant` | — | 自定义混合因子 |
| `blendEquation` | `constant` | `AddEquation` | 混合方程 |
| `blendSrcAlpha` / `blendDstAlpha` / `blendEquationAlpha` | `constant` | `null` | 单独设置 alpha 通道混合 |
| `premultipliedAlpha` | `boolean` | `false` | 预乘 alpha |
| `wireframe` | `boolean` | `false` | 线框模式 |
| `wireframeLinewidth` | `number` | `1` | 线宽（多数平台只支持 1） |
| `flatShading` | `boolean` | `false` | 平面着色（每个面一个法线，有棱角感） |
| `fog` | `boolean` | `true` | 是否受场景雾影响 |
| `lightMapIntensity` | `number` | `1` | 光照贴图强度 |
| `aoMapIntensity` | `number` | `1` | AO 贴图强度 |
| `toneMapped` | `boolean` | `true` | 是否参与色调映射（发光物体常设 false） |
| `visible` | `boolean` | `true` | 材质是否可见 |
| `clippingPlanes` | `Plane[]` | `null` | 局部裁剪平面 |
| `clipIntersection` | `boolean` | `false` | 裁剪相交/相交取反 |
| `clipShadows` | `boolean` | `false` | 裁剪是否影响阴影 |
| `shadowSide` | `constant \| null` | `null` | 阴影渲染用哪面 |
| `needsUpdate` | `boolean` | `false` | 设 true 时重新编译着色器 |
| `version` | `number` | 0 | 只读，每次 needsUpdate 会 +1 |
| `userData` | `object` | `{}` | 自定义数据 |

### 方法

| 方法 | 说明 |
|---|---|
| `clone()` | 克隆材质（深拷贝，纹理是浅拷贝） |
| `copy(source)` | 从源材质复制 |
| `dispose()` | 释放资源 |
| `toJSON(meta)` | 序列化 |
| `setValues(values)` | 批量设置属性（构造函数内部用） |
| `onBeforeCompile(shader, renderer)` | 编译前回调，可注入自定义 GLSL |
| `customProgramCacheKey()` | 自定义着色器缓存键 |

```js
// 用 setValues 批量设置
material.setValues({ color: 0xff0000, transparent: true, opacity: 0.5 });

// 注入自定义着色器（WebGL）
material.onBeforeCompile = (shader) => {
  shader.vertexShader = shader.vertexShader.replace('...', '...');
};
```

::: plain 大白话时间
`transparent` 和 `opacity` 必须**一起用**。只设 `opacity: 0.5` 而不设 `transparent: true`，物体还是完全不透明——这是超高频的新手坑。
:::

## 二、MeshBasicMaterial（基础材质）

不受光照影响的纯色/纯贴图材质。

```js
new THREE.MeshBasicMaterial(parameters)
```

| 参数 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `color` | `Color` | `0xffffff` | 颜色 |
| `map` | `Texture` | `null` | 颜色贴图 |
| `lightMap` | `Texture` | `null` | 光照贴图 |
| `aoMap` | `Texture` | `null` | 环境光遮蔽贴图 |
| `alphaMap` | `Texture` | `null` | 透明度贴图 |
| `envMap` | `Texture` | `null` | 环境反射贴图 |
| `combine` | `constant` | `MultiplyOperation` | envMap 与颜色混合方式 |
| `reflectivity` | `number` | `1` | 反射强度 |
| `refractionRatio` | `number` | `0.98` | 折射比 |
| `wireframe` | `boolean` | `false` | 线框 |
| `wireframeLinejoin` | `string` | `'round'` | 线框连接样式 |
| `fog` | `boolean` | `true` | 受雾影响 |
| `toneMapped` | `boolean` | `true` | 参与色调映射 |

**用途**：调试（红色线框）、UI 元素、图标、发光物体、天空盒。

## 三、MeshLambertMaterial（兰伯特材质）

便宜的漫反射材质，无高光。适合低配设备。

```js
new THREE.MeshLambertMaterial(parameters)
```

在 Basic 的基础上增加：

| 参数 | 默认值 | 说明 |
|---|---|---|
| `emissive` | `0x000000` | 自发光颜色 |
| `emissiveMap` | `null` | 自发光贴图 |
| `emissiveIntensity` | `1` | 自发光强度 |

::: plain 大白话时间
Lambert 是最简单的「吃光」材质——光从正面照就亮，斜着照就暗，没有高光点。

计算量小，适合大量物体或低端手机。想要塑料高光得用 Phong 或 Standard。
:::

## 四、MeshPhongMaterial（冯氏材质）

经典高光材质，有镜面反射。

```js
new THREE.MeshPhongMaterial(parameters)
```

在 Lambert 基础上增加：

| 参数 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `specular` | `Color` | `0x111111` | 高光颜色 |
| `shininess` | `number` | `30` | 高光锐利度，越大高光点越小越亮 |
| `bumpMap` | `Texture` | `null` | 凹凸贴图 |
| `bumpScale` | `number` | `1` | 凹凸强度 |
| `normalMap` | `Texture` | `null` | 法线贴图 |
| `normalMapType` | `constant` | `TangentSpaceNormalMap` | 法线贴图类型 |
| `normalScale` | `Vector2` | `(1,1)` | 法线强度 |
| `displacementMap` | `Texture` | `null` | 位移贴图（真改顶点） |
| `displacementScale` | `number` | `1` | 位移强度 |
| `displacementBias` | `number` | `0` | 位移偏移 |
| `envMap` | `Texture` | `null` | 环境贴图 |
| `combine` | `constant` | `MultiplyOperation` | 混合方式：`MultiplyOperation` / `MixOperation` / `AddOperation` |
| `reflectivity` | `number` | `1` | 反射率 |

## 五、法线贴图类型

| 常量 | 说明 |
|---|---|
| `THREE.TangentSpaceNormalMap` | 切线空间（默认，最常用） |
| `THREE.ObjectSpaceNormalMap` | 物体空间 |

## 六、材质性能对比

| 材质 | 计算量 | 高光 | 物理正确 | 场景 |
|---|---|---|---|---|
| MeshBasicMaterial | 最低 | ❌ | ❌ | 调试、UI、发光 |
| MeshLambertMaterial | 低 | ❌ | ❌ | 低配设备、简单场景 |
| MeshPhongMaterial | 中 | ✅ | ❌ | 经典塑料/金属感 |
| MeshStandardMaterial | 中高 | ✅ | ✅ | **日常首选** |
| MeshPhysicalMaterial | 高 | ✅ | ✅ | 玻璃、车漆 |

::: tip 选择建议
不确定用什么就选 `MeshStandardMaterial`——物理正确、效果真实、参数直观。只有明确需要极致性能时才降级到 Lambert，需要特殊效果（玻璃/清漆）时才升级到 Physical。
:::
</script>

<script type="text/markdown" data-id="api-material-advanced" data-title="API 08 · PBR 与特殊材质" data-group="API 速查手册">
# API 08 · PBR 与特殊材质

## 一、MeshStandardMaterial（物理标准材质）

日常开发的默认选择，物理正确渲染（PBR）。

```js
new THREE.MeshStandardMaterial(parameters)
```

### 核心参数

| 参数 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `color` | `Color` | `0xffffff` | 基础颜色 |
| `roughness` | `number` | `1` | 粗糙度：0=镜面，1=完全哑光 |
| `metalness` | `number` | `0` | 金属度：0=非金属，1=金属 |
| `roughnessMap` | `Texture` | `null` | 粗糙度贴图（乘到 roughness 上） |
| `metalnessMap` | `Texture` | `null` | 金属度贴图 |
| `map` | `Texture` | `null` | 颜色贴图 |
| `normalMap` | `Texture` | `null` | 法线贴图 |
| `normalScale` | `Vector2` | `(1,1)` | 法线强度 |
| `bumpMap` / `bumpScale` | `Texture / number` | `null / 1` | 凹凸贴图 |
| `displacementMap` / `displacementScale` / `displacementBias` | — | — | 位移贴图 |
| `aoMap` / `aoMapIntensity` | `Texture / number` | `null / 1` | AO 贴图（需要 uv1） |
| `lightMap` / `lightMapIntensity` | `Texture / number` | `null / 1` | 光照贴图（需要 uv1） |
| `emissive` | `Color` | `0x000000` | 自发光颜色 |
| `emissiveMap` | `Texture` | `null` | 自发光贴图 |
| `emissiveIntensity` | `number` | `1` | 自发光强度 |
| `alphaMap` | `Texture` | `null` | 透明度贴图 |
| `envMap` | `Texture` | `null` | 环境贴图（scene.environment 会自动提供） |
| `envMapIntensity` | `number` | `1` | 环境反射强度 |
| `flatShading` | `boolean` | `false` | 平面着色 |

::: plain 大白话时间
**roughness（粗糙度）和 metalness（金属度）是 PBR 的核心：**

| 材质 | roughness | metalness |
|---|---|---|
| 塑料 | 0.5~0.8 | 0 |
| 橡胶 | 0.9~1 | 0 |
| 镜面金属 | 0.05~0.2 | 1 |
| 磨砂金属 | 0.4~0.6 | 1 |
| 木头/石头 | 0.7~1 | 0 |

记住一条：**非金属 metalness 永远是 0，金属永远是 1，中间值只用于过渡（比如带锈的铁）。**
:::

## 二、MeshPhysicalMaterial（物理增强材质）

继承 Standard，增加高级特性——玻璃、车漆、布料。

### 新增参数

| 参数 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `clearcoat` | `number` | `0` | 清漆层强度（车漆的光亮外层） |
| `clearcoatRoughness` | `number` | `0` | 清漆层粗糙度 |
| `clearcoatMap` / `clearcoatRoughnessMap` / `clearcoatNormalMap` | `Texture` | `null` | 清漆相关贴图 |
| `sheen` | `number` | `0` | 织物柔光（布料效果） |
| `sheenColor` | `Color` | `0xffffff` | 柔光颜色 |
| `sheenRoughness` | `number` | `1` | 柔光粗糙度 |
| `transmission` | `number` | `0` | **透射**——玻璃效果的关键参数 |
| `thickness` | `number` | `0` | 材质厚度（影响折射） |
| `attenuationColor` | `Color` | `0xffffff` | 光穿过材质后的衰减色 |
| `attenuationDistance` | `number` | `Infinity` | 衰减距离 |
| `ior` | `number` | `1.5` | 折射率（玻璃 1.5、水 1.33、钻石 2.4） |
| `iridescence` | `number` | `0` | 虹彩效果（肥皂泡、油膜） |
| `iridescenceIOR` | `number` | `1.3` | 虹彩折射率 |
| `iridescenceThicknessRange` | `number[]` | `[100,400]` | 虹彩厚度范围（r187 已弃用，改单值） |
| `specularIntensity` | `number` | `1` | 镜面反射强度 |
| `specularColor` | `Color` | `0xffffff` | 镜面反射颜色 |
| `anisotropy` | `number` | `0` | 各向异性（拉丝金属） |
| `anisotropyRotation` | `number` | `0` | 各向异性方向 |

### 玻璃效果配方

```js
new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0,
  roughness: 0,
  transmission: 1,    // 关键：完全透射
  thickness: 0.5,     // 有厚度才有折射
  ior: 1.5,           // 玻璃的折射率
  transparent: true,
  envMapIntensity: 1
});
```

### 车漆效果配方

```js
new THREE.MeshPhysicalMaterial({
  color: 0xff0000,
  metalness: 0.9,
  roughness: 0.3,
  clearcoat: 1,           // 清漆层
  clearcoatRoughness: 0.05
});
```

::: warning 注意
`transmission` 需要配合 `transparent: true`。它和 `opacity` 不同——`opacity` 只是变淡，`transmission` 会真实折射背后的物体，计算更贵。
:::

## 三、MeshNormalMaterial

按法线方向染色，彩虹色。不需要光照，调试神器。

| 参数 | 默认值 | 说明 |
|---|---|---|
| `normalMap` / `normalScale` | `null / (1,1)` | 法线贴图 |
| `flatShading` | `false` | 平面着色 |
| `wireframe` | `false` | 线框 |

```js
const debugMat = new THREE.MeshNormalMaterial();
```

::: tip 调试用途
- 看法线是否翻转（颜色异常说明法线错了）
- 看模型朝向
- 快速确认物体在不在画面里
:::

## 四、MeshDepthMaterial

按到相机的距离染色（近白远黑）。

| 参数 | 默认值 | 说明 |
|---|---|---|
| `depthPacking` | `BasicDepthPacking` | `BasicDepthPacking` 或 `RGBADepthPacking` |
| `map` / `alphaMap` / `displacementMap` | `null` | 贴图 |

常配合 `scene.overrideMaterial` 做深度可视化或阴影自定义。

## 五、MeshDistanceMaterial

类似 DepthMaterial，用于点光源阴影。

## 六、ShaderMaterial（自定义着色器）

```js
new THREE.ShaderMaterial(parameters)
```

| 参数 | 类型 | 说明 |
|---|---|---|
| `uniforms` | `object` | `{ uName: { value: ... } }` 传给 GPU 的变量 |
| `vertexShader` | `string` | 顶点着色器 GLSL 代码 |
| `fragmentShader` | `string` | 片元着色器 GLSL 代码 |
| `defines` | `object` | 预编译宏定义 |
| `lights` | `boolean` | 是否注入光照 uniform |
| `clipping` | `boolean` | 是否支持裁剪 |
| `extensions` | `object` | WebGL 扩展开关 |
| `glslVersion` | `constant` | `GLSL1` / `GLSL3` |
| `transparent` / `depthTest` / `depthWrite` | — | 同基类 |

内置 uniform（自动提供）：`projectionMatrix`、`modelViewMatrix`、`modelMatrix`、`viewMatrix`、`normalMatrix`、`cameraPosition`

内置 attribute：`position`、`normal`、`uv`

## 七、RawShaderMaterial

比 ShaderMaterial 更底层——**不会自动注入**内置 uniform 和 attribute，全都要自己声明。适合完全掌控着色器。

## 八、PointsMaterial（点材质）

| 参数 | 默认值 | 说明 |
|---|---|---|
| `color` | `0xffffff` | 点颜色 |
| `size` | `1` | 点大小（像素） |
| `sizeAttenuation` | `true` | 是否远小近大 |
| `map` / `alphaMap` | `null` | 点贴图（做圆形粒子） |
| `vertexColors` | `false` | 启用顶点颜色 |

## 九、SpriteMaterial（精灵材质）

| 参数 | 默认值 | 说明 |
|---|---|---|
| `color` | `0xffffff` | 颜色 |
| `map` | `null` | 精灵贴图 |
| `alphaMap` / `alphaTest` | `null / 0` | 透明控制 |
| `rotation` | `0` | 精灵旋转弧度 |
| `sizeAttenuation` | `true` | 是否远小近大 |
| `fog` | `true` | 受雾影响 |

精灵（`Sprite`）永远面向相机，做标签、图标、火焰billboard 用。

## 十、LineBasicMaterial / LineDashedMaterial

| LineBasicMaterial | 默认值 | 说明 |
|---|---|---|
| `color` | `0xffffff` | 线颜色 |
| `linewidth` | `1` | 线宽（多数平台只支持 1） |
| `vertexColors` | `false` | 顶点颜色 |
| `fog` | `true` | 受雾影响 |

| LineDashedMaterial 新增 | 默认值 | 说明 |
|---|---|---|
| `dashSize` | `1` | 虚线段长度 |
| `gapSize` | `1` | 间隔长度 |
| `scale` | `1` | 缩放 |

::: warning 注意
用虚线材质必须调用 `line.computeLineDistances()`，否则显示成实线。
:::
</script>

<script type="text/markdown" data-id="api-light" data-title="API 09 · 光照与阴影全参考" data-group="API 速查手册">
# API 09 · 光照与阴影全参考

## 一、Light（基类）

| 属性 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `color` | `Color` | `0xffffff` | 光颜色 |
| `intensity` | `number` | `1` | 强度 |
| `visible` | `boolean` | `true` | 开关 |
| `castShadow` | `boolean` | `false` | 是否投影 |
| `target` | `Object3D` | 新 Object3D | 照射目标（部分灯有） |
| `shadow` | `LightShadow` | — | 阴影配置 |

::: warning 物理光照单位
r155 起 Three.js 默认启用**物理正确光照**（`useLegacyLights` 已移除）。点光源/聚光灯的强度单位是坎德拉（candela），数值往往要设得很大（几十到几百），跟老教程的 `intensity: 1` 感觉完全不同。平行光和环境光不受影响。
:::

## 二、AmbientLight（环境光）

```js
new THREE.AmbientLight(color, intensity)
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `color` | `0xffffff` | 颜色 |
| `intensity` | `1` | 强度 |

均匀照亮所有物体，无方向、无阴影。只增加 `.color` 和 `.intensity`，没有额外属性。

## 三、HemisphereLight（半球光）

```js
new THREE.HemisphereLight(skyColor, groundColor, intensity)
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `skyColor` | `0xffffff` | 天空方向的颜色 |
| `groundColor` | `0x444444` | 地面方向的颜色 |
| `intensity` | `1` | 强度 |

| 额外属性 | 说明 |
|---|---|
| `.color` | 天空色（等同 skyColor） |
| `.groundColor` | 地面色 |
| `.position` | 方向由位置决定，默认 `(0,1,0)` |

## 四、DirectionalLight（平行光/太阳）

```js
new THREE.DirectionalLight(color, intensity)
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `color` | `0xffffff` | 颜色 |
| `intensity` | `1` | 强度 |

光线平行，从 `.position` 射向 `.target.position`。

| 额外属性 | 说明 |
|---|---|
| `.target` | 照射目标 Object3D，**必须 add 到 scene** 才生效 |
| `.shadow` | `DirectionalLightShadow`，正交相机阴影 |

```js
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(5, 10, 5);
sun.target.position.set(0, 0, 0);
scene.add(sun, sun.target); // target 要加进场景！
```

## 五、PointLight（点光源）

```js
new THREE.PointLight(color, intensity, distance, decay)
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `color` | `0xffffff` | 颜色 |
| `intensity` | `1` | 强度（坎德拉，常需设几十~几百） |
| `distance` | `0` | 照射距离，0=无限远 |
| `decay` | `2` | 衰减指数，2=物理正确（平方反比） |

| 额外属性 | 说明 |
|---|---|
| `.power` | 光通量（流明），设置它会自动换算 intensity：`intensity = power / (4π)` |
| `.shadow` | `PointLightShadow`，立方体阴影（代价高：渲染 6 个面） |

## 六、SpotLight（聚光灯）

```js
new THREE.SpotLight(color, intensity, distance, angle, penumbra, decay)
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `color` | `0xffffff` | 颜色 |
| `intensity` | `1` | 强度 |
| `distance` | `0` | 照射距离 |
| `angle` | `Math.PI/3` | 光锥张角（弧度，最大 π/2） |
| `penumbra` | `0` | 边缘柔化 0~1，越大边缘越软 |
| `decay` | `2` | 衰减指数 |

| 额外属性 | 说明 |
|---|---|
| `.target` | 照射目标，要 add 到 scene |
| `.power` | 光通量 |
| `.map` | 聚光灯投影贴图（gobo 效果） |
| `.shadow` | `SpotLightShadow`，透视相机阴影 |

## 七、RectAreaLight（面光源）

```js
new THREE.RectAreaLight(color, intensity, width, height)
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `color` | `0xffffff` | 颜色 |
| `intensity` | `1` | 强度 |
| `width` | `1` | 宽度 |
| `height` | `1` | 高度 |

::: warning 注意
使用前**必须初始化**：

```js
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
RectAreaLightUniformsLib.init();
```

而且 RectAreaLight **不支持阴影**。只支持 MeshStandardMaterial 和 MeshPhysicalMaterial。
:::

## 八、LightProbe（光照探针）

捕获环境光照信息（球谐函数）。包括 `AmbientLightProbe`、`HemisphereLightProbe`。

```js
new THREE.AmbientLightProbe(color, intensity)
new THREE.HemisphereLightProbe(skyColor, groundColor, intensity)
```

## 九、LightShadow（阴影基类）

所有阴影对象的基础配置：

| 属性 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `mapSize` | `Vector2` | `(512,512)` | 阴影贴图分辨率，越大越清晰越吃性能 |
| `camera` | `Camera` | 正交/透视 | 阴影相机 |
| `bias` | `number` | `0` | 深度偏移，消除 shadow acne（常用 `-0.0001`） |
| `normalBias` | `number` | `0` | 法线方向偏移，更推荐（常用 `0.02`） |
| `radius` | `number` | `1` | 阴影模糊半径（PCF 下有效） |
| `blurSamples` | `number` | `8` | VSM 阴影的模糊采样数 |
| `intensity` | `number` | `1` | 阴影强度（r165+，0~1，可淡化阴影） |
| `autoUpdate` | `boolean` | `true` | 是否每帧更新 |
| `needsUpdate` | `boolean` | `false` | 手动标记更新 |

| 方法 | 说明 |
|---|---|
| `getFrameExtents()` | 返回阴影帧范围 |
| `getViewportCount()` | 视口数量（点光=6） |
| `dispose()` | 释放资源 |

### 各灯的 shadow.camera

| 灯 | 相机类型 | 需要调整的参数 |
|---|---|---|
| DirectionalLight | `OrthographicCamera` | `left/right/top/bottom`（阴影覆盖范围） |
| SpotLight | `PerspectiveCamera` | `fov` 自动由 angle 算，可调 `near/far` |
| PointLight | `PerspectiveCamera` ×6 | `near/far` |

::: plain 大白话时间
平行光的阴影相机默认范围只有 ±5 单位。场景大了，远处物体就没影子——必须扩大 `shadow.camera.left/right/top/bottom`。

`bias` 和 `normalBias` 用来消除物体表面的条纹（shadow acne）。优先调 `normalBias`（从 0.02 开始），它比 bias 更不容易让影子「脱节」。
:::

### 阴影配置完整示例

```js
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(10, 15, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 50;
sun.shadow.camera.left = -15;
sun.shadow.camera.right = 15;
sun.shadow.camera.top = 15;
sun.shadow.camera.bottom = -15;
sun.shadow.bias = -0.0001;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 2;
scene.add(sun);
```

## 十、灯光性能排序

从快到慢：`AmbientLight` < `HemisphereLight` < `DirectionalLight` < `SpotLight` < `RectAreaLight` < `PointLight`

投影的灯更贵（每盏要额外渲染一遍场景），点光源阴影最贵（6 个面）。移动端建议最多 1~2 盏投影灯。
</script>

<script type="text/markdown" data-id="api-texture" data-title="API 10 · 纹理与加载器全参考" data-group="API 速查手册">
# API 10 · 纹理与加载器全参考

## 一、Texture（纹理基类）

### 构造

```js
new THREE.Texture(image, mapping, wrapS, wrapT, magFilter, minFilter, format, type, anisotropy, colorSpace)
```

### 核心属性

| 属性 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `image` | `Image \| Canvas \| Video` | `null` | 图像源 |
| `mapping` | `constant` | `UVMapping` | 映射方式 |
| `wrapS` | `constant` | `ClampToEdgeWrapping` | 水平包裹 |
| `wrapT` | `constant` | `ClampToEdgeWrapping` | 垂直包裹 |
| `magFilter` | `constant` | `LinearFilter` | 放大过滤 |
| `minFilter` | `constant` | `LinearMipmapLinearFilter` | 缩小过滤 |
| `generateMipmaps` | `boolean` | `true` | 是否生成 mipmap |
| `flipY` | `boolean` | `true` | 是否垂直翻转（GLTF 模型贴图常设 false） |
| `premultiplyAlpha` | `boolean` | `false` | 预乘 alpha |
| `unpackAlignment` | `number` | `4` | 内存对齐 |
| `colorSpace` | `string` | `NoColorSpace` | 颜色空间（颜色贴图设 SRGBColorSpace） |
| `repeat` | `Vector2` | `(1,1)` | 重复次数 |
| `offset` | `Vector2` | `(0,0)` | 偏移 |
| `center` | `Vector2` | `(0,0)` | 旋转中心 |
| `rotation` | `number` | `0` | 旋转弧度 |
| `matrixAutoUpdate` | `boolean` | `true` | 自动更新 UV 变换矩阵 |
| `matrix` | `Matrix3` | — | UV 变换矩阵 |
| `anisotropy` | `number` | `1` | 各向异性过滤级别（斜视更清晰） |
| `format` | `constant` | `RGBAFormat` | 像素格式 |
| `type` | `constant` | `UnsignedByteType` | 数据类型 |
| `mipmaps` | `Array` | `[]` | mipmap 数组 |
| `mipmapsAutoUpdate` | `boolean` | `true` | r187 新增，自动更新 mipmap |
| `userData` | `object` | `{}` | 自定义数据（GLTF 用） |
| `version` | `number` | 0 | 只读，needsUpdate 后 +1 |

### 方法

| 方法 | 说明 |
|---|---|
| `needsUpdate = true` | 上传/更新纹理到 GPU |
| `clone()` | 克隆（共享 image） |
| `copy(source)` | 复制 |
| `dispose()` | 释放 GPU 资源 |
| `toJSON(meta)` | 序列化 |
| `updateMatrix()` | 手动更新 UV 矩阵 |

### 像素格式 format

`AlphaFormat`、`RGBFormat`、`RGBAFormat`（默认）、`LuminanceFormat`、`RedFormat`、`RGFormat`、`RedIntegerFormat`、`DepthFormat`、`DepthStencilFormat`

## 二、纹理子类

| 类 | 用途 |
|---|---|
| `CanvasTexture(canvas)` | 从 canvas 生成（动态文字、程序化图案） |
| `VideoTexture(video)` | 视频帧作为纹理 |
| `DataTexture(data, w, h)` | 从原始数组数据创建 |
| `DataArrayTexture` | 2D 纹理数组 |
| `Data3DTexture` | 3D 纹理 |
| `CompressedTexture` | 压缩纹理（ASTC/ETC 等） |
| `CubeTexture(images)` | 6 面立方体贴图 |
| `WebGLCubeRenderTarget.texture` | 动态立方体贴图 |
| `DepthTexture` | 深度纹理 |
| `ExternalTexture` | 视频外部纹理（WebGPU） |

## 三、Loader 加载器基类

```js
const loader = new THREE.Loader();
```

| 方法 | 说明 |
|---|---|
| `load(url, onLoad, onProgress, onError)` | 加载资源 |
| `loadAsync(url, onProgress)` | Promise 版本 |
| `setCrossOrigin(value)` | 设置跨域（`'anonymous'` / `'use-credentials'`） |
| `setPath(path)` | 设置基础路径 |
| `setResourcePath(path)` | 设置资源路径（优先级高于 path） |
| `setRequestHeader(name, value)` | 设置请求头 |
| `setWithCredentials(value)` | 是否携带凭证 |

## 四、LoadingManager（加载管理器）

```js
const manager = new THREE.LoadingManager(onLoad, onProgress, onError, itemStart, itemEnd, itemError)
```

| 回调 | 参数 | 说明 |
|---|---|---|
| `onLoad` | — | 所有项加载完成 |
| `onProgress` | `(url, itemsLoaded, itemsTotal)` | 每项完成 |
| `onError` | `(url)` | 加载失败 |
| `onItemStart` | `(url)` | 开始加载某项 |
| `onItemEnd` | `(url)` | 某项结束 |

| 方法 | 说明 |
|---|---|
| `itemStart(url)` / `itemEnd(url)` / `itemError(url)` | 手动报告状态 |
| `resolveURL(url)` | 自定义 URL 解析（可重写） |
| `addHandler(regex, loader)` | 为特定文件类型指定加载器 |
| `removeHandler(regex)` | 移除处理器 |
| `setURLModifier(fn)` | 修改 URL |

```js
const manager = new THREE.LoadingManager();
manager.onProgress = (url, loaded, total) => {
  console.log(`${loaded}/${total}`);
  updateProgressBar(loaded / total);
};
const texLoader = new THREE.TextureLoader(manager);
```

## 五、TextureLoader

```js
const loader = new THREE.TextureLoader(manager);
loader.load(url, onLoad, onProgress, onError);
```

`onLoad` 回调收到一个 `Texture` 对象。

## 六、其他常用加载器

| 加载器 | 导入路径 | 用途 |
|---|---|---|
| `CubeTextureLoader` | `three` | 加载 6 面立方体贴图 |
| `ImageBitmapLoader` | `three` | 用 ImageBitmap 异步解码（更快） |
| `FileLoader` | `three` | 通用二进制/文本 |
| `FontLoader` | `three/addons/loaders/FontLoader.js` | 字体（配合 TextGeometry） |
| `RGBELoader` | `three/addons/loaders/RGBELoader.js` | HDR 环境贴图（.hdr） |
| `EXRLoader` | `three/addons/loaders/EXRLoader.js` | EXR 环境贴图 |
| `GLTFLoader` | `three/addons/loaders/GLTFLoader.js` | GLTF/GLB 模型 |
| `DRACOLoader` | `three/addons/loaders/DRACOLoader.js` | DRACO 压缩解码 |
| `KTX2Loader` | `three/addons/loaders/KTX2Loader.js` | KTX2 压缩纹理 |
| `OBJLoader` / `MTLLoader` | `three/addons/loaders/...` | OBJ 模型 |
| `FBXLoader` | `three/addons/loaders/FBXLoader.js` | FBX 模型 |
| `STLLoader` | `three/addons/loaders/STLLoader.js` | STL 模型 |
| `SVGLoader` | `three/addons/loaders/SVGLoader.js` | SVG 转几何体 |

## 七、GLTFLoader 详解

```js
const loader = new THREE.GLTFLoader(manager);
loader.setDRACOLoader(dracoLoader);
loader.setKTX2Loader(ktx2Loader);
loader.setMeshoptDecoder(MeshoptDecoder);

loader.load(url, (gltf) => {
  // gltf 结构见下表
});
```

### gltf 返回对象

| 属性 | 说明 |
|---|---|
| `scene` | `Group`，场景根节点 |
| `scenes` | 所有场景数组 |
| `animations` | `AnimationClip[]` 动画片段 |
| `cameras` | 相机数组 |
| `asset` | 元数据（版本、生成器等） |
| `parser` | 解析器对象 |
| `userData` | 自定义数据 |

### 可重写方法

| 方法 | 说明 |
|---|---|
| `setDRACOLoader(loader)` | DRACO 压缩支持 |
| `setKTX2Loader(loader)` | KTX2 纹理支持 |
| `setMeshoptDecoder(decoder)` | Meshopt 压缩支持 |
| `setCrossOrigin(value)` | 跨域设置 |
| `parse(data, path, onLoad, onError)` | 手动解析 ArrayBuffer |
</script>

<script type="text/markdown" data-id="api-math" data-title="API 11 · 数学工具类全参考" data-group="API 速查手册">
# API 11 · 数学工具类全参考

## 一、Vector2

```js
new THREE.Vector2(x, y)
```

### 属性

| 属性 | 说明 |
|---|---|
| `x` / `y` | 分量 |

### 方法

| 方法 | 说明 |
|---|---|
| `set(x,y)` / `setX(x)` / `setY(y)` | 设置 |
| `copy(v)` / `clone()` | 复制 / 克隆 |
| `add(v)` / `addScalar(s)` / `addVectors(a,b)` | 加法 |
| `sub(v)` / `subVectors(a,b)` | 减法 |
| `multiply(v)` / `multiplyScalar(s)` | 乘法 |
| `divide(v)` / `divideScalar(s)` | 除法 |
| `negate()` | 取反 |
| `dot(v)` | 点积 |
| `cross(v)` | 叉积（返回标量） |
| `length()` / `lengthSq()` | 长度 |
| `normalize()` | 归一化长度为 1 |
| `distanceTo(v)` / `distanceToSq(v)` | 距离 |
| `angleTo(v)` | 夹角（弧度） |
| `lerp(v, alpha)` / `lerpVectors(v1,v2,alpha)` | 线性插值 |
| `clamp(min, max)` | 限制范围 |
| `min(v)` / `max(v)` | 逐分量取小/大 |
| `abs()` | 绝对值 |
| `round()` / `floor()` / `ceil()` | 取整 |
| `equals(v)` | 比较 |
| `fromArray(arr, offset)` / `toArray(arr, offset)` | 数组转换 |
| `setFromPoints(points)` | 从点集找极值 |

## 二、Vector3（最常用）

```js
new THREE.Vector3(x, y, z)
```

### 属性

| 属性 | 说明 |
|---|---|
| `x` / `y` / `z` | 分量 |

### 方法（在 Vector2 基础上）

| 方法 | 说明 |
|---|---|
| `cross(v)` | 叉积（返回 Vector3） |
| `crossVectors(a,b)` | 叉积到自身 |
| `applyMatrix3(m)` / `applyMatrix4(m)` | 应用矩阵变换 |
| `applyQuaternion(q)` | 应用四元数旋转 |
| `project(camera)` | 投影到 NDC（-1~1 屏幕坐标） |
| `unproject(camera)` | 从 NDC 反投影到世界 |
| `transformDirection(m)` | 变换方向（不含平移） |
| `setFromMatrixPosition(m)` / `setFromMatrixScale(m)` / `setFromMatrixColumn(m,i)` | 从矩阵提取 |
| `setFromCylindricalCoords(radius,theta,y)` | 柱坐标 |
| `setFromSphericalCoords(radius,phi,theta)` | 球坐标 |
| `setFromEuler(e)` | 从欧拉角 |
| `setFromQuaternion(q)` | 从四元数 |
| `setLength(l)` | 设置长度 |
| `setScalar(s)` | 三分量都设为 s |

```js
const v = new THREE.Vector3(1, 0, 0);
v.normalize();                    // 单位向量
v.applyQuaternion(mesh.quaternion); // 按物体旋转
const screen = v.clone().project(camera); // 转屏幕坐标
```

::: plain 大白话时间
`applyMatrix4` 用于**位置**变换（含平移旋转缩放），`transformDirection` 用于**方向**变换（只旋转缩放，不平移）。法线向量用后者。
:::

## 三、Vector4

```js
new THREE.Vector4(x, y, z, w)
```

方法同 Vector3，多了 `w` 分量（齐次坐标、四元数存储）。常用于着色器 uniform、四元数分量。

## 四、Color（颜色）

```js
new THREE.Color(r, g, b)  // 或 0xRRGGBB、'#rrggbb'、'rgb()'、颜色名
```

### 属性

| 属性 | 说明 |
|---|---|
| `r` / `g` / `b` | 分量，0~1 |

### 方法

| 方法 | 说明 |
|---|---|
| `set(value)` | 万能设置（数字/字符串/Color） |
| `setHex(hex, colorSpace)` | 十六进制 |
| `setRGB(r,g,b, colorSpace)` | RGB 浮点 |
| `setHSL(h,s,l, colorSpace)` | HSL |
| `setStyle(style, colorSpace)` | CSS 字符串 |
| `getHex(colorSpace)` | 取十六进制整数 |
| `getHexString(colorSpace)` | 取十六进制字符串 |
| `getStyle(colorSpace)` | 取 CSS 字符串 |

c.offsetHSL(0, 0, 0.1);      // 亮 10%
const hex = c.getHexString(); // '42b883'

## 五、Euler（欧拉角）

```js
new THREE.Euler(x, y, z, order)
```

### 属性

| 属性 | 说明 |
|---|---|
| `x` / `y` / `z` | 弧度 |
| `order` | 旋转顺序，默认 `'XYZ'`，可选 `'YXZ'`、`'ZYX'` 等 12 种 |
| `isEuler` | `true` |

### 方法

| 方法 | 说明 |

| `set(x,y,z,order)` | 设置 |

| `copy()` / `clone()` / `equals()` | 复制等 |
| `toArray()` / `fromArray()` | 数组转换 |

::: plain 大白话时间
旋转顺序很重要：先绕 X 转再绕 Y，和反过来结果不同。做第一人称相机用 `'YXZ'`（先左右后上下），能避免万向节死锁导致的怪异翻转。

<script type="text/markdown" data-id="api-raycaster" data-title="API 12 · Raycaster 与交互" data-group="API 速查手册">
# API 12 · Raycaster 与交互

## 一、Raycaster（射线投射器）

```js
new THREE.Raycaster(origin, direction, near, far)
```

### 构造参数

| 参数 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `origin` | `Vector3` | `(0,0,0)` | 射线起点 |
| `direction` | `Vector3` | `(0,0,-1)` | 方向（单位向量） |
| `near` | `number` | `0` | 最近检测距离 |
| `far` | `number` | `Infinity` | 最远检测距离 |

### 属性

| 属性 | 说明 |
|---|---|
| `ray` | `Ray` 对象，可读写的起点和方向 |
| `near` / `far` | 检测距离范围 |
| `layers` | `Layers`，只检测匹配层的物体 |
| `params` | 各类物体的检测参数（见下） |
| `camera` | 由 setFromCamera 设置的相机 |

### params 详细配置

```js
raycaster.params = {
  Mesh: {},
  Line: { threshold: 1 },
  LOD: {},
  Points: { threshold: 1 },
  Sprite: {}
};
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `Line.threshold` | `1` | 线的检测半径（世界单位），线太细需要调大 |
| `Points.threshold` | `1` | 点的检测半径 |

::: plain 大白话时间
线和点是没有「粗细」的数学概念，射线很难正好命中。threshold 给它们一个虚拟的「碰撞半径」——调大一点更容易点中。
:::

### 方法

| 方法 | 参数 | 说明 |
|---|---|---|
| `set(origin, direction)` | `Vector3, Vector3` | 设置起点和方向 |
| `setFromCamera(coords, camera)` | `Vector2, Camera` | 从屏幕坐标设置（coords 是 -1~1 的 NDC） |
| `intersectObject(object, recursive, optionalTarget)` | `Object3D, boolean, Array` | 检测单个物体 |
| `intersectObjects(objects, recursive, optionalTarget)` | `Array, boolean, Array` | 检测多个物体 |
| `intersectObjectAsync(...)` | 同上 | 异步版本（BVH 用，返回 Promise） |
| `intersectObjectsAsync(...)` | 同上 | 异步版本 |
| `clone()` | — | 克隆 |

### 检测结果（intersection 对象）

| 属性 | 说明 |
|---|---|
| `distance` | 到交点的距离 |
| `point` | 交点世界坐标 `Vector3` |
| `object` | 被击中的物体 |
| `face` | 三角面 `{a,b,c,normal,materialIndex}` |
| `faceIndex` | 面的索引 |
| `uv` / `uv1` / `uv2` / `uv3` | 各套 UV 坐标 |
| `normal` | 插值后的法线 |
| `instanceId` | InstancedMesh 的实例索引 |
| `barycoord` | 重心坐标 |

结果按**距离从近到远**排序，`[0]` 是最近的。

```js
const hits = raycaster.intersectObjects(scene.children, true);
hits.forEach(hit => {
  console.log(hit.object.name, hit.distance, hit.point);
});
```

## 二、鼠标坐标转 NDC

::: warning 关键
`pointermove` 事件给的是像素坐标，必须转成 -1~1 的 NDC，Y 轴还要翻转。
:::

```js
const mouse = new THREE.Vector2();
addEventListener('pointermove', e => {
  mouse.x =  (e.clientX / innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});

// 检测
raycaster.setFromCamera(mouse, camera);
const hits = raycaster.intersectObjects(objects, false);
```

## 三、性能优化：BVH

物体很多时，逐三角检测很慢。用 **three-mesh-bvh** 库加速：

```bash
npm install three-mesh-bvh
```

```js
import { computeBoundsTree, disposeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';

THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree = disposeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

geometry.computeBoundsTree(); // 建 BVH
```

::: plain 大白话时间
BVH（包围体层次）就像书的目录——不用一页页翻，先定位到大概章节再细找。百万面模型也能瞬间拾取。
:::

## 四、其他交互相关

### 射线应用速查

| 用途 | 做法 |
|---|---|
| 鼠标悬停高亮 | pointermove + intersectObject |
| 点击拾取 | click + intersectObjects |
| 角色贴地 | 从脚底向下发射线检测地面 |
| 射击命中 | 从枪口沿朝向发射线 |
| 测量距离 | 点两次取 point 算距离 |
| 拖拽物体 | DragControls 或手动更新位置 |

## 五、PointerLockControls（第一人称）

```js
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

const controls = new PointerLockControls(camera, document.body);
controls.lock();   // 锁定鼠标（需用户交互触发）
controls.unlock(); // 解锁

// 事件
controls.addEventListener('lock', ...);
controls.addEventListener('unlock', ...);

// 移动
controls.moveForward(distance);
controls.moveRight(distance);
```

| 属性 | 说明 |
|---|---|
| `isLocked` | 是否锁定 |
| `minPolarAngle` / `maxPolarAngle` | 上下视角限制 |
| `pointerSpeed` | 鼠标灵敏度 |
</script>

<script type="text/markdown" data-id="api-animation" data-title="API 13 · 动画系统全参考" data-group="API 速查手册">
# API 13 · 动画系统全参考

## 一、Timer（计时器，r183+ 推荐）

```js
const timer = new THREE.Timer();
```

### 属性

| 属性 | 说明 |
|---|---|
| `_delta` | 内部 delta 值（秒） |
| `_elapsed` | 内部累计时间（秒） |

### 方法

| 方法 | 参数 | 说明 |
|---|---|---|
| `update(timestamp)` | `number`（可选） | 每帧调用，更新内部计时；不传参更安全 |
| `getDelta()` | — | 距上一帧的秒数 |
| `getElapsed()` | — | 累计秒数 |
| `getTimescale()` | — | 时间缩放系数 |
| `setTimescale(value)` | `number` | 设置时间缩放（0.5=慢动作，2=快进） |
| `connect(document)` | `Document` | 恢复页面可见性处理（切后台暂停） |
| `disconnect()` | — | 断开 |
| `reset()` | — | 重置 |

```js
const timer = new THREE.Timer();
renderer.setAnimationLoop(() => {
  timer.update();
  const dt = timer.getDelta();
  const t = timer.getElapsed();
  mesh.rotation.y += dt;
  renderer.render(scene, camera);
});
```

::: plain 大白话时间
`Timer` 取代了老版的 `Clock`（r183 起废弃）。核心区别：Timer 需要你**手动调用 `update()`**，然后才能 `getDelta()`。

`delta` 是「这一帧过了多少秒」——乘上它，动画速度就和设备帧率无关了。
:::

::: warning 注意
r186/r187 里，切到后台再回来时，如果给 `update(timestamp)` 传的时间戳早于内部重置时间，可能得到**负的 delta**，导致物体瞬移。解决：调用 `update()` 时**不传参数**，并对 delta 做 clamp：`Math.min(timer.getDelta(), 0.1)`。
:::

## 二、AnimationMixer（动画播放器）

```js
const mixer = new THREE.AnimationMixer(root)
```

| 参数 | 说明 |
|---|---|
| `root` | 动画作用的对象（通常是 GLTF 的 scene） |

### 属性

| 属性 | 默认值 | 说明 |
|---|---|---|
| `time` | `0` | 当前时间（秒） |
| `timeScale` | `1` | 时间缩放（负数=倒放） |
| `root` | — | 根对象 |
| `actions` | `[]` | 所有 AnimationAction |
| `listeners` / `timeBindings` / `propertyBindings` | — | 内部数据 |

### 方法

| 方法 | 参数 | 说明 |
|---|---|---|
| `clipAction(clip, optionalRoot, blendMode)` | `AnimationClip, Object3D, constant` | 获取/创建动作 |
| `existingAction(clip, optionalRoot)` | — | 查找已有动作 |
| `stopAllAction()` | — | 停止所有动作 |
| `update(deltaTime)` | `number` | **每帧调用**，推进动画 |
| `setTime(timeInSeconds)` | `number` | 跳到指定时间 |
| `getRoot()` | — | 返回根对象 |
| `uncacheClip(clip)` / `uncacheRoot(root)` / `uncacheAction(action)` | — | 清除缓存 |
| `addEventListener` 等 | — | 事件：`'finished'` |

```js
mixer.update(delta); // 动画循环里必须有这行
```

## 三、AnimationClip（动画片段）

```js
new THREE.AnimationClip(name, duration, tracks)
```

| 参数 | 说明 |
|---|---|
| `name` | 名字（如 `'walk'`） |
| `duration` | 时长（秒），-1 表示自动计算 |
| `tracks` | `KeyframeTrack[]` 关键帧轨道 |

### 静态/实例方法

| 方法 | 说明 |
|---|---|
| `AnimationClip.parse(json)` | 从 JSON 创建 |
| `AnimationClip.CreateFromMorphTargetSequence(...)` | 从 morph 目标创建 |
| `clip.duration` | 时长 |
| `clip.tracks` | 轨道数组 |
| `clip.name` | 名字 |
| `clip.resetDuration()` | 重算时长 |
| `clip.optimize()` | 优化关键帧 |
| `clip.clone()` | 克隆 |

## 四、AnimationAction（动作实例）

由 `mixer.clipAction()` 返回。

### 属性

| 属性 | 默认值 | 说明 |
|---|---|---|
| `loop` | `LoopRepeat` | 循环模式：`LoopOnce` / `LoopRepeat` / `LoopPingPong` |
| `repetitions` | `Infinity` | 重复次数 |
| `timeScale` | `1` | 播放速度 |
| `weight` | `1` | 混合权重（0~1） |
| `clampWhenFinished` | `false` | 结束后停在最后一帧 |
| `paused` | `false` | 是否暂停 |
| `enabled` | `true` | 是否启用 |
| `time` | `0` | 当前时间 |
| `zeroSlopeAtStart` / `zeroSlopeAtEnd` | `true` | 循环边界平滑 |

### 方法

| 方法 | 说明 |
|---|---|
| `play()` | 播放 |
| `stop()` | 停止并重置 |
| `pause()` / `unpause()` | 暂停/继续 |
| `reset()` | 重置到开始 |
| `setLoop(mode, repetitions)` | 设置循环 |
| `setEffectiveWeight(weight)` | 设置有效权重 |
| `setEffectiveTimeScale(scale)` | 设置有效时间缩放 |
| `fadeIn(duration)` / `fadeOut(duration)` | 淡入/淡出 |
| `crossFadeFrom(action, duration, warp)` | 交叉淡出到另一个动作 |
| `crossFadeTo(action, duration, warp)` | 交叉淡入 |
| `getMixer()` / `getClip()` | 获取 mixer / clip |
| `isRunning()` / `isScheduled()` | 状态查询 |

```js
// 从走路平滑切换到跑步
actions.walk.fadeOut(0.5);
actions.run.reset().setEffectiveWeight(1).fadeIn(0.5).play();
```

## 五、KeyframeTrack（关键帧轨道）

| 子类 | 用途 |
|---|---|
| `VectorKeyframeTrack` | 位置、缩放（Vector3） |
| `QuaternionKeyframeTrack` | 旋转（四元数） |
| `NumberKeyframeTrack` | 数值（如 opacity） |
| `ColorKeyframeTrack` | 颜色 |
| `BooleanKeyframeTrack` | 布尔 |

```js
new THREE.VectorKeyframeTrack('.position', [0, 1, 2], [0,0,0, 1,1,1, 0,0,0]);
```

| 属性 | 说明 |
|---|---|
| `name` | 属性路径，如 `.position`、`.material.opacity`、`.bones[0].position` |
| `times` | 时间点数组 |
| `values` | 值数组 |
| `interpolation` | 插值方式：`InterpolateLinear` / `InterpolateSmooth` / `InterpolateDiscrete` |

| 方法 | 说明 |
|---|---|
| `optimize()` / `clone()` | 优化/克隆 |
| `getMaxTime()` / `getValues()` / `getTimes()` | 读取 |

## 六、PropertyBinding（属性绑定）

负责把轨道数据绑定到对象属性。一般不用手动操作，GLTFLoader 自动生成。

路径语法：`对象名.属性名[索引].子属性`，如 `'mesh.position'`、`'scene.children[0].material.color'`

## 七、AnimationUtils

| 静态方法 | 说明 |
|---|---|
| `AnimationUtils.lerp(a, b, t)` | 插值（支持数字、向量、四元数等） |
| `AnimationUtils.arraySlice(array, begin, end)` | 数组切片 |
| `AnimationUtils.convertArray(array, toType)` | 类型转换 |

## 八、常见动画流程模板

```js
// 1. 加载带动画的模型
let mixer, actions;
loader.load('model.glb', gltf => {
  mixer = new THREE.AnimationMixer(gltf.scene);
  gltf.animations.forEach(clip => {
    actions[clip.name] = mixer.clipAction(clip);
  });
  actions[gltf.animations[0].name].play();
  scene.add(gltf.scene);
});

// 2. 动画循环
renderer.setAnimationLoop(() => {
  const dt = Math.min(timer.getDelta(), 0.1);
  timer.update();
  if (mixer) mixer.update(dt);
  renderer.render(scene, camera);
});
```
</script>

<script type="text/markdown" data-id="api-controls" data-title="API 14 · 控制器全参考" data-group="API 速查手册">
# API 14 · 控制器全参考

所有控制器都在 `three/addons/controls/` 下。

## 一、OrbitControls（轨道控制器）

```js
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const controls = new OrbitControls(camera, domElement);
```

### 构造参数

| 参数 | 说明 |
|---|---|
| `object` | 要控制的相机 |
| `domElement` | 监听事件的元素，默认 `document.body` |

### 属性（完整）

**状态**

| 属性 | 默认值 | 说明 |
|---|---|---|
| `enabled` | `true` | 总开关 |
| `target` | `(0,0,0)` | 围绕的点 |
| `object` | — | 被控制的相机 |
| `domElement` | — | 事件元素 |
| `state` | — | 当前状态（只读） |

**阻尼（惯性）**

| 属性 | 默认值 | 说明 |
|---|---|---|
| `enableDamping` | `false` | 启用惯性（手感更好） |
| `dampingFactor` | `0.05` | 阻尼系数，越小越顺滑 |

::: warning 注意
启用 `enableDamping` 后，**必须每帧调用 `controls.update()`**，否则阻尼效果失效甚至相机不动。
:::

**旋转**

| 属性 | 默认值 | 说明 |
|---|---|---|
| `enableRotate` | `true` | 允许旋转 |
| `rotateSpeed` | `1` | 旋转速度 |
| `autoRotate` | `false` | 自动旋转 |
| `autoRotateSpeed` | `2` | 自动旋转速度 |
| `minPolarAngle` | `0` | 最小极角（弧度，0=正上方） |
| `maxPolarAngle` | `π` | 最大极角（π=正下方） |
| `minAzimuthAngle` | `-Infinity` | 最小方位角 |
| `maxAzimuthAngle` | `Infinity` | 最大方位角 |

**缩放**

| 属性 | 默认值 | 说明 |
|---|---|---|
| `enableZoom` | `true` | 允许缩放 |
| `zoomSpeed` | `1` | 缩放速度 |
| `minDistance` | `0` | 最近距离（透视相机） |
| `maxDistance` | `Infinity` | 最远距离 |
| `minZoom` | `0` | 最小 zoom（正交相机） |
| `maxZoom` | `Infinity` | 最大 zoom |

**平移**

| 属性 | 默认值 | 说明 |
|---|---|---|
| `enablePan` | `true` | 允许平移 |
| `panSpeed` | `1` | 平移速度 |
| `screenSpacePanning` | `true` | 屏幕空间平移（false=沿世界 Y 轴） |
| `keyPanSpeed` | `7` | 键盘平移速度 |
| `maxTargetRadius` | `Infinity` | target 离原点的最大距离 |

**鼠标按键映射**

| 属性 | 默认值 | 说明 |
|---|---|---|
| `mouseButtons.LEFT` | `ROTATE` | 左键行为 |
| `mouseButtons.MIDDLE` | `DOLLY` | 中键行为 |
| `mouseButtons.RIGHT` | `PAN` | 右键行为 |

可选值：`THREE.MOUSE.ROTATE` / `DOLLY` / `PAN`

**触摸映射**

| 属性 | 默认值 | 说明 |
|---|---|---|
| `touches.ONE` | `ROTATE` | 单指 |
| `touches.TWO` | `DOLLY_PAN` | 双指 |

可选值：`TOUCH.ROTATE` / `PAN` / `DOLLY_PAN` / `DOLLY_ROTATE`

### 方法

| 方法 | 说明 |
|---|---|
| `update()` | 更新控制器（用阻尼时必须每帧调用） |
| `listenToKeyEvents(domElement)` | 监听键盘事件（方向键平移） |
| `stopListenToKeyEvents()` | 停止键盘监听 |
| `saveState()` | 保存当前状态 |
| `reset()` | 重置到保存的状态 |
| `dispose()` | 移除所有事件监听 |
| `getDistance()` / `getPolarAngle()` / `getAzimuthalAngle()` | 获取当前状态 |
| `connect(domElement)` / `disconnect()` | 连接/断开 DOM |

### 事件

| 事件 | 触发时机 |
|---|---|
| `'change'` | 相机变化时 |
| `'start'` | 用户开始交互 |
| `'end'` | 用户结束交互 |

```js
controls.addEventListener('change', () => renderer.render(scene, camera));
```

## 二、MapControls（地图控制器）

继承 OrbitControls，只是默认鼠标按键不同（左键=PAN，右键=ROTATE）。属性方法完全相同。

## 三、FlyControls（飞行控制器）

像开飞机——WASD 前后左右，鼠标转向。

| 属性 | 默认值 | 说明 |
|---|---|---|
| `movementSpeed` | `1` | 移动速度 |
| `rollSpeed` | `0.005` | 翻滚速度 |
| `dragToLook` | `false` | 是否按住拖拽才转向 |
| `autoForward` | `false` | 自动前进 |

| 方法 | 说明 |
|---|---|
| `update(deltaTime)` | 每帧更新（需要传 delta） |
| `dispose()` | 清理 |

## 四、PointerLockControls（第一人称）

见上一章 Raycaster 部分。

## 五、TransformControls（变换工具）

编辑器风格的 xyz 轴操作手柄。

```js
import { TransformControls } from 'three/addons/controls/TransformControls.js';
const transform = new TransformControls(camera, renderer.domElement);
transform.attach(mesh);
scene.add(transform.getHelper()); // r169+ 需要用 getHelper()
```

| 属性/方法 | 说明 |
|---|---|
| `mode` | `'translate'` / `'rotate'` / `'scale'` |
| `space` | `'world'` / `'local'` |
| `size` | 手柄大小 |
| `translationSnap` / `rotationSnap` / `scaleSnap` | 吸附步长 |
| `showX` / `showY` / `showZ` | 显示哪些轴 |
| `attach(object)` / `detach()` | 附加/分离物体 |
| `getHelper()` | 获取要加入场景的辅助对象 |
| `axis` | 当前选中的轴 |
| `dragging` | 是否正在拖拽 |

```js
// 拖拽物体时禁用轨道控制，避免冲突
transform.addEventListener('dragging-changed', e => {
  orbit.enabled = !e.value;
});
```

## 六、其他控制器

| 控制器 | 说明 |
|---|---|
| `DragControls` | 直接拖拽物体（基于 Raycaster） |
| `TrackballControls` | 轨迹球，无极角限制 |
| `ArcballControls` | 科学可视化常用的弧球控制 |
| `FirstPersonControls` | 老式第一人称（鼠标看+键盘走） |
| `DeviceOrientationControls` | 手机陀螺仪控制 |

## 七、控制器选择速查

| 需求 | 控制器 |
|---|---|
| 产品展示、模型查看 | OrbitControls |
| 地图/平面图 | MapControls |
| 第一人称游戏 | PointerLockControls |
| 自由飞行漫游 | FlyControls |
| 3D 编辑器 | TransformControls + OrbitControls |
| 拖动物体 | DragControls |
| 分子/科学可视化 | ArcballControls |
</script>

<script type="text/markdown" data-id="api-objects" data-title="API 15 · 物体类型全参考" data-group="API 速查手册">
# API 15 · 物体类型全参考

## 一、Mesh（网格）

```js
new THREE.Mesh(geometry, material)
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `geometry` | `BufferGeometry` | 几何体 |
| `material` | `Material` | 材质（可以是数组，配合 geometry.groups） |

### 属性

| 属性 | 说明 |
|---|---|
| `geometry` | 几何体 |
| `material` | 材质或材质数组 |
| `isMesh` | `true` |

继承 Object3D 的所有属性（position/rotation/scale/visible/castShadow 等）。

### 方法

| 方法 | 说明 |
|---|---|
| `raycast(raycaster, intersects)` | 射线检测（内部用） |

## 二、Line / LineSegments / LineLoop

```js
new THREE.Line(geometry, material)
new THREE.LineSegments(geometry, material)
new THREE.LineLoop(geometry, material)
```

| 类 | 说明 |
|---|---|
| `Line` | 把顶点依次连成一条线 |
| `LineSegments` | 每两个顶点连一条独立线段 |
| `LineLoop` | 首尾相连的闭合线 |

| 方法 | 说明 |
|---|---|
| `computeLineDistances()` | 计算线距离（虚线材质必须调用） |

```js
const geo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(0,0,0),
  new THREE.Vector3(1,2,0),
  new THREE.Vector3(2,0,0)
]);
const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xff0000 }));
line.computeLineDistances(); // 用 LineDashedMaterial 时
```

## 三、Points（点/粒子）

```js
new THREE.Points(geometry, material)
```

几何体的每个顶点渲染成一个点。材质用 `PointsMaterial`。

## 四、Sprite（精灵）

```js
new THREE.Sprite(material)
```

永远面向相机的平面，做标签、图标、火焰。

| 属性 | 默认值 | 说明 |
|---|---|---|
| `material` | `SpriteMaterial` | 材质 |
| `center` | `(0.5,0.5)` | 对齐中心点 |

## 五、InstancedMesh（实例化网格）

一次 draw call 渲染大量相同物体。

```js
new THREE.InstancedMesh(geometry, material, count)
```

| 参数 | 说明 |
|---|---|
| `count` | 实例数量 |

### 属性

| 属性 | 说明 |
|---|---|
| `count` | 实际渲染的实例数（可动态改，<= 初始 count） |
| `instanceMatrix` | `InstancedBufferAttribute`，所有实例的变换矩阵 |
| `instanceColor` | `InstancedBufferAttribute \| null`，所有实例的颜色 |
| `morphTexture` | morph 目标纹理 |

### 方法

| 方法 | 说明 |
|---|---|
| `setMatrixAt(index, matrix)` | 设置第 i 个实例的变换 |
| `getMatrixAt(index, matrix)` | 读取变换 |
| `setColorAt(index, color)` | 设置第 i 个实例的颜色 |
| `getColorAt(index, color)` | 读取颜色 |
| `setMorphAt(index, mesh)` | 设置 morph |
| `computeBoundingBox()` / `computeBoundingSphere()` | 计算包围体 |
| `dispose()` | 释放 |

```js
const dummy = new THREE.Object3D();
for (let i = 0; i < count; i++) {
  dummy.position.set(/* ... */);
  dummy.updateMatrix();
  instanced.setMatrixAt(i, dummy.matrix);
}
instanced.instanceMatrix.needsUpdate = true; // 关键！
```

::: warning 注意
改完 `instanceMatrix` 或 `instanceColor` 必须设 `needsUpdate = true`，否则 GPU 不知道数据变了。
:::

## 六、BatchedMesh（批处理网格，r165+）

比 InstancedMesh 更灵活——可以在一个 draw call 里渲染**不同几何体、不同材质**的物体。

```js
new THREE.BatchedMesh(maxInstanceCount, maxVertexCount, maxIndexCount, material)
```

| 方法 | 说明 |
|---|---|
| `addGeometry(geometry, reservedVertexCount, reservedIndexCount)` | 添加几何体，返回 geometryId |
| `addInstance(geometryId)` | 添加实例，返回 instanceId |
| `setMatrixAt(instanceId, matrix)` | 设置变换 |
| `setColorAt(instanceId, color)` | 设置颜色 |
| `setVisibleAt(instanceId, visible)` | 单独控制可见性 |
| `deleteInstance(instanceId)` | 删除实例 |

适合需要大量不同模型的场景（比如一座城市里各种建筑）。

## 七、LOD（细节层级）

```js
const lod = new THREE.LOD();
```

| 属性/方法 | 说明 |
|---|---|
| `levels` | 层级数组 |
| `autoUpdate` | 是否自动切换（默认 true） |
| `addLevel(object, distance, hysteresis)` | 添加层级：距离 >= distance 时显示 |
| `getCurrentLevel()` | 当前层级索引 |
| `getObjectForDistance(distance)` | 指定距离用哪个物体 |
| `raycast()` | 只对当前层级检测 |

```js
lod.addLevel(highMesh, 0);
lod.addLevel(midMesh, 20);
lod.addLevel(lowMesh, 50);
scene.add(lod);
```

## 八、SkinnedMesh / Bone（骨骼动画）

```js
const skeleton = new THREE.Skeleton(bones);
const mesh = new THREE.SkinnedMesh(geometry, material);
mesh.bind(skeleton);
```

| SkinnedMesh 属性/方法 | 说明 |
|---|---|
| `skeleton` | 骨骼系统 |
| `bindMode` | `'attached'` / `'detached'` |
| `bind(skeleton, bindMatrix)` | 绑定 |
| `normalizeSkinWeights()` | 归一化蒙皮权重 |
| `boneTransform(index, target)` | 骨骼变换 |

一般不需要手写——GLTFLoader 会自动创建。

## 九、Group / Object3D

见前面章节。

## 十、物体类型判断速查

| 判断属性 | 物体类型 |
|---|---|
| `isMesh` | Mesh / SkinnedMesh / InstancedMesh |
| `isInstancedMesh` | InstancedMesh |
| `isBatchedMesh` | BatchedMesh |
| `isLine` / `isLineSegments` / `isLineLoop` | 线 |
| `isPoints` | 粒子 |
| `isSprite` | 精灵 |
| `isLOD` | LOD |
| `isBone` | 骨骼 |
| `isSkinnedMesh` | 蒙皮网格 |
| `isLight` / `isCamera` / `isScene` | 灯 / 相机 / 场景 |
</script>

<script type="text/markdown" data-id="api-postprocessing" data-title="API 16 · 后期处理全参考" data-group="API 速查手册">
# API 16 · 后期处理全参考

## 一、EffectComposer（合成器）

```js
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
const composer = new EffectComposer(renderer, renderTarget);
```

| 参数 | 说明 |
|---|---|
| `renderer` | 渲染器 |
| `renderTarget` | 可选，自定义渲染目标 |

### 属性

| 属性 | 说明 |
|---|---|
| `renderTarget1` / `renderTarget2` | 两个乒乓缓冲 |
| `writeBuffer` / `readBuffer` | 当前写/读缓冲 |
| `passes` | Pass 数组 |
| `copyPass` | 内部拷贝 Pass |
| `renderToScreen` | 是否渲染到屏幕 |

### 方法

| 方法 | 说明 |
|---|---|
| `addPass(pass)` | 添加 Pass |
| `insertPass(pass, index)` | 插入到指定位置 |
| `removePass(pass)` | 移除 |
| `render(deltaTime)` | 执行所有 Pass |
| `setSize(width, height)` | 设置尺寸 |
| `setPixelRatio(value)` | 设置像素比 |
| `reset(renderTarget)` | 重置 |
| `dispose()` | 释放 |

## 二、Pass（基类）

所有 Pass 的父类。

| 属性 | 默认值 | 说明 |
|---|---|---|
| `enabled` | `true` | 是否启用 |
| `needsSwap` | `true` | 渲染后是否交换缓冲 |
| `clear` | `false` | 渲染前是否清屏 |
| `renderToScreen` | `false` | 是否直接渲染到屏幕 |

| 方法 | 说明 |
|---|---|
| `render(renderer, writeBuffer, readBuffer, deltaTime, maskActive)` | 执行渲染 |
| `setSize(width, height)` | 尺寸变化 |
| `dispose()` | 释放 |

## 三、常用 Pass 详解

### RenderPass（场景渲染）

```js
new THREE.RenderPass(scene, camera, overrideMaterial, clearColor, clearAlpha)
```

| 参数 | 说明 |
|---|---|
| `scene` / `camera` | 场景和相机 |
| `overrideMaterial` | 覆盖材质 |
| `clearColor` / `clearAlpha` | 清屏颜色 |

必须是**第一个** Pass。

### OutputPass（输出）

```js
new THREE.OutputPass()
```

无参数。做最终的颜色空间转换和色调映射。r152+ 建议作为**最后一个** Pass。

### UnrealBloomPass（泛光）

```js
new THREE.UnrealBloomPass(resolution, strength, radius, threshold)
```

| 参数 | 默认值 | 说明 |
|---|---|---|
| `resolution` | — | `Vector2`，分辨率 |
| `strength` | `1` | 泛光强度 |
| `radius` | `0` | 扩散半径 |
| `threshold` | `0` | 亮度阈值（超过才发光） |

| 属性 | 说明 |
|---|---|
| `strength` / `radius` / `threshold` | 可运行时调整 |
| `highPassUniforms` | 高通滤波参数 |

### BokehPass（景深）

```js
new THREE.BokehPass(scene, camera, params)
```

| params | 默认值 | 说明 |
|---|---|---|
| `focus` | `1` | 对焦距离 |
| `aperture` | `0.025` | 光圈（越大越糊） |
| `maxblur` | `1` | 最大模糊量 |
| `width` / `height` | 窗口尺寸 | 分辨率 |

### OutlinePass（描边）

```js
new THREE.OutlinePass(resolution, scene, camera, selectedObjects)
```

| 属性 | 默认值 | 说明 |
|---|---|---|
| `selectedObjects` | `[]` | 要描边的物体 |
| `edgeStrength` | `3` | 边缘强度 |
| `edgeGlow` | `0` | 发光强度 |
| `edgeThickness` | `1` | 边缘厚度 |
| `pulsePeriod` | `0` | 脉冲周期（0=不闪） |
| `visibleEdgeColor` | `0xffffff` | 可见边颜色 |
| `hiddenEdgeColor` | `0x190a05` | 被遮挡边颜色 |
| `usePatternTexture` | `false` | 图案纹理 |

### ShaderPass（自定义着色器 Pass）

```js
new THREE.ShaderPass(shader, textureID)
```

| 参数 | 说明 |
|---|---|
| `shader` | `{ uniforms, vertexShader, fragmentShader }` |
| `textureID` | 输入纹理的 uniform 名，默认 `'tDiffuse'` |

| 属性 | 说明 |
|---|---|
| `uniforms` | 着色器 uniform |
| `material` | ShaderMaterial |

### FXAA / SMAA（抗锯齿）

```js
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';
const fxaa = new ShaderPass(FXAAShader);
fxaa.material.uniforms.resolution.value.set(1/w, 1/h);

import { SMAAPass } from 'three/addons/postprocessing/SMAAPass.js';
const smaa = new SMAAPass(w, h);
```

### 其他 Pass

| Pass | 效果 |
|---|---|
| `FilmPass` | 胶片颗粒、扫描线 |
| `GlitchPass` | 故障/干扰 |
| `DotScreenPass` | 网点印刷 |
| `HalftonePass` | 半色调 |
| `RGBShiftShader` | RGB 色差 |
| `BleachBypassShader` | 漂白旁路 |
| `AfterimagePass` | 运动残影 |
| `SSAOPass` | 屏幕空间环境光遮蔽 |
| `SAOPass` | 改进的 AO |
| `GTAOPass` | 高质量 AO |
| `SSRPass` | 屏幕空间反射 |
| `LuminosityHighPassShader` | 亮度高通（Bloom 内部用） |
| `ClearPass` / `TexturePass` | 清屏 / 贴图 |

## 四、标准组合模板

```js
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(w,h), 1.2, 0.4, 0.85));
composer.addPass(new OutputPass());

renderer.setAnimationLoop(() => {
  composer.render(); // 注意：不是 renderer.render()
});
```

::: warning 注意
用了 EffectComposer 后：
1. 用 `composer.render()` 替代 `renderer.render()`
2. 最后一个 Pass 加 `OutputPass`（负责 sRGB 转换和色调映射）
3. Pass 数量控制在 2~3 个，多了手机会卡
:::
</script>

<script type="text/markdown" data-id="api-audio" data-title="API 17 · 音频系统全参考" data-group="API 速查手册">
# API 17 · 音频系统全参考

Three.js 用 Web Audio API 封装了一套 3D 音频系统。

## 一、AudioListener（音频监听器）

相当于「玩家的耳朵」，一个场景只需一个。

```js
const listener = new THREE.AudioListener();
camera.add(listener); // 通常挂在相机上
```

| 属性/方法 | 说明 |
|---|---|
| `context` | AudioContext 对象 |
| `gain` | 主音量 GainNode |
| `timeDelta` | 时间增量 |
| `setMasterVolume(value)` | 设置主音量 0~1 |
| `getMasterVolume()` | 读取主音量 |

::: warning 注意
浏览器要求**用户交互后才能播放音频**。首次播放前需要用户点击页面，否则 AudioContext 处于 suspended 状态。可以调用 `listener.context.resume()`。
:::

## 二、Audio（普通音频）

非空间音频，音量恒定。

```js
const sound = new THREE.Audio(listener);
new THREE.AudioLoader().load('sound.mp3', buffer => {
  sound.setBuffer(buffer);
  sound.play();
});
```

| 属性 | 说明 |
|---|---|
| `buffer` | AudioBuffer |
| `isPlaying` | 是否播放中 |
| `hasPlaybackControl` | `true` |
| `sourceType` | `'audio'` |

| 方法 | 说明 |
|---|---|
| `setBuffer(buffer)` | 设置音频缓冲 |
| `play(delay)` | 播放（延迟秒数） |
| `pause()` / `resume()` / `stop()` | 暂停/继续/停止 |
| `setVolume(value)` / `getVolume()` | 音量 |
| `setLoop(value)` / `getLoop()` | 循环 |
| `setPlaybackRate(value)` / `getPlaybackRate()` | 播放速率 |
| `isPlaying` | 状态查询 |

## 三、PositionalAudio（空间音频）

带 3D 位置感——离得近音量大，有左右声像。

```js
const sound = new THREE.PositionalAudio(listener);
sound.setRefDistance(1);
sound.setDistanceModel('inverse');
mesh.add(sound);
sound.play();
```

在 Audio 基础上增加：

| 方法 | 默认值 | 说明 |
|---|---|---|
| `setRefDistance(value)` | `1` | 参考距离（这个距离内音量不衰减） |
| `getRefDistance()` | — | 读取 |
| `setRolloffFactor(value)` | `1` | 衰减速度 |
| `setDistanceModel(value)` | `'inverse'` | 衰减模型：`'linear'` / `'inverse'` / `'exponential'` |
| `setMaxDistance(value)` | `10000` | 最大距离（linear 模型有效） |
| `setDirectionalCone(inner, outer, outerGain)` | `360,360,0` | 定向声音锥（角度） |
| `getPanner()` | — | PannerNode |

衰减模型：

| 模型 | 说明 |
|---|---|
| `linear` | 线性衰减，到 maxDistance 为 0 |
| `inverse` | 反比衰减（默认，最自然）：`refDistance / (refDistance + rolloff*(d-refDistance))` |
| `exponential` | 指数衰减：`pow(d/refDistance, -rolloff)` |

## 四、AudioAnalyser（音频分析）

做音乐可视化（频谱、波形）。

```js
const analyser = new THREE.AudioAnalyser(sound, 32); // 32 = fftSize/2

renderer.setAnimationLoop(() => {
  const data = analyser.getFrequencyData(); // Uint8Array，0~255
  // 用 data 驱动柱状图、缩放等
});
```

| 属性/方法 | 说明 |
|---|---|
| `fftSize` | FFT 大小（2 的幂，32~2048） |
| `analyser` | AnalyserNode |
| `data` | 频域数据数组 |
| `getFrequencyData()` | 频域数据（0~255） |
| `getAverageFrequency()` | 平均频率值 |

## 五、AudioLoader

```js
new THREE.AudioLoader().load(url, onLoad, onProgress, onError);
```

继承 Loader，`onLoad` 回调收到 `AudioBuffer`。

## 六、音频播放模板

```js
const listener = new THREE.AudioListener();
camera.add(listener);

// 背景音乐（非空间）
const bgm = new THREE.Audio(listener);
new THREE.AudioLoader().load('bgm.mp3', buffer => {
  bgm.setBuffer(buffer);
  bgm.setLoop(true);
  bgm.setVolume(0.5);
  bgm.play(); // 需在用户交互后
});

// 3D 音效
const sfx = new THREE.PositionalAudio(listener);
new THREE.AudioLoader().load('explosion.mp3', buffer => {
  sfx.setBuffer(buffer);
  sfx.setRefDistance(5);
  sfx.setRolloffFactor(1.5);
  sfx.play();
});
explosionMesh.add(sfx);
```
</script>

<script type="text/markdown" data-id="api-rendertarget" data-title="API 18 · 渲染目标与调试" data-group="API 速查手册">
# API 18 · 渲染目标与调试

## 一、WebGLRenderTarget（渲染目标）

不渲染到屏幕，而是渲染到纹理——后期处理、离屏渲染、反射都靠它。

```js
new THREE.WebGLRenderTarget(width, height, options)
```

### options 参数

| 参数 | 类型 | 默认值 | 说明 |
|---|---|---|---|
| `wrapS` / `wrapT` | `constant` | `ClampToEdgeWrapping` | 纹理包裹 |
| `magFilter` / `minFilter` | `constant` | `LinearFilter` | 过滤方式 |
| `format` | `constant` | `RGBAFormat` | 像素格式 |
| `type` | `constant` | `UnsignedByteType` | 数据类型 |
| `anisotropy` | `number` | `1` | 各向异性 |
| `depthBuffer` | `boolean` | `true` | 是否含深度缓冲 |
| `stencilBuffer` | `boolean` | `false` | 是否含模板缓冲 |
| `generateMipmaps` | `boolean` | `false` | 是否生成 mipmap |
| `colorSpace` | `string` | `NoColorSpace` | 颜色空间 |
| `samples` | `number` | `0` | MSAA 采样数（0=不开） |
| `count` | `number` | `1` | 多渲染目标（MRT）数量 |
| `depthTexture` | `DepthTexture` | `null` | 深度纹理 |

### 属性

| 属性 | 说明 |
|---|---|
| `width` / `height` | 尺寸 |
| `texture` | 渲染结果纹理（可当贴图用） |
| `textures` | 多渲染目标纹理数组 |
| `depthTexture` | 深度纹理 |
| `viewport` | 视口 |
| `scissor` / `scissorTest` | 裁剪 |

### 方法

| 方法 | 说明 |
|---|---|
| `setSize(width, height)` | 改尺寸 |
| `clone()` / `copy(source)` | 克隆/复制 |
| `dispose()` | 释放 |
| `texture` | 取纹理用于材质 |

```js
const rt = new THREE.WebGLRenderTarget(512, 512);
renderer.setRenderTarget(rt);
renderer.render(scene, camera);
renderer.setRenderTarget(null); // 切回屏幕

// 用渲染结果当贴图
mesh.material.map = rt.texture;
```

## 二、WebGLCubeRenderTarget（立方体渲染目标）

```js
new THREE.WebGLCubeRenderTarget(size, options)
```

配合 `CubeCamera` 做实时反射/环境贴图。

| 方法 | 说明 |
|---|---|
| `fromEquirectangularTexture(renderer, texture)` | 从全景图生成立方体贴图 |

## 三、DepthTexture（深度纹理）

```js
new THREE.DepthTexture(width, height, type, mapping, wrapS, wrapT, magFilter, minFilter, anisotropy, format)
```

| 属性 | 默认值 | 说明 |
|---|---|---|
| `format` | `DepthFormat` | 或 `DepthStencilFormat` |
| `type` | `UnsignedIntType` | 或 `UnsignedShortType`、`FloatType` |
| `compareFunction` | `null` | 阴影比较函数 |

## 四、DataTexture（数据纹理）

从原始数组创建纹理，做程序化图案、查找表（LUT）。

```js
const data = new Uint8Array(4 * 4 * 4); // 4x4 RGBA
const tex = new THREE.DataTexture(data, 4, 4, THREE.RGBAFormat);
tex.needsUpdate = true;
```

## 五、调试工具

### renderer.info 统计

```js
// 每帧打印 draw call 和三角形数
console.log(renderer.info.render.calls, renderer.info.render.triangles);
```

### 性能监测

| 工具 | 说明 |
|---|---|
| `renderer.info` | draw call、三角形、纹理数 |
| Chrome DevTools Performance | 帧率、CPU/GPU 时间 |
| Spector.js | 捕获 WebGL 调用（浏览器扩展） |
| `renderer.debug.checkShaderErrors` | 着色器错误检查（默认 true） |
| `renderer.debug.onShaderError` | 自定义错误处理回调 |

```js
renderer.debug.checkShaderErrors = true;
renderer.debug.onShaderError = (gl, program, vs, fs) => {
  console.error(gl.getShaderInfoLog(vs));
  console.error(gl.getShaderInfoLog(fs));
};
```

### 常用调试材质

| 材质 | 用途 |
|---|---|
| `MeshNormalMaterial()` | 看法线 |
| `MeshBasicMaterial({ wireframe:true })` | 看网格结构 |
| `MeshDepthMaterial()` | 看深度 |
| `scene.overrideMaterial` | 全局替换材质 |

### 常用调试技巧

```js
// 1. 包围盒可视化
const box = new THREE.Box3().setFromObject(mesh);
const helper = new THREE.Box3Helper(box, 0xffff00);
scene.add(helper);

// 2. 坐标轴辅助
scene.add(new THREE.AxesHelper(5)); // 红X 绿Y 蓝Z

// 3. 相机视锥可视化
scene.add(new THREE.CameraHelper(camera));

// 4. 法线辅助
scene.add(new THREE.VertexNormalsHelper(mesh, 0.2));

// 5. 灯光辅助
scene.add(new THREE.DirectionalLightHelper(light));
scene.add(new THREE.PointLightHelper(light));
scene.add(new THREE.SpotLightHelper(light));
scene.add(new THREE.CameraHelper(light.shadow.camera)); // 阴影范围

// 6. 网格地面
scene.add(new THREE.GridHelper(20, 20, 0x42b883, 0x35495e));

// 7. 极坐标网格
scene.add(new THREE.PolarGridHelper(10, 16));
```

### Helpers 完整列表

| Helper | 说明 |
|---|---|
| `AxesHelper` | 坐标轴 |
| `GridHelper` | 网格 |
| `PolarGridHelper` | 极坐标网格 |
| `BoxHelper` | 物体包围盒 |
| `Box3Helper` | Box3 可视化 |
| `CameraHelper` | 相机视锥 |
| `DirectionalLightHelper` | 平行光 |
| `PointLightHelper` | 点光 |
| `SpotLightHelper` | 聚光灯 |
| `HemisphereLightHelper` | 半球光 |
| `RectAreaLightHelper` | 面光源 |
| `VertexNormalsHelper` | 顶点法线 |
| `FaceNormalsHelper` | 面法线 |
| `SkeletonHelper` | 骨骼 |

::: tip 调试流程
遇到「什么都看不见」时，按顺序试：
1. F12 看控制台报错
2. `renderer.info.render.calls` 是否 > 0
3. 换成 `MeshNormalMaterial` 看物体在不在
4. 加 `AxesHelper` 确认坐标系和相机位置
5. 检查 `camera.position` 和 `mesh.position` 的距离
:::
</script>
